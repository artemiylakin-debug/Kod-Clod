<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>DATA.OUT v5.0</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<!-- настройки входа (Supabase, VK ID, Яндекс ID, Google, Apple); без этого файла игра работает без аккаунтов -->
<script src="online-config.js"></script>
</head>
<body>
<title>DATA.OUT v5.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Раскладка: на компьютере — заголовок, полоса HUD, холст 800×500, строка сообщений; меню лежит поверх поля. На сенсорном экране поле занимает весь экран, HUD, джойстик и кнопки лежат прямо на нём (боком — по краям поля). Одна светлая тема, как в оригинале. */
  :root{
    color-scheme:light;
    --bg:#f4f6fa;--ink:#057;--ink-2:#046;--muted:#689;--panel:#fff;--line:#0574;--kbd-line:#0576;
    --heart:#e02444;--score:#0a5;--level:#a2a;--emp:#39c;--trip:#a8691a;--danger:#c22;--win:#2a6;
    --c-chaser:#a33;--c-sniper:#a70;--c-heavy:#a4a;--c-pick:#2a6;--c-trojan:#c22;--c-glitch:#a2b;--c-worm:#8a6d00;--c-bot:#c24d16;
    --brand-vk:#0077ff;--brand-yandex:#fc3f1d;--brand-google:#34a853;--brand-apple:#111;
    --keys-bg:#eef;--keys-ink:#468;--keys-line:#57a;--shadow:#0572;
    --out:#eef2f7;--grid:rgba(0,120,150,.12);--glass:rgba(255,255,255,.72);--veil:rgba(244,246,250,.55);
    --font:'Courier New',Courier,ui-monospace,monospace;
  }
  html,body{height:100%;overscroll-behavior:none}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
  /* у min/max/clamp есть запасные значения для старых браузеров */
  #app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px;padding-bottom:8px;padding-left:16px;padding-right:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{margin:0;font-size:20px;font-size:clamp(15px,3.4vw,22px);letter-spacing:2px;letter-spacing:clamp(1px,.5vw,4px);text-align:center;text-wrap:balance}
  #ui{display:flex;gap:8px 10px;align-items:stretch;flex-wrap:wrap;justify-content:center}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 12px;display:flex;align-items:center;gap:8px}
  .stat .lbl{font-size:10px;color:var(--muted);letter-spacing:.5px}
  .stat .val{font-weight:bold;font-variant-numeric:tabular-nums}
  #hearts{color:var(--heart);font-size:16px}
  #dataVal,#scoreVal{color:var(--score);font-size:16px}
  #levelVal{color:var(--level);font-size:16px}
  #emp{color:var(--emp)}
  #keys{background:var(--keys-bg);border:1px dashed var(--keys-line);border-radius:6px;padding:4px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;color:var(--keys-ink);font-size:12px}
  kbd{background:var(--panel);border:1px solid var(--kbd-line);border-radius:4px;padding:0 6px;font-family:inherit}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #screen{position:relative}
  canvas{display:block}
  #c{background:var(--panel);border:2px solid var(--ink);border-radius:8px;box-shadow:0 4px 20px var(--shadow);touch-action:none}
  #msg{color:var(--level);font-weight:bold;min-height:18px;text-align:center;font-size:14px;text-wrap:balance}
  button:focus-visible{outline:3px solid var(--level);outline-offset:2px}
  /* Android подсвечивает нажатия синим прямоугольником — убираем */
  button,#screen{-webkit-tap-highlight-color:transparent}
  #stick,.pbtns,.tbtns,#rot,.rotp{display:none}
  @media (max-width:520px){.stat{padding:3px 8px;gap:6px}#hearts,#dataVal,#scoreVal,#levelVal{font-size:14px}}

  /* меню поверх поля */
  #menu{position:absolute;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;background:var(--veil);border-radius:8px}
  #menu[hidden]{display:none}
  .panel{box-sizing:border-box;width:100%;max-width:560px;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px var(--shadow);color:var(--ink)}
  .panel h2{margin:0;font-size:24px;font-size:clamp(20px,4vw,28px);letter-spacing:3px;text-align:center;text-wrap:balance}
  .panel h2.bad{color:var(--danger)}
  .panel h2.good{color:var(--win)}
  .panel p{margin:0;font-size:13px;line-height:1.45;color:var(--muted);text-align:center;text-wrap:balance}
  .panel p b{color:var(--ink)}
  .panel .sub{margin-top:-6px;font-size:11px;letter-spacing:2px}
  .panel .foot{font-size:11px}
  .panel .hp{color:var(--heart);font-size:16px}
  .panel .lbl2{font-size:10px;letter-spacing:1px}
  .panel .err{color:var(--danger)}
  /* кнопки входа на сайте: цветная метка сервиса слева от подписи */
  .prov{display:flex;align-items:center;justify-content:center;gap:8px}
  .prov::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
  .prov-vk{--pc:var(--brand-vk)}.prov-yandex{--pc:var(--brand-yandex)}.prov-google{--pc:var(--brand-google)}.prov-apple{--pc:var(--brand-apple)}
  .nick{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .nick input{font:14px var(--font);padding:8px 10px;border:2px solid var(--line);border-radius:8px;color:var(--ink);background:var(--panel)}
  .nick input:focus-visible{outline:3px solid var(--level);outline-offset:1px}
  /* iOS увеличивает страницу при вводе в поле со шрифтом мельче 16px */
  @media (pointer:coarse){.nick input{font-size:16px}}
  /* поле игры запрещает выделение, а без него iOS не даёт печатать в поля ввода */
  .panel input{user-select:text;-webkit-user-select:text}
  .lform{display:flex;flex-direction:column;gap:10px;margin:0}
  .mrow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .mcol{display:flex;flex-direction:column;gap:8px}
  .mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .acct{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
  .acct img{width:32px;height:32px;border-radius:50%;flex:none}
  .acct b{display:block;font-size:14px}
  .acct small{display:block;font-size:11px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .stats div{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
  .stats b{display:block;font-size:18px;color:var(--level);font-variant-numeric:tabular-nums}
  .stats span{font-size:10px;color:var(--muted)}
  .top{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .top li{display:grid;grid-template-columns:28px 24px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .top li.me{border-color:var(--ink);background:var(--keys-bg)}
  .top img{width:24px;height:24px;border-radius:50%}
  .top .rk{color:var(--muted);font-variant-numeric:tabular-nums}
  .top .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .sc{font-weight:bold;color:var(--score);font-variant-numeric:tabular-nums;text-align:right}
  .top small{display:block;font-weight:normal;font-size:10px;color:var(--muted)}
  @media (max-height:420px){.panel .intro{display:none}}
  .mbtn{font:bold 14px var(--font);color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
  .mbtn:hover:not(:disabled){background:var(--keys-bg)}
  .mbtn.primary{background:var(--ink);color:var(--panel)}
  .mbtn.primary:hover:not(:disabled){background:var(--ink-2)}
  .mbtn:disabled{opacity:.4;cursor:default}
  .lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .lvbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;text-align:left;font-size:12px;border-width:1px}
  .lvbtn b{font-size:15px;color:var(--level)}
  .lvbtn small{font-weight:normal;font-size:10px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .chip{display:flex;align-items:center;gap:6px;font:bold 12px var(--font);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--keys-bg)}
  .sw{width:12px;height:12px;border-radius:50%;flex:none}
  #pv{margin:0 auto;width:96px;height:96px}
  .help{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
  .help .r b{color:var(--c-chaser)}
  .help .y b{color:var(--c-sniper)}
  .help .p b{color:var(--c-heavy)}
  .help .g b{color:var(--c-pick)}
  .help .t b{color:var(--c-trojan)}
  .help .m b{color:var(--c-glitch)}
  .help .o b{color:var(--c-worm)}
  .help .b b{color:var(--c-bot)}
  .story p{color:var(--ink)}

  /* сенсорный экран: поле во весь экран, всё управление поверх него */
  @media (pointer:coarse){
    #keys{display:none}
    #screen{flex:1;align-self:stretch;min-width:0;box-sizing:border-box;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background-color:var(--out);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    #screen #c{position:absolute;border:0;border-radius:0;box-shadow:none;outline:1px dashed var(--keys-line)}
    #ui{position:absolute;z-index:2;top:8px;right:8px;bottom:8px;left:8px;margin:0;display:grid;grid-template-columns:auto 1fr auto;align-content:start;gap:4px;pointer-events:none}
    .s-data{grid-area:1/1}.s-score{grid-area:2/1}.s-level{grid-area:3/1}.s-hp{grid-area:4/1}
    .s-dash{grid-area:1/3}.s-trip{grid-area:2/3}.s-emp{grid-area:3/3}
    .stat{justify-self:start;background:var(--glass);padding:2px 8px;gap:6px}
    .s-dash,.s-trip,.s-emp{justify-self:end}
    .stat .lbl{font-size:9px}
    #hearts,#dataVal,#scoreVal,#levelVal,#emp{font-size:13px}
    #dash,#trip{font-size:12px}
    .tbtns{grid-area:4/3;justify-self:end;display:flex;gap:4px;pointer-events:auto}
    .tbtns button{font:bold 10px var(--font);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:4px 8px;touch-action:none}
    #msg{position:absolute;z-index:2;top:calc(var(--cvs-top,0px) + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:56%;max-width:min(56%,420px);min-height:0;font-size:12px;background:var(--glass);border-radius:6px;padding:3px 10px;pointer-events:none}
    #msg:empty{display:none}
    #stick{display:block;position:absolute;z-index:3;left:14px;bottom:14px;width:120px;height:120px;border-radius:50%;background:var(--glass);border:2px dashed var(--keys-line);opacity:.6;pointer-events:none}
    #stick.on{opacity:1}
    #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--ink);opacity:.8}
    /* дугой под большой палец: EMP слева, ПОДНОЖКА над РЫВКОМ */
    .pbtns{display:grid;grid-template-columns:auto auto;position:absolute;z-index:3;right:14px;bottom:14px;align-items:end;justify-items:center;gap:10px}
    .pbtns button{border-radius:50%;border:2px solid var(--ink);background:var(--glass);color:var(--ink);font:bold 12px var(--font);touch-action:none}
    .pbtns button:active{background:var(--keys-bg)}
    .pbtns button.off{opacity:.45}
    #bTrip{grid-area:1/2;width:64px;height:64px;border-color:var(--trip);color:var(--trip);font-size:10px}
    #bDash{grid-area:2/2;width:84px;height:84px}
    #bEmp{grid-area:2/1;width:64px;height:64px;margin-bottom:44px;border-color:var(--emp);color:var(--emp)}
    #rot{display:block;position:absolute;left:0;right:0;top:calc(var(--cvs-top,0px) - 26px);text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
    #screen.menu-open #ui,#screen.menu-open .pbtns,#screen.menu-open #stick,#screen.menu-open #msg,#screen.menu-open #rot{visibility:hidden}
    .panel{padding:12px 14px;gap:8px}
    .mbtn{padding:9px 10px;font-size:13px}
  }
  @media (pointer:coarse) and (orientation:portrait){.panel .rotp{display:block}}
  @media (pointer:coarse) and (orientation:landscape){
    h1,#rot{display:none}
    #app{padding-top:4px;padding-bottom:4px}
  }
</style>

<div id="app">
  <h1>DATA.OUT v5.0 — ПОБЕГ ИЗ КОРЗИНЫ</h1>
  <div id="ui">
    <div class="stat s-data"><span class="lbl">ДАННЫЕ</span><span class="val" id="dataVal">0/15</span></div>
    <div class="stat s-score"><span class="lbl">ОЧКИ</span><span class="val" id="scoreVal">0</span></div>
    <div class="stat s-level"><span class="lbl">УРОВЕНЬ</span><span class="val" id="levelVal">1/11</span></div>
    <div class="stat s-hp"><span class="lbl">ЗДОРОВЬЕ</span><span id="hearts">♥♥♥</span></div>
    <div class="stat s-dash"><span class="lbl">РЫВОК</span><span id="dash">▓▓▓▓▓</span></div>
    <div class="stat s-trip"><span class="lbl">ПОДНОЖКА</span><span id="trip">▓▓▓▓▓</span></div>
    <div class="stat s-emp"><span class="lbl">EMP</span><span class="val" id="emp">1</span></div>
    <div class="tbtns"><button id="bPause" type="button">ПАУЗА</button><button id="bFs" type="button" hidden>ВЕСЬ ЭКРАН</button></div>
    <div id="keys"><kbd>WASD</kbd> движение <kbd>SPACE</kbd> рывок <kbd>E</kbd> подножка <kbd>Q</kbd> EMP <kbd>P</kbd> пауза</div>
  </div>
  <div id="stage">
    <div id="screen">
      <canvas id="c" width="800" height="500" aria-label="Игровое поле DATA.OUT"></canvas>
      <div id="rot">↻ Поверни телефон боком — поле станет крупнее</div>
      <div id="stick" aria-hidden="true"><div id="knob"></div></div>
      <div class="pbtns"><button id="bTrip" type="button">ПОДНОЖКА</button><button id="bEmp" type="button">EMP</button><button id="bDash" type="button">РЫВОК</button></div>
      <div id="menu" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
    </div>
  </div>
  <div id="msg" role="status"></div>
</div>

<script>
document.documentElement.lang='ru';
// непрозрачный холст: браузеру не нужно смешивать его со страницей, это заметно легче на телефонах
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d',{alpha:false});
// логический размер поля фиксирован; реальный размер холста подгоняется под экран в fit()
const W=800,H=500,TAU=Math.PI*2,STEP=1000/60;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
// игра открыта внутри claude.ai (там есть аккаунты и рекорды) или как отдельная копия-файл
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
// копия игры на своём сайте (GitHub Pages) может подключить свою базу: настройки лежат рядом в online-config.js
const ONLINE=(!IN_CLAUDE&&window.DATA_OUT_ONLINE)||{};
const NET_ON=!!(ONLINE.supabaseUrl&&ONLINE.supabaseKey);
const $id=id=>document.getElementById(id);
const clampInt=(v,a,b,d)=>Number.isInteger(v)&&v>=a&&v<=b?v:d;
// подножка: радиус, сколько кадров враг лежит (5 с) и перезарядка (12 с — с 7 с врагов можно было держать на полу почти всё время)
const TRIP_R=140,TRIP_STUN=300,TRIP_CD=720;

// ================= ВВОД =================
// e.code не зависит от раскладки и Caps Lock: Q (й) и R (к) работают и на русской раскладке
const keys={};
const pressed={dash:0,emp:false,trip:0};
const joy={x:0,y:0};
let kbUser=false;
const NO_SCROLL=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
addEventListener('keydown',e=>{
  // в поле ввода (имя в рекордах, логин) клавиши — это просто текст; Esc из формы входа — назад
  if(e.target instanceof HTMLInputElement){
    if(e.code==='Escape'&&(menuScreen==='signin'||menuScreen==='signup'))showMenu(loginBack);
    return;
  }
  kbUser=true;
  // пробел на кнопке меню должен её нажимать, поэтому прокрутку гасим только вне кнопок
  if(NO_SCROLL.has(e.code)&&!(e.target instanceof HTMLButtonElement))e.preventDefault();
  keys[e.code]=true;
  if(!e.repeat)onPress(e.code);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('pointerdown',()=>{kbUser=false;},true);
// при потере фокуса keyup не приходит — без сброса клавиши «залипали»
addEventListener('blur',()=>{releaseAll();pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();pause();}});

// ================= УРОВНИ =================
// стены — «битые сектора» в координатах поля; центр поля, где появляется игрок, всегда свободен
const WALLS={
  cache:[{x:150,y:110,w:120,h:28},{x:530,y:110,w:120,h:28},{x:150,y:362,w:120,h:28},{x:530,y:362,w:120,h:28}],
  zip:[{x:200,y:70,w:28,h:170},{x:572,y:260,w:28,h:170},{x:340,y:400,w:120,h:26},{x:340,y:74,w:120,h:26}],
  drivers:[{x:100,y:236,w:140,h:28},{x:560,y:236,w:140,h:28},{x:386,y:60,w:28,h:110},{x:386,y:330,w:28,h:110}],
  backup:[{x:140,y:120,w:100,h:26},{x:560,y:120,w:100,h:26},{x:140,y:354,w:100,h:26},{x:560,y:354,w:100,h:26},{x:300,y:226,w:26,h:48},{x:474,y:226,w:26,h:48}],
  root:[{x:90,y:80,w:140,h:24},{x:90,y:80,w:24,h:120},{x:570,y:396,w:140,h:24},{x:686,y:300,w:24,h:120},{x:330,y:400,w:140,h:24},{x:330,y:76,w:140,h:24}]
};
// облако: потоки трафика — горизонтальные полосы, сносящие вправо (dir 1) или влево (-1);
// барьеры файрвола — полосы, которые 2,5 с выключены, ~1 с мигают и ~1,5 с горят (o — сдвиг цикла)
const FLOWS={
  gate:[{y:90,h:70,dir:1},{y:340,h:70,dir:-1}],
  dark:[{y:110,h:60,dir:-1},{y:330,h:60,dir:1}]
};
const GATES={
  firewall:[{x:180,y:40,w:16,h:420,o:0},{x:604,y:40,w:16,h:420,o:150},{x:260,y:118,w:280,h:16,o:75}],
  stream:[{x:100,y:242,w:200,h:16,o:0},{x:500,y:242,w:200,h:16,o:150}]
};
// последний уровень первого акта: после него — облако
const ACT1_END=10;
// первый уровень — исходная игра: тот же порядок усиления, что был у счётчика уровней
const CLASSIC_RAMP=['chaser','sniper','chaser','heavy','sniper','chaser'];
const RAMP=['chaser','sniper','chaser','heavy'];
// cap — сколько врагов (без троянов) может быть на поле сразу; tripCd — своя перезарядка подножки;
// trojan — шанс, что рядом с новыми данными появится троян; news — подсказка о новинке уровня

function guessTier(){
  const mem=navigator.deviceMemory||0,cores=navigator.hardwareConcurrency||0;
  if((mem&&mem<=2)||(cores&&cores<=2))return 'low';
  if(/Android/i.test(navigator.userAgent)||(mem&&mem<=4)||(cores&&cores<=4))return 'med';
  return 'high';
}

}

function inWall(x,y,pad){
  for(const w of walls)if(x>w.x-pad&&x<w.x+w.w+pad&&y>w.y-pad&&y<w.y+w.h+pad)return true;
  return false;
}
// выталкивает круг из стен и гасит скорость, направленную в стену
function pushOut(o,r){
  for(const w of walls){
    const cx=Math.max(w.x,Math.min(o.x,w.x+w.w)),cy=Math.max(w.y,Math.min(o.y,w.y+w.h));
    const dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
    if(d2>=r*r)continue;
    if(d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      o.x=cx+nx*r;o.y=cy+ny*r;
      const vn=o.vx*nx+o.vy*ny;
      if(vn<0){o.vx-=vn*nx;o.vy-=vn*ny;}
    }else{
      const l=o.x-w.x,rt=w.x+w.w-o.x,t=o.y-w.y,b=w.y+w.h-o.y,m=Math.min(l,rt,t,b);
      if(m===l){o.x=w.x-r;o.vx=Math.min(0,o.vx);}
      else if(m===rt){o.x=w.x+w.w+r;o.vx=Math.max(0,o.vx);}
      else if(m===t){o.y=w.y-r;o.vy=Math.min(0,o.vy);}
      else{o.y=w.y+w.h+r;o.vy=Math.max(0,o.vy);}
    }
  }
}
// зайдя на поле, враг остаётся в его границах: снайпер не стреляет из-за края экрана
function keepIn(e){
  if(!e.inside&&e.x>e.r&&e.x<W-e.r&&e.y>e.r&&e.y<H-e.r)e.inside=true;
  if(e.inside){
    if(e.x<e.r){e.x=e.r;e.vx=Math.abs(e.vx)*0.5;}else if(e.x>W-e.r){e.x=W-e.r;e.vx=-Math.abs(e.vx)*0.5;}
    if(e.y<e.r){e.y=e.r;e.vy=Math.abs(e.vy)*0.5;}else if(e.y>H-e.r){e.y=H-e.r;e.vy=-Math.abs(e.vy)*0.5;}
  }
  if(walls.length)pushOut(e,e.r);
}

// случайная точка поля вне стен и не ближе minDist к игроку
function freeSpot(minDist,margin,pad){
  for(let i=0;i<80;i++){
    const x=margin+Math.random()*(W-margin*2),y=margin+Math.random()*(H-margin*2);
    if(inWall(x,y,pad)||inGate(x,y,pad))continue;
    if(i<50&&Math.hypot(x-player.x,y-player.y)<minDist)continue;
    return{x,y};
  }
  return{x:W/2,y:H/2};
}

function activeEnemies(){return enemies.length-countType('trojan');}
function wormSeg(e,i){
  const n=e.hist.length/2,k=Math.max(0,n-1-i*WORM_GAP);
  return [e.hist[k*2],e.hist[k*2+1]];
}
// расстояние до врага; у червя — до ближайшего звена
function enemyDist(e,x,y){
  let d=Math.hypot(e.x-x,e.y-y);
  if(e.type==='worm')for(let i=1;i<=WORM_SEGS;i++){const s=wormSeg(e,i);d=Math.min(d,Math.hypot(s[0]-x,s[1]-y));}
  return d;
}
function edgePos(off){
  let p,tries=0;
  do{
    const side=Math.floor(Math.random()*4);
    if(side===0)p={x:-off,y:Math.random()*H};
    else if(side===1)p={x:W+off,y:Math.random()*H};
    else if(side===2)p={x:Math.random()*W,y:-off};
    else p={x:Math.random()*W,y:H+off};
  }while(++tries<12&&Math.hypot(p.x-player.x,p.y-player.y)<220);
  return p;
}
function spawnEnemy(type){
  const p=edgePos(30),c=LEVELS[lvl];
  if(type==='sniper')enemies.push({...p,vx:0,vy:0,r:11,speed:1.3,type,fireT:90,t:0});
  else if(type==='heavy')enemies.push({...p,vx:0,vy:0,r:19,speed:0.65,type,hp:2,t:0,touchCd:0});
  else if(type==='glitch')enemies.push({...p,vx:0,vy:0,r:10,speed:0.6,type,t:0,tp:90+Math.random()*60,warp:0,lunge:0,wx:0,wy:0});
  else if(type==='botnet'){
    // четыре мелких бота заходят на поле стайкой
    for(let k=0;k<4;k++)enemies.push({x:p.x+(k%2)*16-8,y:p.y+(k>>1)*16-8,vx:0,vy:0,r:7,speed:Math.min(2.2,1.6+lvl*0.02),type:'bot',t:0});
  }
  else if(type==='worm'){
    const hist=[];
    for(let i=0;i<WORM_HIST;i++)hist.push(p.x,p.y);
    enemies.push({...p,vx:0,vy:0,r:10,speed:Math.min(2.3,1.9+lvl*0.03),type,t:0,touchCd:0,ang:Math.atan2(player.y-p.y,player.x-p.x),hist});
  }
  // у скорости охотника есть потолок, иначе к концу уровня он вдвое быстрее игрока
  else enemies.push({...p,vx:0,vy:0,r:11,speed:Math.min(c.fast?2.8:2.3,1.4+threat*0.22+Math.min(lvl,ACT1_END)*0.03+(c.fast?0.3:0)),type:'chaser',t:0});
}
function spawnBoss(){
  const b=LEVELS[lvl].boss;
  // Капча выходит сразу под щитом — иначе первый EMP до её первого хода проходил бы насквозь
  boss={x:W/2,y:-70,r:b.r||42,t:0,hp:b.hp,maxHp:b.hp,vx:0,vy:0,kind:b.kind,name:b.name,ang:0,shield:b.kind==='captcha'};
  lastEmpDrop=time-300;
  msg('⚠ БОСС: «'+b.name+'» ВЫШЕЛ НА УДАЛЕНИЕ — БЕРЕГИСЬ И БЕРЕГИ EMP ⚠');
}
function spawnPortal(){
  const s=freeSpot(220,70,34);
  portal={x:s.x,y:s.y,r:26,t:0};
}
function shoot(x,y,a,sp,r,life){
  bullets.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:r||5,life:life||220});
}
function hitPlayer(){
  if(phase!=='game'||player.cool>0)return;
  burst(player.x,player.y,'#e33',20);
  lives--;shake=10;
  buzz(lives<=0?200:70);
  player.cool=90;
  player.vx=(Math.random()-0.5)*14;
  player.vy=(Math.random()-0.5)*14;
  if(lives<=0){
    lives=0;
    save.best=Math.max(save.best,score);persist();
    phase='dead';showMenu('dead');
  }
}
function levelClear(){
  save.best=Math.max(save.best,score);
  if(lvl>=LEVELS.length-1){
    save.unlocked=LEVELS.length;
    save.wins=(save.wins||0)+1;
    persist();
    phase='win';showMenu('win');
    return;
  }
  save.unlocked=Math.max(save.unlocked,lvl+2);persist();
  phase='clear';showMenu('clear');
}
function moveDust(){
  for(let i=0;i<Q.dust&&i<dust.length;i++){
    const d=dust[i];
    d.x+=d.vx;d.y+=d.vy;
    if(d.x<0)d.x=W;if(d.x>W)d.x=0;
    if(d.y<0)d.y=H;if(d.y>H)d.y=0;
  }
}
// удаление элементов на месте, без нового массива каждый кадр
function compact(arr,keep){
  let j=0;
  for(let i=0;i<arr.length;i++){const v=arr[i];if(keep(v))arr[j++]=v;}
  arr.length=j;
}

// ================= ЛОГИКА =================
function step(){
  time++;if(shake>0)shake--;if(boost>0)boost--;if(intro>0)intro--;
  const sk=SKIN_COLORS[selColor],cfg=LEVELS[lvl];

  // движение: вектор нормализован, иначе по диагонали скорость была в 1.41 раза выше
  const acc=player.dashT>0?0.15:0.35;
  const mult=boost>0?2:1;
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  let iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
  const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;}
  player.vx+=ix*acc*mult;player.vy+=iy*acc*mult;
  player.vx*=0.94;player.vy*=0.94;
  if(Math.hypot(player.vx,player.vy)>0.5)player.face=Math.atan2(player.vy,player.vx);

  // рывок — по нажатию SPACE (с буфером в 8 кадров), а не пока клавиша зажата
  if(player.dashCd>0)player.dashCd--;
  if(player.dashT>0)player.dashT--;
  if(pressed.dash>0){
    if(player.dashCd===0){
      pressed.dash=0;
      const d=Math.hypot(player.vx,player.vy);
      let dx,dy;
      if(d>0.5){dx=player.vx/d;dy=player.vy/d;}
      else{dx=Math.cos(player.face);dy=Math.sin(player.face);}
      player.vx=dx*16;player.vy=dy*16;
      player.dashT=14;player.dashCd=70;
      burst(player.x,player.y,sk.trail,12);
    }else pressed.dash--;
  }

  // подножка — как рывок, без предметов: охотники и снайперы рядом спотыкаются на 5 секунд
  if(player.tripCd>0)player.tripCd--;
  if(pressed.trip>0){
    if(player.tripCd===0){
      pressed.trip=0;
      player.tripCd=tripCdMax();
      tripFx={x:player.x,y:player.y,t:0};
      let n=0;
      for(const e of enemies){
        if(!TRIPPABLE[e.type])continue;
        const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy)||1;
        if(enemyDist(e,player.x,player.y)>TRIP_R+e.r)continue;
        e.trip=TRIP_STUN;e.tripRot=Math.random()*TAU;
        e.vx=dx/d*3;e.vy=dy/d*3;
        e.warp=0;e.lunge=0;
        n++;
      }
      burst(player.x,player.y,'#b7791f',14,3);
      buzz(25);
      msg(n?'ПОДНОЖКА! Споткнулись: '+n+' — беги!':'ПОДНОЖКА: рядом никого');
    }else pressed.trip--;
  }
  if(tripFx&&++tripFx.t>16)tripFx=null;

  // потоки трафика сносят в сторону
  for(const f of flows)if(player.y>f.y&&player.y<f.y+f.h)player.vx+=f.dir*0.12;

  player.x=Math.max(player.r,Math.min(W-player.r,player.x+player.vx));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y+player.vy));
  if(walls.length)pushOut(player,player.r);
  if(player.cool>0)player.cool--;
  if(player.empCd>0)player.empCd--;

  // шлейф скорости (длина зависит от графики); во время рывка и разгона он ярче
  trail.push({x:player.x,y:player.y,life:Q.trail,hot:player.dashT>0?1:(boost>0?2:0)});
  // после смены графики старые точки живут дольше новых, поэтому чистим весь шлейф, а не только начало
  for(const t of trail)t.life--;
  compact(trail,t=>t.life>0);
  if(boost>0&&Q.fx>=0.6&&time%2===0&&Math.hypot(player.vx,player.vy)>1.5){
    parts.push({x:player.x-player.vx*2+(Math.random()-0.5)*10,y:player.y-player.vy*2+(Math.random()-0.5)*10,vx:-player.vx*0.15,vy:-player.vy*0.15,life:20,color:'#fa0',sz:2+Math.random()*2});
  }

  // EMP
  if(pressed.emp){
    pressed.emp=false;
    if(emp>0&&player.empCd===0){
      emp--;player.empCd=25;shake=12;
      buzz(30);
      burst(player.x,player.y,'#39c',26,4);
      let gained=0;
      enemies=enemies.filter(e=>{
        const d=enemyDist(e,player.x,player.y);
        if(d>=170)return true;
        // у щитоносца 2 hp: первый заряд снимает щит, второй добивает
        if(e.type==='heavy'&&e.hp>1){
          e.hp--;e.touchCd=50;
          e.vx=(e.x-player.x)/(d||1)*9;e.vy=(e.y-player.y)/(d||1)*9;
          burst(e.x,e.y,'#92b',16);
          popup(e.x,e.y,'ЩИТ −1','#92b');
          return true;
        }
        const pts=PTS[e.type]||1;
        burst(e.x,e.y,'#e33',16);
        popup(e.x,e.y,'+'+pts,'#0a5');
        gained+=pts;
        return false;
      });
      bullets=[];
      if(boss&&bossDist(boss)<200&&boss.shield){
        popup(boss.x,boss.y-boss.r-26,'ЩИТ!','#39c');
        msg('Щит КАПЧИ держит EMP — бей, когда он погаснет');
      }else if(boss&&bossDist(boss)<200){
        boss.hp--;
        burst(boss.x,boss.y,'#39c',24);
        shake=14;
        if(boss.hp<=0){
          const name=boss.name;
          buzz(120);
          burst(boss.x,boss.y,'#f80',40,5);
          popup(boss.x,boss.y,'+5','#f80');
          boss=null;
          spawnPortal();
          gained+=5;
          msg('«'+name+'» УНИЧТОЖЕН! '+(lvl===ACT1_END?'ПОРТАЛ В ОБЛАКО':(lvl===LEVELS.length-1?'ВЫХОД В ОТКРЫТУЮ СЕТЬ':'ПОРТАЛ'))+' ОТКРЫТ — ВХОДИ!');
        }else{
          msg(boss.name+' повреждён: осталось ядер — '+boss.hp);
        }
      }else{
        msg('EMP-ВЗРЫВ!');
      }
      score+=gained;
    }
  }

  moveDust();

  // враги
  for(const e of enemies){
    e.t=(e.t||0)+1;
    if(e.touchCd>0)e.touchCd--;
    // споткнувшийся враг немного проезжает по инерции и лежит: не гонится, не стреляет, не ест данные
    if(e.trip>0){
      e.trip--;
      e.vx*=0.85;e.vy*=0.85;
      e.x+=e.vx;e.y+=e.vy;
      keepIn(e);
      continue;
    }
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    // троян стоит на месте; подойдёшь ближе 70 — через ¾ секунды взрывается кольцом пуль
    if(e.type==='trojan'){
      if(e.arm>0){
        if(--e.arm===0){
          for(let k=0;k<8;k++)shoot(e.x,e.y,k/8*TAU+e.t*0.1,2.6,4,120);
          burst(e.x,e.y,'#e33',16);shake=Math.max(shake,6);
          e.dead=true;
        }
      }else if(d<70){e.arm=45;popup(e.x,e.y-16,'!','#c22');}
      continue;
    }
    // червь ползёт к игроку плавной дугой, звенья повторяют путь головы
    if(e.type==='worm'){
      let da=Math.atan2(dy,dx)-e.ang;
      while(da>Math.PI)da-=TAU;
      while(da<-Math.PI)da+=TAU;
      e.ang+=Math.max(-0.05,Math.min(0.05,da))+Math.sin(e.t*0.08)*0.03;
      e.vx=Math.cos(e.ang)*e.speed;e.vy=Math.sin(e.ang)*e.speed;
      e.x+=e.vx;e.y+=e.vy;
      keepIn(e);
      if(Math.hypot(e.vx,e.vy)>0.1)e.ang=Math.atan2(e.vy,e.vx);
      e.hist.push(e.x,e.y);
      if(e.hist.length>WORM_HIST*2)e.hist.splice(0,2);
      continue;
    }
    // глитч дрейфует к игроку, а раз в 2–3 с телепортируется рядом и бросается
    if(e.type==='glitch'){
      if(e.warp>0){
        if(--e.warp===0){
          burst(e.x,e.y,'#c3f',10);
          e.x=e.wx;e.y=e.wy;e.inside=true;
          burst(e.x,e.y,'#c3f',10);
          const lx=player.x-e.x,ly=player.y-e.y,ld=Math.hypot(lx,ly)||1;
          e.vx=lx/ld*5.5;e.vy=ly/ld*5.5;e.lunge=18;
          e.tp=150+Math.random()*60;
        }
        continue;
      }
      if(e.lunge>0){
        e.lunge--;e.x+=e.vx;e.y+=e.vy;keepIn(e);
        if(e.lunge===0){e.vx*=0.3;e.vy*=0.3;}
        continue;
      }
      if(e.inside&&--e.tp<=0){
        const a=Math.random()*TAU,R=110+Math.random()*40;
        const wx=Math.max(30,Math.min(W-30,player.x+Math.cos(a)*R)),wy=Math.max(30,Math.min(H-30,player.y+Math.sin(a)*R));
        if(inWall(wx,wy,14)||Math.hypot(wx-player.x,wy-player.y)<80)e.tp=10;
        else{e.wx=wx;e.wy=wy;e.warp=40;}
      }
    }
    let mx=dx/d,my=dy/d;
    if(e.type==='sniper'){
      if(d<170){mx=-mx;my=-my;}
      e.fireT--;
      if(e.fireT<=0&&d<400){
        e.fireT=Math.max(60,110-threat*4-lvl*2);
        bullets.push({x:e.x,y:e.y,vx:dx/d*4,vy:dy/d*4,r:4,life:170});
      }
    }
    const k=e.type==='heavy'?0.03:0.08;
    e.vx+=mx*k*e.speed*2;e.vy+=my*k*e.speed*2;
    e.vx*=0.96;e.vy*=0.96;
    for(const f of flows)if(e.y>f.y&&e.y<f.y+f.h)e.vx+=f.dir*0.05;
    e.x+=e.vx;e.y+=e.vy;
    keepIn(e);
    // боты расталкивают друг друга, чтобы стайка не слипалась в одну точку
    if(e.type==='bot')for(const o of enemies){
      if(o===e||o.type!=='bot')continue;
      const sx=e.x-o.x,sy=e.y-o.y,s2=sx*sx+sy*sy;
      if(s2<196&&s2>0.01){const s=Math.sqrt(s2);e.x+=sx/s*0.6;e.y+=sy/s*0.6;}
    }
    if(e.type==='chaser'){
      for(let i=data.length-1;i>=0;i--){
        const dt=data[i];
        if(Math.hypot(dt.x-e.x,dt.y-e.y)<e.r+dt.r){
          burst(dt.x,dt.y,'#f80');
          data.splice(i,1);spawnData();
          if(activeEnemies()<capOf(cfg)){
            enemies.push({x:e.x,y:e.y,vx:-e.vx*1.5,vy:-e.vy*1.5,r:9,speed:e.speed,type:'chaser',t:0});
          }
        }
      }
    }
  }
  if(enemies.some(e=>e.dead))enemies=enemies.filter(e=>!e.dead);

  // касание врагов
  if(player.cool===0&&!player.dashT){
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(e.trip>0)continue;
      // наступил на троян — взрыв в следующем кадре
      if(e.type==='trojan'){
        if(!e.arm&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r)e.arm=1;
        continue;
      }
      // червь ранит любым звеном и после этого полсекунды не кусает
      if(e.type==='worm'){
        if(e.touchCd<=0&&enemyDist(e,player.x,player.y)<player.r+8){e.touchCd=50;hitPlayer();break;}
        continue;
      }
      if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
        if(e.type==='heavy'){
          if(e.touchCd<=0){
            e.touchCd=50;
            const d=Math.hypot(e.x-player.x,e.y-player.y)||1;
            e.vx=(e.x-player.x)/d*9;e.vy=(e.y-player.y)/d*9;
            hitPlayer();
          }
        }else if(e.type==='glitch'||e.type==='bot'){
          burst(e.x,e.y,e.type==='bot'?'#e8742a':'#c3f');
          enemies.splice(i,1);
          hitPlayer();
        }else{
          burst(e.x,e.y,'#e33');
          enemies.splice(i,1);
          spawnEnemy(Math.random()<0.3?'sniper':'chaser');
          hitPlayer();
        }
        break;
      }
    }
  }
  // после смерти кадр дальше не считается — иначе можно было «выиграть», уже погибнув
  if(phase!=='game')return;

  // барьеры файрвола ранят, пока горят; рывок проскакивает
  if(gates.length&&player.cool===0&&!player.dashT){
    for(const g of gates){
      if(gateState(g)!==2)continue;
      const cx=Math.max(g.x,Math.min(player.x,g.x+g.w)),cy=Math.max(g.y,Math.min(player.y,g.y+g.h));
      if(Math.hypot(player.x-cx,player.y-cy)<player.r-2){hitPlayer();break;}
    }
    if(phase!=='game')return;
  }

  // очистка по таймеру
  if(cfg.timer&&!portal&&!boss){
    if(purge>0)purge--;
    else if(player.cool===0){
      hitPlayer();
      purge=cfg.timer*60;
      burst(player.x,player.y,'#e33',30,5);
      if(phase==='game')msg('ОЧИСТКА '+cfg.name+'! Минус жизнь, таймер запущен заново');
    }
    if(phase!=='game')return;
  }

  // спам-пули с краёв поля
  if(cfg.storm&&intro===0&&!portal&&--stormT<=0){
    stormT=cfg.storm;
    const p=edgePos(10);
    shoot(p.x,p.y,Math.atan2(player.y-p.y,player.x-p.x)+(Math.random()-0.5)*0.7,2.6,4,320);
  }

  // босс
  if(boss){
    boss.t++;
    const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;
    if(boss.kind==='charge')bossCharge(boss);
    else{
      const ba=boss.kind==='final'||boss.kind==='admin'?0.055:(boss.kind==='pack'||boss.kind==='captcha'||boss.kind==='balance'?0.035:0.045);
      boss.vx+=(dx/d)*ba;boss.vy+=(dy/d)*ba;
      boss.vx*=0.97;boss.vy*=0.97;
      boss.x+=boss.vx;boss.y+=boss.vy;
    }
    bossFire(boss,Math.atan2(dy,dx));
    // Архиватор во время сжатия тянет игрока к себе; бегом можно вырваться, рывком — легко
    if(boss.pull&&d<450){player.vx-=dx/d*0.16;player.vy-=dy/d*0.16;}
    // рывок защищает и от босса, как от всех остальных
    if(Math.hypot(player.x-boss.x,player.y-boss.y)<player.r+boss.r*0.6&&player.cool===0&&!player.dashT)hitPlayer();
    // у Балансировщика ранят и сферы
    if(boss.kind==='balance'&&player.cool===0&&!player.dashT){
      const pts=bossPoints(boss);
      for(let i=1;i<pts.length;i++)if(Math.hypot(player.x-pts[i][0],player.y-pts[i][1])<player.r+16){hitPlayer();break;}
    }
    if(phase!=='game')return;
    // в бою с боссом заряд EMP появляется на поле не реже раза в 7 секунд
    if(time-lastEmpDrop>420&&!pickups.some(p=>p.type==='emp')){
      lastEmpDrop=time;
      dropPickup('emp');
    }
  }

  // пули
  compact(bullets,b=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+b.r&&player.cool===0&&!player.dashT){
      hitPlayer();
      return false;
    }
    if(walls.length&&inWall(b.x,b.y,b.r-1))return false;
    return b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20;
  });
  if(phase!=='game')return;

  // данные
  for(let i=data.length-1;i>=0;i--){
    const dt=data[i];dt.t++;
    if(Math.hypot(dt.x-player.x,dt.y-player.y)<player.r+dt.r+5){
      burst(dt.x,dt.y,'#0a5',12);
      popup(dt.x,dt.y,'+1','#0a5');
      data.splice(i,1);spawnData();
      score++;got++;
      // бонусы по расписанию: каждые 5 данных — EMP, каждые 10 — аптечка, каждые 12 — разгон
      if(!portal){
        if(got%5===0)dropPickup('emp');
        if(got%10===0)dropPickup('hp');
        if(got%12===0)dropPickup('boost');
      }
      if(got%5===0&&!portal){
        threat++;
        const type=cfg.ramp[(threat-2)%cfg.ramp.length];
        if(activeEnemies()<capOf(cfg)){spawnEnemy(type);msg('УГРОЗА '+threat+': '+RAMP_MSG[type]);}
      }
      if(got>=cfg.goal&&!boss&&!portal){
        if(cfg.boss)spawnBoss();
        else{spawnPortal();msg('ДАННЫЕ СОБРАНЫ — ПОРТАЛ ОТКРЫТ, ВХОДИ!');}
      }
    }
  }

  // усилители
  compact(pickups,p=>{
    p.t++;
    if(Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r+4){
      // при полном здоровье аптечка остаётся лежать, пока не понадобится
      if(p.type==='hp'){
        if(lives>=3)return true;
        lives++;
        burst(p.x,p.y,'#e33',14);popup(p.x,p.y,'+♥','#e02444');msg('АПТЕЧКА: +1 жизнь');buzz(40);
        return false;
      }
      burst(p.x,p.y,'#fa0',14);
      if(p.type==='emp'){emp++;popup(p.x,p.y,'EMP +1','#39c');msg('EMP-ЗАРЯД (Q)');}
      else{boost=240;popup(p.x,p.y,'РАЗГОН!','#fa0');msg('РАЗГОН: скорость x2!');}
      return false;
    }
    return true;
  });

  // портал — следующий уровень
  if(portal){
    portal.t++;
    if(Math.hypot(portal.x-player.x,portal.y-player.y)<portal.r+player.r){levelClear();return;}
  }

  compact(parts,p=>{
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life--;
    return p.life>0;
  });
  compact(texts,t=>{t.y-=0.7;t.life--;return t.life>0;});
}

// точки, по которым считаются касание и попадание EMP: ядро и, у Балансировщика, две сферы
function bossPoints(b){
  if(b.kind!=='balance')return [[b.x,b.y]];
  const cx=Math.cos(b.ang)*75,cy=Math.sin(b.ang)*75;
  return [[b.x,b.y],[b.x+cx,b.y+cy],[b.x-cx,b.y-cy]];
}
function bossDist(b){
  let d=1e9;
  for(const p of bossPoints(b))d=Math.min(d,Math.hypot(p[0]-player.x,p[1]-player.y));
  return d;
}

function bossFire(b,aim){
  const lost=b.maxHp-b.hp;
  let kind=b.kind;
  b.pull=false;b.shield=false;
  if(kind==='admin'){
    // Админ облака перебирает атаки по 5 с и время от времени зовёт ботнет
    kind=['ring','spiral','aimed','pack'][Math.floor(b.t/300)%4];
    if(b.t%720===0&&activeEnemies()<capOf(LEVELS[lvl]))spawnEnemy('botnet');
  }
  if(kind==='final'){
    kind=['ring','spiral','aimed'][Math.floor(b.t/300)%3];
    if(b.t%600===0&&activeEnemies()<capOf(LEVELS[lvl]))enemies.push({x:b.x,y:b.y,vx:0,vy:0,r:9,speed:2,type:'chaser',t:0,inside:true});
  }
  if(kind==='ring'){
    if(b.t%(b.kind==='final'?40:50)===0){
      const n=6+lost*2;
      for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*TAU+b.t*0.01,2.4);
    }
  }else if(kind==='aimed'){
    if(b.t%64===0)for(let i=-2;i<=2;i++)shoot(b.x,b.y,aim+i*0.18,3.2,4);
    if(b.t%160===80)for(let i=0;i<8;i++)shoot(b.x,b.y,i/8*TAU,2.2);
  }else if(kind==='spiral'&&b.t%5===0){
    b.ang+=0.27+lost*0.03;
    shoot(b.x,b.y,b.ang,2.3,4);
    if(b.kind==='final')shoot(b.x,b.y,b.ang+Math.PI,2.3,4);
  }else if(kind==='pack'){
    // цикл 4 с: 2,5 с обстрела веером, затем 1,5 с сжатия
    const c=b.t%240;
    b.pull=c>=150;
    if(c===150)popup(b.x,b.y-b.r-34,'СЖАТИЕ!','#b5651d');
    if(!b.pull&&b.t%70===0)for(let i=-1;i<=1;i++)shoot(b.x,b.y,aim+i*0.3,2.4);
  }else if(kind==='balance'){
    // две сферы кружат вокруг ядра, по очереди стреляют в игрока и иногда дают кольцо
    b.ang+=0.025+lost*0.004;
    const pts=bossPoints(b);
    if(b.t%50===0){const o=pts[1+(b.t/50)%2];shoot(o[0],o[1],Math.atan2(player.y-o[1],player.x-o[0]),3);}
    if(b.t%200===100)for(let k=1;k<3;k++)for(let i=0;i<6;i++)shoot(pts[k][0],pts[k][1],i/6*TAU,2.2);
  }else if(kind==='captcha'){
    // цикл 5,5 с: 3,3 с под щитом (стреляет крестами), 2,2 с без щита (уязвима и молчит)
    const c=b.t%330;
    b.shield=c<200;
    if(c===200)popup(b.x,b.y-b.r-34,'ЩИТ СНЯТ — БЕЙ!','#39c');
    if(b.shield&&b.t%60===0){
      const r0=(b.t/60)%2?Math.PI/8:0;
      for(let i=0;i<8;i++)shoot(b.x,b.y,r0+i/8*TAU,2.6,4);
    }
  }
}

// Дефрагментатор: заходит на поле, секунду целится (красная линия), таранит до края и отдыхает
function bossCharge(b){
  const lost=b.maxHp-b.hp;
  if(!b.mode)b.mode='enter';
  if(b.mode==='enter'){
    b.y+=2;
    if(b.y>=b.r+20){b.mode='aim';b.mt=60;b.tx=player.x;b.ty=player.y;}
  }else if(b.mode==='aim'){
    b.tx+=(player.x-b.tx)*0.08;b.ty+=(player.y-b.ty)*0.08;
    if(--b.mt<=0){
      const a=Math.atan2(b.ty-b.y,b.tx-b.x);
      b.cvx=Math.cos(a)*9;b.cvy=Math.sin(a)*9;
      b.mode='dash';b.mt=0;
    }
  }else if(b.mode==='dash'){
    b.x+=b.cvx;b.y+=b.cvy;b.mt++;
    if(b.mt%5===0){
      const pa=Math.atan2(b.cvy,b.cvx)+Math.PI/2;
      shoot(b.x,b.y,pa,1.1,4,200);shoot(b.x,b.y,pa+Math.PI,1.1,4,200);
    }
    if(b.x<b.r||b.x>W-b.r||b.y<b.r||b.y>H-b.r||b.mt>120){
      b.x=Math.max(b.r,Math.min(W-b.r,b.x));b.y=Math.max(b.r,Math.min(H-b.r,b.y));
      b.mode='rest';b.mt=70;shake=Math.max(shake,8);
      const n=8+lost*2;
      for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*TAU,2.2);
    }
  }else if(b.mode==='rest'){
    if(--b.mt<=0){b.mode='aim';b.mt=Math.max(35,60-lost*8);b.tx=player.x;b.ty=player.y;}
  }
}

// shadowBlur на телефонах был главной причиной тормозов
const SPR=3;
function makeSprite(size,draw){
  const c=document.createElement('canvas');
  c.width=c.height=Math.ceil(size*SPR);
  const g=c.getContext('2d');
  g.scale(SPR,SPR);g.translate(size/2,size/2);
  draw(g);
  c.size=size;
  return c;
}
function drawSprite(s,x,y,rot,sc){
  const z=s.size*(sc||1);
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.drawImage(s,-z/2,-z/2,z,z);
  ctx.restore();
}
function rgba(hex,a){
  const h=hex.slice(1),f=h.length===3?h.split('').map(x=>x+x):h.match(/../g);
  return 'rgba('+f.map(x=>parseInt(x,16)).join(',')+','+a+')';
}
function polyPath(c,n,r,rot){
  c.beginPath();
  for(let i=0;i<n;i++){
    const a=i/n*TAU+rot;
    c[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);
  }
  c.closePath();
}

// фон поля (белая клетка и стены) хранится готовым и кладётся одним drawImage
const bgCanvas=document.createElement('canvas'),bgx=bgCanvas.getContext('2d');
function buildBg(){
  bgCanvas.width=cvs.width;bgCanvas.height=cvs.height;
  bgx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);
  // в облаке (акт 2) поле чуть голубее
  bgx.fillStyle=bgTint?'#f3f7ff':'#fff';bgx.fillRect(0,0,W,H);
  bgx.strokeStyle=bgTint?'rgba(70,110,200,0.17)':'rgba(0,120,150,0.16)';bgx.lineWidth=1;
  bgx.beginPath();
  for(let x=0;x<W;x+=40){bgx.moveTo(x,0);bgx.lineTo(x,H);}
  for(let y=0;y<H;y+=40){bgx.moveTo(0,y);bgx.lineTo(W,y);}
  bgx.stroke();
  bgx.fillStyle='rgba(51,153,204,0.09)';
  for(const f of flows)bgx.fillRect(0,f.y,W,f.h);
  for(const w of walls){
    bgx.fillStyle='#e2e9f1';bgx.fillRect(w.x,w.y,w.w,w.h);
    bgx.save();bgx.beginPath();bgx.rect(w.x,w.y,w.w,w.h);bgx.clip();
    bgx.strokeStyle='rgba(0,85,119,0.25)';bgx.lineWidth=2;bgx.beginPath();
    for(let i=-w.h;i<w.w;i+=10){bgx.moveTo(w.x+i,w.y+w.h);bgx.lineTo(w.x+i+w.h,w.y);}
    bgx.stroke();bgx.restore();
    bgx.strokeStyle='#057';bgx.lineWidth=2;bgx.strokeRect(w.x+1,w.y+1,w.w-2,w.h-2);
  }
}

function drawHeart(cx,cy,s,fill){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  ctx.beginPath();
  ctx.moveTo(0,0.35);
  ctx.bezierCurveTo(-1.1,-0.6,-0.35,-1.3,0,-0.55);
  ctx.bezierCurveTo(0.35,-1.3,1.1,-0.6,0,0.35);
  ctx.closePath();
  ctx.fillStyle=fill?'#e02444':'#eee';
  ctx.fill();
  ctx.restore();
}

// full — рисовать с полным качеством независимо от настройки (превью в меню)
function drawPlayerBody(c,p,t,full){
  const sk=SKIN_COLORS[selColor],f=p.face;
  c.save();c.translate(p.x,p.y);
  const stretch=Math.min(0.4,Math.hypot(p.vx,p.vy)*0.02);
  c.rotate(f);c.scale(1+stretch,1-stretch*0.5);c.rotate(-f);

  // свечение — готовый спрайт вместо shadowBlur
  if(full||Q.glow){
    const gl=glowSprite(selColor);
    c.drawImage(gl,-gl.size/2,-gl.size/2,gl.size,gl.size);
  }

  // кольца
  c.strokeStyle=sk.ring;c.lineWidth=2.5;
  c.save();c.rotate(t*0.05);
  for(let i=0;i<3;i++){
    c.rotate(TAU/3);
    c.beginPath();c.arc(0,0,p.r+7,0,TAU*0.22);c.stroke();
  }
  c.restore();

  // тело по форме
  const rot=t*0.02;
  const rr=p.r*(1+Math.sin(t*0.1)*0.05);
  if(full||Q.grad){
    const grad=c.createRadialGradient(-4,-4,2,0,0,rr+4);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.4,sk.main);
    grad.addColorStop(1,sk.dark);
    c.fillStyle=grad;
  }else c.fillStyle=sk.main;
  if(selShape===0)polyPath(c,6,rr,rot);
  else if(selShape===1){c.beginPath();c.arc(0,0,rr,0,TAU);}
  else polyPath(c,4,rr+2,rot+Math.PI/4);
  c.fill();
  c.strokeStyle=sk.dark;c.lineWidth=1.5;c.stroke();

  // глаза
  c.fillStyle=sk.dark;
  const ex=Math.cos(f)*4,ey=Math.sin(f)*4;
  c.beginPath();c.arc(ex-4+ey*0.5,ey-ex*0.5,2.6,0,TAU);c.fill();
  c.beginPath();c.arc(ex+4+ey*0.5,ey+ex*0.5,2.6,0,TAU);c.fill();
  c.restore();
}

function drawPlayer(){
  const sk=SKIN_COLORS[selColor];
  const p=player;
  for(const t of trail){
    const a=Math.min(1,t.life/Q.trail);
    ctx.globalAlpha=a*(t.hot?0.6:0.35);
    ctx.fillStyle=t.hot===2?'#fa0':(t.hot===1?sk.main:sk.trail);
    ctx.beginPath();ctx.arc(t.x,t.y,3+6*a,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  // линии скорости при рывке и разгоне
  const sp=Math.hypot(p.vx,p.vy);
  if((boost>0||p.dashT>0)&&sp>2){
    const ux=p.vx/sp,uy=p.vy/sp,len=6+sp*2.2;
    ctx.strokeStyle=p.dashT>0?sk.main:'#fa0';ctx.lineWidth=2;ctx.globalAlpha=0.75;
    ctx.beginPath();
    for(let i=-1;i<=1;i++){
      const ox=-uy*i*8,oy=ux*i*8,st=20+Math.abs(i)*6;
      ctx.moveTo(p.x-ux*st+ox,p.y-uy*st+oy);ctx.lineTo(p.x-ux*(st+len)+ox,p.y-uy*(st+len)+oy);
    }
    ctx.stroke();ctx.globalAlpha=1;
  }
  if(p.cool>0&&Math.floor(time/4)%2===1)return;
  drawPlayerBody(ctx,p,time);

  // сердечки над игроком
  for(let i=0;i<3;i++)drawHeart(p.x-20+i*16,p.y-30,6,i<lives);

  // полоски: рывок, подножка и оставшийся разгон
  ctx.fillStyle='#0001';ctx.fillRect(p.x-16,p.y+22,32,4);ctx.fillRect(p.x-16,p.y+27,32,3);
  ctx.fillStyle=sk.ring;ctx.fillRect(p.x-16,p.y+22,32*Math.max(0,1-p.dashCd/70),4);
  ctx.fillStyle='#b7791f';ctx.fillRect(p.x-16,p.y+27,32*Math.max(0,1-(p.tripCd||0)/tripCdMax()),3);
  if(boost>0){ctx.fillStyle='#fa0';ctx.fillRect(p.x-16,p.y+31,32*boost/240,3);}
}

function drawEnemy(e){
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  if(e.type==='worm'){drawWorm(e);if(e.trip>0)drawStars(e);return;}
  if(e.trip>0){
    // споткнулся: полсекунды кувыркается, потом лежит
    ctx.globalAlpha=0.7;
    const spr=e.type==='sniper'?SPR_SNIPER:(e.type==='glitch'?SPR_GLITCH:(e.type==='bot'?SPR_BOT:SPR_CHASER));
    drawSprite(spr,e.x,e.y,e.trip>TRIP_STUN-30?time*0.35:e.tripRot,e.type==='glitch'||e.type==='bot'?1:e.r/11);
    ctx.globalAlpha=1;
    drawStars(e);
    return;
  }
  if(e.type==='trojan'){
    // от настоящих данных отличает красная точка в центре и вращение в другую сторону
    const red=e.arm>0&&Math.floor(e.arm/4)%2===0;
    drawSprite(red?SPR_TROJAN:SPR_DATA,e.x,e.y,-e.t*0.05,1+Math.sin(e.t*0.12)*0.25);
    ctx.fillStyle='#d22';ctx.beginPath();ctx.arc(e.x,e.y,1.8,0,TAU);ctx.fill();
    if(e.arm>0){ctx.strokeStyle='#e33';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,10+(45-e.arm)*0.4,0,TAU);ctx.stroke();}
    return;
  }
  if(e.type==='glitch'){
    // перед прыжком — пунктирный круг там, где он появится
    if(e.warp>0){
      ctx.strokeStyle='#c3f';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(e.wx,e.wy,10+e.warp*0.4,0,TAU);ctx.stroke();ctx.setLineDash([]);
    }
    const j=e.warp>0?3:1;
    drawSprite(SPR_GLITCH,e.x+(Math.random()-0.5)*2*j,e.y+(Math.random()-0.5)*2*j,a,1);
    return;
  }
  if(e.type==='heavy'){
    drawSprite(SPR_HEAVY,e.x,e.y,a+time*0.01,1);
    ctx.fillStyle='#401';
    ctx.beginPath();ctx.arc(e.x+Math.cos(a)*e.r*0.15,e.y+Math.sin(a)*e.r*0.15,e.r*0.22,0,TAU);ctx.fill();
    ctx.fillStyle='#0002';ctx.fillRect(e.x-14,e.y-e.r-9,28,4);
    ctx.fillStyle='#92b';ctx.fillRect(e.x-14,e.y-e.r-9,14*e.hp,4);
  }else if(e.type==='bot'){
    drawSprite(SPR_BOT,e.x,e.y,a,1);
  }else{
    drawSprite(e.type==='sniper'?SPR_SNIPER:SPR_CHASER,e.x,e.y,a,e.r/11);
  }
}

// opaque — нарисовать фон без шлейфов (после смены размера холста или для застывшего кадра)
function render(opaque){
  if(!ready)return;
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);
  // фон: полупрозрачный слой оставляет шлейфы за всем, что движется (так задумано)
  // на низкой графике фон кладётся сразу целиком: без шлейфов, зато дешевле
  ctx.globalAlpha=opaque||!Q.ghost?1:0.4;
  ctx.drawImage(bgCanvas,0,0,W,H);
  ctx.fillStyle='#068';
  for(let i=0;i<Q.dust&&i<dust.length;i++){const d=dust[i];ctx.globalAlpha=d.a;ctx.fillRect(d.x,d.y,d.s,d.s);}
  ctx.globalAlpha=1;
  if(phase==='menu'){updateHud();return;}

  const cfg=LEVELS[lvl];
  ctx.save();
  if(shake>0&&phase==='game'&&!RM)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // данные
  for(const dt of data)drawSprite(SPR_DATA,dt.x,dt.y,dt.t*0.05,1+Math.sin(dt.t*0.12)*0.25);

  // усилители
  ctx.font='bold 13px Courier New, monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=2;
  for(const p of pickups){
    const y=p.y+Math.sin(p.t*0.08)*3,col=PICK[p.type].color;
    // запасная аптечка при полном здоровье бледнее — её пока не взять
    if(p.type==='hp'&&lives>=3)ctx.globalAlpha=0.45;
    ctx.strokeStyle=col;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(p.x,y,p.r,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;
    if(p.type==='hp'){ctx.fillRect(p.x-6,y-2,12,4);ctx.fillRect(p.x-2,y-6,4,12);}
    else if(p.type==='emp'){ctx.font='bold 8px Courier New, monospace';ctx.fillText('EMP',p.x,y+1);}
    else{ctx.font='bold 13px Courier New, monospace';ctx.fillText('»',p.x,y+1);}
    ctx.globalAlpha=1;
  }
  ctx.textBaseline='alphabetic';

  // потоки трафика — бегущие стрелки; барьеры файрвола — пунктир, мигание, красная полоса
  if(flows.length){
    ctx.strokeStyle='rgba(51,153,204,0.45)';ctx.lineWidth=2;ctx.beginPath();
    for(const f of flows){
      const cy=f.y+f.h/2,off=((time*1.5*f.dir)%50+50)%50;
      for(let x=-50+off;x<W+50;x+=50){ctx.moveTo(x-5*f.dir,cy-7);ctx.lineTo(x+5*f.dir,cy);ctx.lineTo(x-5*f.dir,cy+7);}
    }
    ctx.stroke();
  }
  for(const g of gates){
    const st=gateState(g);
    if(st===2){
      ctx.fillStyle='rgba(230,40,50,0.55)';ctx.fillRect(g.x,g.y,g.w,g.h);
      ctx.strokeStyle='#c22';ctx.lineWidth=2;ctx.strokeRect(g.x,g.y,g.w,g.h);
    }else if(st===1){
      if(Math.floor(time/5)%2===0){ctx.strokeStyle='#e33';ctx.lineWidth=2;ctx.strokeRect(g.x,g.y,g.w,g.h);}
    }else{
      ctx.strokeStyle='rgba(204,34,34,0.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);
      ctx.strokeRect(g.x,g.y,g.w,g.h);ctx.setLineDash([]);
    }
  }

  // в темноте прячутся данные и бонусы, а враги, портал и пули видны — иначе нечестно
  if(cfg.dark)ctx.drawImage(darkSprite(cfg.dark),player.x-W,player.y-H,W*2,H*2);

  // портал
  if(portal){
    const p=portal;
    ctx.save();ctx.translate(p.x,p.y);
    ctx.rotate(p.t*0.03);
    ctx.strokeStyle='#2a6';ctx.lineWidth=4;ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.arc(0,0,p.r+Math.sin(p.t*0.1)*4,0,TAU);ctx.stroke();
    ctx.setLineDash([]);ctx.rotate(-p.t*0.03);
    ctx.fillStyle='#2a64';
    ctx.beginPath();ctx.arc(0,0,p.r*0.5+Math.sin(p.t*0.08)*2,0,TAU);ctx.fill();
    ctx.restore();
  }

  enemies.forEach(drawEnemy);

  // босс
  if(boss){
    const b=boss;
    // сжатие Архиватора — сходящиеся кольца; прицел Дефрагментатора — красная линия
    if(b.pull){
      ctx.strokeStyle=cfg.boss.c2;ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.globalAlpha=0.6;
      for(let i=0;i<3;i++){const r=200-((time*3+i*60)%160);ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.stroke();}
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    if(b.mode==='aim'){
      const a=Math.atan2(b.ty-b.y,b.tx-b.x);
      ctx.strokeStyle='#e33';ctx.lineWidth=b.mt<20?3:1.5;ctx.setLineDash([10,6]);
      ctx.globalAlpha=b.mt<20&&Math.floor(time/3)%2?1:0.6;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*1000,b.y+Math.sin(a)*1000);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    // щит Капчи — пульсирующее синее кольцо
    if(b.shield){
      ctx.strokeStyle='#39c';ctx.lineWidth=3;ctx.globalAlpha=0.55+0.3*Math.sin(time*0.2);
      ctx.beginPath();ctx.arc(b.x,b.y,58,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }
    if(b.kind==='balance'){
      const pts=bossPoints(b),spr=bossSprite(cfg.boss);
      ctx.strokeStyle=cfg.boss.c2;ctx.lineWidth=2;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(pts[1][0],pts[1][1]);ctx.lineTo(pts[2][0],pts[2][1]);ctx.stroke();ctx.setLineDash([]);
      drawSprite(spr,b.x,b.y,b.t*0.01,0.6);
      drawSprite(spr,pts[1][0],pts[1][1],-b.t*0.03,0.42);
      drawSprite(spr,pts[2][0],pts[2][1],-b.t*0.03,0.42);
    }else drawSprite(bossSprite(cfg.boss),b.x,b.y,b.t*0.01,1);
    ctx.fillStyle='#0002';ctx.fillRect(b.x-40,b.y-b.r-16,80,6);
    ctx.fillStyle=cfg.boss.c2;ctx.fillRect(b.x-40,b.y-b.r-16,80/b.maxHp*Math.max(0,b.hp),6);
    ctx.fillStyle='#057';ctx.font='bold 11px Courier New, monospace';ctx.textAlign='center';
    ctx.fillText(b.name,b.x,b.y-b.r-21);
  }

  // пули
  for(const b of bullets){
    const z=SPR_BULLET.size*b.r/5;
    ctx.drawImage(SPR_BULLET,b.x-z/2,b.y-z/2,z,z);
  }

  // волна подножки расходится от игрока на весь радиус
  if(tripFx){
    const k=tripFx.t/16;
    ctx.globalAlpha=1-k;ctx.strokeStyle='#b7791f';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(tripFx.x,tripFx.y,20+(TRIP_R-20)*k,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }

  drawPlayer();

  for(const p of parts){
    ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life/40);
    ctx.fillRect(p.x,p.y,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
  ctx.font='bold 14px Courier New, monospace';ctx.textAlign='center';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.life/25);
    ctx.fillStyle=t.color;
    ctx.fillText(t.str,t.x,t.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // таймер очистки — внизу по центру
  if(cfg.timer&&!portal&&!boss){
    const s=Math.ceil(purge/60),low=s<=10;
    ctx.textAlign='center';ctx.font='bold 14px Courier New, monospace';
    ctx.fillStyle=low?'#c22':'#057';
    ctx.fillText('ОЧИСТКА '+cfg.name+' ЧЕРЕЗ '+s+' с',W/2,H-22);
    ctx.fillStyle='#0001';ctx.fillRect(W/2-100,H-14,200,4);
    ctx.fillStyle=low?'#e33':'#0a5';ctx.fillRect(W/2-100,H-14,200*purge/(cfg.timer*60),4);
  }

  // заставка уровня
  if(intro>0){
    ctx.globalAlpha=Math.min(1,intro/30);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(0,96,W,114);
    ctx.textAlign='center';
    ctx.fillStyle='#a2a';ctx.font='bold 14px Courier New, monospace';
    ctx.fillText('УРОВЕНЬ '+(lvl+1)+' ИЗ '+LEVELS.length,W/2,120);
    ctx.fillStyle='#057';ctx.font='bold 30px Courier New, monospace';
    ctx.fillText(cfg.name,W/2,153);
    ctx.fillStyle='#689';ctx.font='14px Courier New, monospace';
    ctx.fillText(objective(cfg),W/2,178);
    ctx.font='12px Courier New, monospace';
    ctx.fillText(features(cfg),W/2,198);
    ctx.globalAlpha=1;
  }

  // счётчик кадров — включается в настройках
  if(save.fps){
    const s=fpsShown+' FPS · '+tierName();
    ctx.font='bold 11px Courier New, monospace';ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(4,H-20,ctx.measureText(s).width+8,16);
    ctx.fillStyle='#057';ctx.fillText(s,8,H-8);
  }
  updateHud();
}

// превью облика в меню
function drawPreview(){
  const pv=$id('pv');
  if(!pv)return;
  const c=pv.getContext('2d'),s=pv.width/52;
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,pv.width,pv.height);
  c.setTransform(s,0,0,s,0,0);
  drawPlayerBody(c,{x:26,y:26,vx:0,vy:0,r:14,face:-Math.PI/2},time,true);
}

// ================= HUD =================
const msgEl=$id('msg');
const hudEl={data:$id('dataVal'),score:$id('scoreVal'),level:$id('levelVal'),hearts:$id('hearts'),dash:$id('dash'),trip:$id('trip'),emp:$id('emp'),bEmp:$id('bEmp'),bDash:$id('bDash'),bTrip:$id('bTrip')};
const hudLast={};
function setHud(k,v){v=String(v);if(hudLast[k]!==v){hudLast[k]=v;hudEl[k].textContent=v;}}
function setOff(k,off){if(hudLast[k+'Off']!==off){hudLast[k+'Off']=off;hudEl[k].classList.toggle('off',off);}}
function updateHud(){
  const c=LEVELS[lvl];
  setHud('data',Math.min(got,c.goal)+'/'+c.goal);
  setHud('score',score);
  setHud('level',(lvl+1)+'/'+LEVELS.length);
  const l=Math.max(0,Math.min(3,lives));
  setHud('hearts','♥'.repeat(l)+'♡'.repeat(3-l));
  const cd=Math.min(5,Math.ceil(player.dashCd/14));
  setHud('dash','▓'.repeat(5-cd)+'░'.repeat(cd));
  const tc=Math.min(5,Math.ceil((player.tripCd||0)/(tripCdMax()/5)));
  setHud('trip','▓'.repeat(5-tc)+'░'.repeat(tc));
  setOff('bTrip',(player.tripCd||0)>0);
  setHud('emp',emp);
  setHud('bEmp','EMP ×'+emp);
  setOff('bDash',player.dashCd>0);
  setOff('bEmp',emp<=0||player.empCd>0);
}

function showMenu(s,focusAct){

  if(kbUser){

    if(b)b.focus({preventScroll:true});
  }
  // текст ошибки входа приходит и от сервера, поэтому только textContent
  const er=panelEl.querySelector('.err');
  if(er&&NET.err&&(s==='gate'||s==='acct')){er.textContent=NET.err;er.hidden=false;}
  if(s==='skins')drawPreview();
  if(s==='main'||s==='acct')fillAccount();

}
function hideMenu(){
  if(menuEl.contains(document.activeElement))document.activeElement.blur();
  menuEl.hidden=true;
  screenEl.classList.remove('menu-open');
}
function goMenu(){
  phase='menu';
  walls=[];flows=[];gates=[];bgTint=false;boost=0;shake=0;
  buildBg();

}
function setSkin(c,s,focusAct){
  selColor=c;selShape=s;
  save.color=c;save.shape=s;persist();
  showMenu('skins',focusAct);
}
function act(a){
  const k=a.split(':')[0],n=Number(a.split(':')[1]);
  if(k==='play')newRun(save.unlocked-1);
  else if(k==='new'||k==='again')newRun(0);
  else if(k==='lv'){if(n<save.unlocked)newRun(n);}
  else if(k==='color')setSkin(n,selShape,a);
  else if(k==='shape')setSkin(selColor,n,a);
  else if(k==='resume')resume();
  else if(k==='restart')retryLevel(false);
  else if(k==='retry')retryLevel(true);
  else if(k==='next')nextLevel();
  else if(k==='settings'){settingsBack=menuScreen==='pause'?'pause':'main';showMenu('settings');}
  else if(k==='q'){
    const v=a.split(':')[1];
    save.q=v;
    if(v==='auto'){save.autoTier=guessTier();save.autoRes=1;}
    persist();applyQuality();showMenu('settings',a);
  }
  else if(k==='fps'){save.fps=n===1;persist();showMenu('settings',a);if(phase!=='game')render(true);}
  else if(k==='vib'){save.vib=n===1;persist();buzz(40);showMenu('settings',a);}
  else if(k==='login')netLogin(a.split(':')[1]);
  else if(k==='signin'||k==='signup'){if(menuScreen==='gate'||menuScreen==='acct')loginBack=menuScreen;showMenu(k);}
  else if(k==='guest'){setGuest(true);NET.err='';showMenu('main');}
  else if(k==='logout')netLogout();
  else if(k==='nick'){
    const inp=$id('nick');
    if(inp){save.nick=inp.value.replace(/\s+/g,' ').trim().slice(0,20);inp.value=nickName();persist();}
  }
  else if(k==='menu')goMenu();
  else showMenu(k);
}

  if(b&&!b.disabled)act(b.dataset.act);
});

function pause(){
  if(phase!=='game')return;
  phase='pause';

function resume(){
  if(phase!=='pause')return;
  pressed.dash=0;pressed.emp=false;pressed.trip=0;
  hideMenu();
  phase='game';

}
function onPress(code){
  if(phase==='game'){
    if(code==='Space')pressed.dash=8;
    if(code==='KeyQ')pressed.emp=true;
    if(code==='KeyE')pressed.trip=8;
    if(code==='KeyP'||code==='Escape')pause();
    return;
  }
  if(phase==='pause'&&(code==='KeyP'||code==='Escape')){resume();return;}
  if(phase==='dead'&&code==='KeyR'){retryLevel(true);return;}
  if(phase==='menu'&&menuScreen==='skins'){
    const L=SKIN_COLORS.length,S=SKIN_SHAPES.length;
    if(code==='ArrowLeft')setSkin((selColor+L-1)%L,selShape);
    if(code==='ArrowRight')setSkin((selColor+1)%L,selShape);
    if(code==='ArrowUp')setSkin(selColor,(selShape+S-1)%S);
    if(code==='ArrowDown')setSkin(selColor,(selShape+1)%S);
  }
  // экран входа Esc не пропускает: выбрать надо явно — войти или играть гостем
  if(phase==='menu'&&code==='Escape'&&menuScreen==='gate')return;
  if(phase==='menu'&&code==='Escape'&&(menuScreen==='signin'||menuScreen==='signup')){showMenu(loginBack);return;}
  if(phase==='menu'&&code==='Escape'&&menuScreen!=='main'){showMenu('main');return;}
  // Enter без выбранной кнопки нажимает главную кнопку экрана
  if((code==='Enter'||code==='NumpadEnter')&&!(document.activeElement instanceof HTMLButtonElement)){
    const b=panelEl.querySelector('.primary');
    if(!menuEl.hidden&&b)b.click();
  }
}

// джойстик «плавающий»: появляется там, где палец коснулся левой половины поля
const screenEl=$id('screen'),stick=$id('stick'),knob=$id('knob');
let stickId=null,stickX=0,stickY=0,knobX=0,knobY=0,knobDirty=false;
function resetKnob(){
  knobDirty=false;
  knob.style.transform='';
  stick.style.left=stick.style.top=stick.style.bottom='';
  stick.classList.remove('on');
}
function releaseAll(){
  for(const k in keys)keys[k]=false;
  joy.x=joy.y=0;stickId=null;resetKnob();
  pressed.dash=0;pressed.emp=false;pressed.trip=0;
}
function stickStart(e){
  const r=screenEl.getBoundingClientRect(),R=stick.offsetWidth/2;
  stickId=e.pointerId;stickX=e.clientX;stickY=e.clientY;
  try{screenEl.setPointerCapture(e.pointerId);}catch(_){}
  stick.style.left=(e.clientX-r.left-screenEl.clientLeft-R)+'px';
  stick.style.top=(e.clientY-r.top-screenEl.clientTop-R)+'px';
  stick.style.bottom='auto';
  stick.classList.add('on');
  stickMove(e);
}
function stickMove(e){
  const R=stick.offsetWidth/2||60;
  let x=(e.clientX-stickX)/R,y=(e.clientY-stickY)/R;
  const l=Math.hypot(x,y);
  if(l>1){x/=l;y/=l;}
  if(l<0.15){joy.x=0;joy.y=0;}else{joy.x=x;joy.y=y;}
  // Android шлёт движения пальца до 240 раз в секунду — ручку двигаем один раз за кадр
  knobX=x*R*0.6;knobY=y*R*0.6;knobDirty=true;
}
screenEl.addEventListener('pointerdown',e=>{
  if(e.button>0||e.pointerType==='mouse'||phase!=='game')return;
  e.preventDefault();
  const r=screenEl.getBoundingClientRect();
  if(stickId===null&&e.clientX<r.left+r.width/2)stickStart(e);
});
screenEl.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
const stickEnd=e=>{if(e.pointerId===stickId){stickId=null;joy.x=0;joy.y=0;resetKnob();}};
screenEl.addEventListener('pointerup',stickEnd);
screenEl.addEventListener('pointercancel',stickEnd);
screenEl.addEventListener('lostpointercapture',stickEnd);
// долгое нажатие на Android открывает контекстное меню — на поле оно не нужно

// ================= РАЗМЕР ХОЛСТА =================
// холст вписывается в свободное место; на сенсорном экране поле растягивается на весь экран,
// а клетка фона продолжается по краям. Плотность пикселей задаёт уровень графики (resScale).
const stageEl=$id('stage'),appEl=$id('app'),uiEl=$id('ui');
const touchMQ=matchMedia('(pointer: coarse)');
function fit(){
  const touch=touchMQ.matches;
  let rw,rh;
  if(touch){rw=screenEl.clientWidth;rh=screenEl.clientHeight;}
  else{const r=stageEl.getBoundingClientRect();rw=r.width-4;rh=r.height-4;}
  const k=Math.max(0.2,Math.min(rw/W,rh/H,touch?3:1.4));
  const cw=Math.floor(W*k),ch=Math.floor(H*k);
  cvs.style.width=cw+'px';cvs.style.height=ch+'px';
  if(touch){
    const l=Math.floor((rw-cw)/2),t=Math.floor((rh-ch)/2),g=40*k;
    cvs.style.left=l+'px';cvs.style.top=t+'px';
    screenEl.style.backgroundSize=g+'px '+g+'px';
    screenEl.style.backgroundPosition=l+'px '+t+'px';
    screenEl.style.setProperty('--cvs-top',t+'px');
  }else{
    cvs.style.left=cvs.style.top='';
    screenEl.style.backgroundSize=screenEl.style.backgroundPosition='';
    screenEl.style.removeProperty('--cvs-top');
  }
  const bw=Math.round(cw*resScale),bh=Math.round(ch*resScale);
  if(cvs.width!==bw||cvs.height!==bh){
    cvs.width=bw;cvs.height=bh;
    buildBg();
    render(true);
  }
}
// на сенсорном экране HUD и сообщения переезжают внутрь поля
function place(){
  if(touchMQ.matches){screenEl.insertBefore(uiEl,menuEl);screenEl.insertBefore(msgEl,menuEl);}
  else{appEl.insertBefore(uiEl,stageEl);appEl.append(msgEl);}
  fit();
}
if(touchMQ.addEventListener)touchMQ.addEventListener('change',place);
else if(touchMQ.addListener)touchMQ.addListener(place);
if(window.ResizeObserver)new ResizeObserver(fit).observe(stageEl);
addEventListener('resize',fit);

// ================= ЦИКЛ =================
// логика идёт фиксированными шагами по 60 в секунду, а кадр рисуется только после шага:
// на экранах 90–120 Гц лишние перерисовки съедали шлейфы и давали рывки
let last=performance.now(),lag=0,sinceRender=0,fpsCount=0,fpsT=0,fpsShown=0;
function frame(now){
  const dt=Math.min(250,now-last);last=now;lag+=dt;
  // на слабом устройстве игра лучше чуть замедлится, чем будет перескакивать: не больше 4 шагов за кадр
  if(lag>STEP*4)lag=STEP*4;
  const wasGame=phase==='game';
  let ticks=0;
  while(lag>=STEP){
    if(phase==='game')step();
    else if(phase==='menu'){time++;moveDust();}
    lag-=STEP;ticks++;
  }
  sinceRender+=ticks;
  if(knobDirty){knobDirty=false;knob.style.transform='translate('+knobX+'px,'+knobY+'px)';}
  // на низкой графике кадр рисуется через шаг логики — ровные 30 кадров вместо рваных 40
  if(sinceRender>=(Q.fps30?2:1)&&(wasGame||phase==='game'||phase==='menu')){
    sinceRender=0;
    render(false);
    if(phase==='menu'&&menuScreen==='skins')drawPreview();
    fpsCount++;
    if(now-fpsT>=1000){fpsShown=Math.round(fpsCount*1000/(now-fpsT));fpsCount=0;fpsT=now;}
    // «Авто»: каждые 2 секунды игры сверяем среднюю длину кадра с целью (60 или 30 кадров)
    if(phase==='game'&&save.q==='auto'){
      if(!perfT)perfT=now;
      perfFrames++;
      const el=now-perfT;
      if(el>=2000){
        const avg=el/perfFrames;
        perfT=0;perfFrames=0;
        if(avg>(Q.fps30?34:17)*1.3)downgrade();
      }
    }
  }
  // пауза и меню не должны попадать в замер
  if(phase!=='game'){perfT=0;perfFrames=0;}
  requestAnimationFrame(frame);
}
