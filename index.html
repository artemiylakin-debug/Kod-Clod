    c.fillStyle='#fde047';c.beginPath();c.arc(0,-rr-2,1.5,0,TAU);c.fill();
  }else if(h===23){
    // спутник: кружит вокруг головы, панели поблёскивают
    const a=t*0.045,x=Math.cos(a)*(rr+12),y=-rr*0.4+Math.sin(a)*(rr+6)*0.5;
    c.save();c.translate(x,y);c.rotate(a*0.5);
    c.fillStyle='#94a3b8';c.fillRect(-2,-2,4,4);
    c.fillStyle=Math.floor(t/12)%2?'#3b82f6':'#60a5fa';c.fillRect(-8,-1.5,5,3);c.fillRect(3,-1.5,5,3);
    c.restore();
  }else if(h===24){
    // песочные часы: песок пересыпается, каждые четыре секунды часы переворачиваются
    const k=(t%240)/240,flip=Math.floor(t/240)%2;
    c.save();c.translate(0,-rr-10);if(flip)c.rotate(Math.PI);
    c.strokeStyle='#92400e';c.lineWidth=1.2;
    c.beginPath();c.moveTo(-5,-7);c.lineTo(5,-7);c.lineTo(-4,6);c.lineTo(4,6);c.closePath();c.stroke();
    c.fillStyle='#fbbf24';
    c.beginPath();c.moveTo(-4*(1-k),-6+6*k);c.lineTo(4*(1-k),-6+6*k);c.lineTo(0,0);c.closePath();c.fill();
    c.fillRect(-3*k,6-4*k,6*k,4*k);
    c.restore();
  }
}
// шлейф по стилю следа; pts — точки {x,y,life,hot}, max — их полная жизнь
function drawTrail(c,pts,L,sk,max,t){
  const st=L.t;
  for(let i=0;i<pts.length;i++){
    const q=pts[i],a=Math.min(1,q.life/max);
    c.globalAlpha=a*(q.hot?0.6:(st===0?0.35:0.5));
    // разгон всегда оранжевый, иначе его не заметить
    if(q.hot===2){c.fillStyle='#fa0';c.beginPath();c.arc(q.x,q.y,3+6*a,0,TAU);c.fill();continue;}
    if(st===1){c.fillStyle=i%2?sk.main:sk.trail;const z=3+5*a;c.fillRect(Math.round(q.x/4)*4-z/2,Math.round(q.y/4)*4-z/2,z,z);}
    else if(st===2){c.fillStyle=i%3?sk.main:'#fff';c.beginPath();c.arc(q.x+Math.sin(i*12.9+t*0.3)*5,q.y+Math.cos(i*7.3+t*0.3)*5,1.5+2.5*a,0,TAU);c.fill();}
    else if(st===3){c.fillStyle=a>0.66?'#ffd23f':(a>0.33?'#ff8c1a':'#e0301e');c.beginPath();c.arc(q.x,q.y,2+7*a,0,TAU);c.fill();}
    else if(st===4){if(i%3===0){c.fillStyle=sk.main;c.font='bold '+Math.round(7+5*a)+'px Courier New, monospace';c.textAlign='center';c.fillText((i*7+Math.floor(i/3))%2?'1':'0',q.x,q.y+4);}}
    else if(st===5){c.fillStyle='hsl('+((i*14+t*4)%360)+',85%,55%)';c.beginPath();c.arc(q.x,q.y,3+5*a,0,TAU);c.fill();}
    else if(st===6){if(i>0){const o=pts[i-1];c.strokeStyle=sk.main;c.lineWidth=2+9*a;c.lineCap='round';c.beginPath();c.moveTo(o.x,o.y);c.lineTo(q.x,q.y);c.stroke();}}
    else if(st===7){
      c.fillStyle=i%2?'#f5c518':'#ffe58a';c.beginPath();c.arc(q.x,q.y,1.5+3*a,0,TAU);c.fill();
      if(i%5===0){c.fillRect(q.x-4*a,q.y-0.6,8*a,1.2);c.fillRect(q.x-0.6,q.y-4*a,1.2,8*a);}
    }
    else if(st===8){
      // созвездие: звёзды через одну точку из трёх, соединённые тонкой линией
      if(i%3===0){
        if(i>=3){const o=pts[i-3];c.strokeStyle=sk.main;c.lineWidth=1;c.beginPath();c.moveTo(o.x,o.y);c.lineTo(q.x,q.y);c.stroke();}
        c.fillStyle=i%2?'#fef08a':'#ffffff';c.beginPath();c.arc(q.x,q.y,1.5+2.5*a,0,TAU);c.fill();
      }
    }
    else if(st===9){
      if(i%4===0){c.save();c.translate(q.x,q.y);c.fillStyle=i%8?'#f43f5e':'#fb7185';shapePath(c,8,3+6*a,0);c.fill();c.restore();}
    }
    else if(st===10){
      // пузыри всплывают и растут, пока гаснут
      if(i%2===0){
        const bx=q.x+Math.sin(i*1.7+t*0.05)*3,by=q.y-(1-a)*12,br=2+5*(1-a);
        c.strokeStyle=sk.trail;c.lineWidth=1.5;c.beginPath();c.arc(bx,by,br,0,TAU);c.stroke();
        c.fillStyle='#fff';c.beginPath();c.arc(bx-br*0.35,by-br*0.35,Math.max(0.8,br*0.25),0,TAU);c.fill();
      }
    }
    else{c.fillStyle=q.hot===1?sk.main:sk.trail;c.beginPath();c.arc(q.x,q.y,3+6*a,0,TAU);c.fill();}
  }
  c.globalAlpha=1;c.lineCap='butt';
}
function bossSprite(b){
  if(!b.spr){
    b.spr=makeSprite(128,g=>{
      const gl=g.createRadialGradient(0,0,30,0,0,64);
      gl.addColorStop(0,b.glow);gl.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gl;g.fillRect(-64,-64,128,128);
      const gr=g.createRadialGradient(0,0,4,0,0,42);
      gr.addColorStop(0,b.c1);gr.addColorStop(1,b.c2);
      g.fillStyle=gr;polyPath(g,b.sides||10,42,0);g.fill();
      g.fillStyle=b.core;g.beginPath();g.arc(0,0,42*0.3,0,TAU);g.fill();
    });
  }
  return b.spr;
}
// темнота: дыра света вокруг игрока, нарисованная один раз в низком разрешении
let darkSpr=null,darkR=0;
function darkSprite(R){
  if(darkSpr&&darkR===R)return darkSpr;
  const s=0.25,c=document.createElement('canvas');
  c.width=W*2*s;c.height=H*2*s;
  const g=c.getContext('2d'),gr=g.createRadialGradient(W*s,H*s,R*0.45*s,W*s,H*s,R*s);
  gr.addColorStop(0,'rgba(6,20,36,0)');gr.addColorStop(1,'rgba(6,20,36,0.92)');
  g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
  darkSpr=c;darkR=R;
  return c;
}
// фон поля (белая клетка и стены) хранится готовым и кладётся одним drawImage
const bgCanvas=document.createElement('canvas'),bgx=bgCanvas.getContext('2d');
function buildBg(){
  bgCanvas.width=cvs.width;bgCanvas.height=cvs.height;
  bgx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);
  // у каждого акта свой оттенок поля
  const ac=ACTS[bgAct];
  bgx.fillStyle=ac.bg;bgx.fillRect(0,0,W,H);
  bgx.strokeStyle=ac.grid;bgx.lineWidth=1;
  bgx.beginPath();
  for(let x=0;x<W;x+=40){bgx.moveTo(x,0);bgx.lineTo(x,H);}
  for(let y=0;y<H;y+=40){bgx.moveTo(0,y);bgx.lineTo(W,y);}
  bgx.stroke();
  bgx.fillStyle='rgba(51,153,204,0.09)';
  for(const f of flows)bgx.fillRect(0,f.y,W,f.h);
  // зоны инверсии — розовые круги со стрелками «туда-обратно»
  for(const z of invs){
    bgx.fillStyle='rgba(219,39,119,0.07)';bgx.beginPath();bgx.arc(z.x,z.y,z.r,0,TAU);bgx.fill();
    bgx.strokeStyle='rgba(219,39,119,0.45)';bgx.lineWidth=1.5;bgx.setLineDash([3,6]);bgx.stroke();bgx.setLineDash([]);
    bgx.fillStyle='rgba(190,24,93,0.6)';bgx.font='bold 18px Courier New, monospace';bgx.textAlign='center';
    bgx.fillText('⇄',z.x,z.y-2);
    bgx.font='bold 10px Courier New, monospace';bgx.fillText('ИНВЕРСИЯ',z.x,z.y+14);
  }
  // лаг, инверсия и потоки из клеток карты игрока
  if(zmap){
    bgx.textAlign='center';bgx.font='bold 14px Courier New, monospace';
    for(let i=0;i<TILE_N;i++){
      const ch=zmap.charAt(i);
      if(ch==='.')continue;
      const x=(i%TCOLS)*TILE,y=Math.floor(i/TCOLS)*TILE;
      if(ch==='~'){
        bgx.fillStyle='rgba(120,90,200,0.12)';bgx.fillRect(x,y,TILE,TILE);
        bgx.strokeStyle='rgba(120,90,200,0.28)';bgx.lineWidth=2;bgx.beginPath();bgx.moveTo(x,y+TILE);bgx.lineTo(x+TILE,y);bgx.moveTo(x,y+TILE/2);bgx.lineTo(x+TILE/2,y);bgx.moveTo(x+TILE/2,y+TILE);bgx.lineTo(x+TILE,y+TILE/2);bgx.stroke();
      }else if(ch==='I'){
        bgx.fillStyle='rgba(219,39,119,0.1)';bgx.fillRect(x,y,TILE,TILE);
        bgx.fillStyle='rgba(190,24,93,0.45)';bgx.fillText('⇄',x+TILE/2,y+TILE/2+5);
      }else{
        bgx.fillStyle='rgba(51,153,204,0.12)';bgx.fillRect(x,y,TILE,TILE);
        bgx.fillStyle='rgba(30,110,180,0.55)';bgx.fillText({'>':'→','<':'←','^':'↑','v':'↓'}[ch]||'',x+TILE/2,y+TILE/2+5);
      }
    }
  }
  // зоны лага — штрихованные круги
  for(const z of lags){
    bgx.save();bgx.beginPath();bgx.arc(z.x,z.y,z.r,0,TAU);
    bgx.fillStyle='rgba(120,90,200,0.08)';bgx.fill();bgx.clip();
    bgx.strokeStyle='rgba(120,90,200,0.22)';bgx.lineWidth=2;bgx.beginPath();
    for(let i=-z.r*2;i<z.r*2;i+=12){bgx.moveTo(z.x+i-z.r,z.y+z.r);bgx.lineTo(z.x+i+z.r,z.y-z.r);}
    bgx.stroke();bgx.restore();
    bgx.strokeStyle='rgba(120,90,200,0.5)';bgx.lineWidth=1.5;bgx.setLineDash([6,5]);
    bgx.beginPath();bgx.arc(z.x,z.y,z.r,0,TAU);bgx.stroke();bgx.setLineDash([]);
    bgx.fillStyle='rgba(100,70,180,0.55)';bgx.font='bold 11px Courier New, monospace';bgx.textAlign='center';
    bgx.fillText('ЛАГ',z.x,z.y+4);
  }
  for(const w of walls){
    bgx.fillStyle='#e2e9f1';bgx.fillRect(w.x,w.y,w.w,w.h);
    bgx.save();bgx.beginPath();bgx.rect(w.x,w.y,w.w,w.h);bgx.clip();
    bgx.strokeStyle='rgba(0,85,119,0.25)';bgx.lineWidth=2;bgx.beginPath();
    for(let i=-w.h;i<w.w;i+=10){bgx.moveTo(w.x+i,w.y+w.h);bgx.lineTo(w.x+i+w.h,w.y);}
    bgx.stroke();bgx.restore();
    bgx.strokeStyle='#057';bgx.lineWidth=2;bgx.strokeRect(w.x+1,w.y+1,w.w-2,w.h-2);
  }
}

// ================= РИСОВАНИЕ =================
function drawHeart(cx,cy,s,fill){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  ctx.beginPath();
  ctx.moveTo(0,0.35);
  ctx.bezierCurveTo(-1.1,-0.6,-0.35,-1.3,0,-0.55);
  ctx.bezierCurveTo(0.35,-1.3,1.1,-0.6,0,0.35);
  ctx.closePath();
  ctx.fillStyle=fill?'#e02444':'#eee';
  ctx.fill();
  ctx.restore();
}

// full — рисовать с полным качеством независимо от настройки (превью в меню)
function drawPlayerBody(c,p,t,full,L){
  L=L||wornLook();
  const sk=colOf(L.c,t),f=p.face;
  c.save();c.translate(p.x,p.y);
  const stretch=Math.min(0.4,Math.hypot(p.vx,p.vy)*0.02);
  c.rotate(f);c.scale(1+stretch,1-stretch*0.5);c.rotate(-f);

  // свечение — готовый спрайт вместо shadowBlur
  if(full||Q.glow){
    const gl=glowSprite(sk.main);
    c.drawImage(gl,-gl.size/2,-gl.size/2,gl.size,gl.size);
  }

  // кольца
  c.strokeStyle=sk.ring;c.lineWidth=2.5;
  c.save();c.rotate(t*0.05);
  for(let i=0;i<3;i++){
    c.rotate(TAU/3);
    c.beginPath();c.arc(0,0,p.r+7,0,TAU*0.22);c.stroke();
  }
  c.restore();

  // тело по форме
  const rot=t*0.02;
  const rr=p.r*(1+Math.sin(t*0.1)*0.05);
  if(full||Q.grad){
    const grad=c.createRadialGradient(-4,-4,2,0,0,rr+4);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.4,sk.main);
    grad.addColorStop(1,sk.dark);
    c.fillStyle=grad;
  }else c.fillStyle=sk.main;
  shapePath(c,L.s,rr,rot);
  c.fill();
  c.strokeStyle=sk.dark;c.lineWidth=1.5;c.stroke();

  // глаза; в очках — тёмные стёкла с перемычкой
  const ex=Math.cos(f)*4,ey=Math.sin(f)*4;
  const e1x=ex-4+ey*0.5,e1y=ey-ex*0.5,e2x=ex+4+ey*0.5,e2y=ey+ex*0.5;
  c.fillStyle=L.h===4?'#111':sk.dark;
  const er=L.h===4?4:2.6;
  c.beginPath();c.arc(e1x,e1y,er,0,TAU);c.fill();
  c.beginPath();c.arc(e2x,e2y,er,0,TAU);c.fill();
  if(L.h===4){c.strokeStyle='#111';c.lineWidth=1.5;c.beginPath();c.moveTo(e1x,e1y);c.lineTo(e2x,e2y);c.stroke();}
  drawHat(c,L.h,rr,sk,t,f);
  c.restore();
}

function drawPlayer(){
  const L=wornLook(),sk=colOf(L.c,time);
  const p=player;
  drawTrail(ctx,trail,L,sk,Q.trail,time);
  // линии скорости при рывке и разгоне
  const sp=Math.hypot(p.vx,p.vy);
  if((boost>0||p.dashT>0)&&sp>2){
    const ux=p.vx/sp,uy=p.vy/sp,len=6+sp*2.2;
    ctx.strokeStyle=p.dashT>0?sk.main:'#fa0';ctx.lineWidth=2;ctx.globalAlpha=0.75;
    ctx.beginPath();
    for(let i=-1;i<=1;i++){
      const ox=-uy*i*8,oy=ux*i*8,st=20+Math.abs(i)*6;
      ctx.moveTo(p.x-ux*st+ox,p.y-uy*st+oy);ctx.lineTo(p.x-ux*(st+len)+ox,p.y-uy*(st+len)+oy);
    }
    ctx.stroke();ctx.globalAlpha=1;
  }
  if(p.cool>0&&Math.floor(time/4)%2===1)return;
  drawPlayerBody(ctx,p,time,false,L);

  // сердечки над игроком; с аксессуаром — чуть выше, чтобы не налезали
  const hy=L.h&&EYE_HATS.indexOf(L.h)<0?36:30;
  const ml=maxLives();
  for(let i=0;i<ml;i++)drawHeart(p.x-(ml-1)*7+i*14,p.y-hy,6,i<lives);

  // полоски: рывок, подножка и оставшийся разгон
  ctx.fillStyle='#0001';ctx.fillRect(p.x-16,p.y+22,32,4);ctx.fillRect(p.x-16,p.y+27,32,3);
  ctx.fillStyle=sk.ring;ctx.fillRect(p.x-16,p.y+22,32*Math.max(0,1-p.dashCd/70),4);
  ctx.fillStyle='#b7791f';ctx.fillRect(p.x-16,p.y+27,32*Math.max(0,1-(p.tripCd||0)/tripCdMax()),3);
  if(boost>0){ctx.fillStyle='#fa0';ctx.fillRect(p.x-16,p.y+31,32*boost/240,3);}
}

// над споткнувшимся кружат звёздочки; за секунду до подъёма они мигают
function drawStars(e){
  if(e.trip>60||Math.floor(time/6)%2===0){
    ctx.fillStyle='#e9b020';
    for(let i=0;i<3;i++){
      const s=time*0.12+i*TAU/3;
      ctx.fillRect(e.x+Math.cos(s)*9-1.5,e.y-e.r-7+Math.sin(s)*3-1.5,3,3);
    }
  }
}
function drawWorm(e){
  if(e.trip>0)ctx.globalAlpha=0.7;
  for(let i=WORM_SEGS;i>=1;i--){const s=wormSeg(e,i);drawSprite(SPR_WSEG,s[0],s[1],0,1-i*0.05);}
  drawSprite(SPR_WHEAD,e.x,e.y,e.ang,1);
  ctx.globalAlpha=1;
}

function drawEnemy(e){
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  if(e.type==='worm'){drawWorm(e);if(e.trip>0)drawStars(e);return;}
  if(e.trip>0){
    // споткнулся: полсекунды кувыркается, потом лежит
    ctx.globalAlpha=0.7;
    const spr={sniper:SPR_SNIPER,glitch:SPR_GLITCH,bot:SPR_BOT,turret:SPR_TURRET,thief:SPR_THIEF,mirror:SPR_MIRROR,miner:SPR_MINER}[e.type]||SPR_CHASER;
    drawSprite(spr,e.x,e.y,e.trip>TRIP_STUN-30?time*0.35:e.tripRot,e.type==='sniper'||e.type==='chaser'?e.r/11:1);
    ctx.globalAlpha=1;
    drawStars(e);
    return;
  }
  if(e.type==='trojan'){
    // от настоящих данных отличает красная точка в центре и вращение в другую сторону
    const red=e.arm>0&&Math.floor(e.arm/4)%2===0;
    drawSprite(red?SPR_TROJAN:SPR_DATA,e.x,e.y,-e.t*0.05,1+Math.sin(e.t*0.12)*0.25);
    ctx.fillStyle='#d22';ctx.beginPath();ctx.arc(e.x,e.y,1.8,0,TAU);ctx.fill();
    if(e.arm>0){ctx.strokeStyle='#e33';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,10+(45-e.arm)*0.4,0,TAU);ctx.stroke();}
    return;
  }
  if(e.type==='glitch'){
    // перед прыжком — пунктирный круг там, где он появится
    if(e.warp>0){
      ctx.strokeStyle='#c3f';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(e.wx,e.wy,10+e.warp*0.4,0,TAU);ctx.stroke();ctx.setLineDash([]);
    }
    const j=e.warp>0?3:1;
    drawSprite(SPR_GLITCH,e.x+(Math.random()-0.5)*2*j,e.y+(Math.random()-0.5)*2*j,a,1);
    return;
  }
  if(e.type==='turret'){
    // поднимается — пунктир и полупрозрачность; за треть секунды до очереди ствол краснеет
    if(e.rise>0){
      ctx.globalAlpha=0.35+0.6*(1-e.rise/40);
      ctx.strokeStyle='#475569';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(e.x,e.y,22,0,TAU);ctx.stroke();ctx.setLineDash([]);
    }
    drawSprite(SPR_TURRET,e.x,e.y,0,1);
    ctx.strokeStyle=e.rise<=0&&e.fireT<20?'#dc2626':'#1e293b';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(e.ang)*17,e.y+Math.sin(e.ang)*17);ctx.stroke();ctx.lineCap='butt';
    ctx.globalAlpha=1;
    return;
  }
  if(e.type==='thief'){
    drawSprite(SPR_THIEF,e.x,e.y,Math.atan2(e.vy,e.vx),1);
    if(e.loot){ctx.fillStyle='#6d28d9';ctx.font='bold 11px Courier New, monospace';ctx.textAlign='center';ctx.fillText('◆'+e.loot,e.x,e.y-14);}
    return;
  }
  if(e.type==='missile'){
    ctx.fillStyle=Math.floor(time/3)%2?'#fb923c':'#facc15';
    ctx.beginPath();ctx.arc(e.x-Math.cos(e.ang)*12,e.y-Math.sin(e.ang)*12,3+Math.random()*2,0,TAU);ctx.fill();
    drawSprite(SPR_MISSILE,e.x,e.y,e.ang,1);
    return;
  }
  if(e.type==='mirror'){
    ctx.globalAlpha=0.9;drawSprite(SPR_MIRROR,e.x,e.y,-time*0.02,1);ctx.globalAlpha=1;
    return;
  }
  if(e.type==='miner'){drawSprite(SPR_MINER,e.x,e.y,time*0.03,1);return;}
  if(e.type==='mine'){
    ctx.globalAlpha=e.life<120?e.life/120:(e.arm>0?0.5:1);
    drawSprite(SPR_MINE,e.x,e.y,0,1);
    if(!e.arm&&Math.floor(time/10)%2){ctx.strokeStyle='#ef4444';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(e.x,e.y,13,0,TAU);ctx.stroke();}
    ctx.globalAlpha=1;
    return;
  }
  if(e.type==='heavy'){
    drawSprite(SPR_HEAVY,e.x,e.y,a+time*0.01,1);
    ctx.fillStyle='#401';
    ctx.beginPath();ctx.arc(e.x+Math.cos(a)*e.r*0.15,e.y+Math.sin(a)*e.r*0.15,e.r*0.22,0,TAU);ctx.fill();
    ctx.fillStyle='#0002';ctx.fillRect(e.x-14,e.y-e.r-9,28,4);
    ctx.fillStyle='#92b';ctx.fillRect(e.x-14,e.y-e.r-9,14*e.hp,4);
  }else if(e.type==='bot'){
    drawSprite(SPR_BOT,e.x,e.y,a,1);
  }else{
    drawSprite(e.type==='sniper'?SPR_SNIPER:SPR_CHASER,e.x,e.y,a,e.r/11);
  }
}

// opaque — нарисовать фон без шлейфов (после смены размера холста или для застывшего кадра)
function render(opaque){
  if(!ready)return;
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);
  // фон: полупрозрачный слой оставляет шлейфы за всем, что движется (так задумано)
  // на низкой графике фон кладётся сразу целиком: без шлейфов, зато дешевле
  ctx.globalAlpha=opaque||!Q.ghost?1:0.4;
  ctx.drawImage(bgCanvas,0,0,W,H);
  ctx.fillStyle='#068';
  for(let i=0;i<Q.dust&&i<dust.length;i++){const d=dust[i];ctx.globalAlpha=d.a;ctx.fillRect(d.x,d.y,d.s,d.s);}
  ctx.globalAlpha=1;
  if(phase==='menu'){updateHud();return;}

  const cfg=cfgNow();
  ctx.save();
  if(shake>0&&phase==='game'&&!RM)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // данные
  for(const dt of data)drawSprite(SPR_DATA,dt.x,dt.y,dt.t*0.05,1+Math.sin(dt.t*0.12)*0.25);

  // усилители
  ctx.font='bold 13px Courier New, monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=2;
  for(const p of pickups){
    const y=p.y+Math.sin(p.t*0.08)*3,col=PICK[p.type].color;
    // запасная аптечка при полном здоровье бледнее — её пока не взять
    if(p.type==='hp'&&lives>=maxLives())ctx.globalAlpha=0.45;
    ctx.strokeStyle=col;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(p.x,y,p.r,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;
    if(p.type==='hp'){ctx.fillRect(p.x-6,y-2,12,4);ctx.fillRect(p.x-2,y-6,4,12);}
    else if(p.type==='emp'){ctx.font='bold 8px Courier New, monospace';ctx.fillText('EMP',p.x,y+1);}
    else{ctx.font='bold 13px Courier New, monospace';ctx.fillText('»',p.x,y+1);}
    ctx.globalAlpha=1;
  }
  ctx.textBaseline='alphabetic';

  // потоки трафика — бегущие стрелки; барьеры файрвола — пунктир, мигание, красная полоса
  if(flows.length){
    ctx.strokeStyle='rgba(51,153,204,0.45)';ctx.lineWidth=2;ctx.beginPath();
    for(const f of flows){
      const cy=f.y+f.h/2,off=((time*1.5*f.dir)%50+50)%50;
      for(let x=-50+off;x<W+50;x+=50){ctx.moveTo(x-5*f.dir,cy-7);ctx.lineTo(x+5*f.dir,cy);ctx.lineTo(x-5*f.dir,cy+7);}
    }
    ctx.stroke();
  }
  for(const g of gates){
    const st=gateState(g);
    if(st===2){
      ctx.fillStyle='rgba(230,40,50,0.55)';ctx.fillRect(g.x,g.y,g.w,g.h);
      ctx.strokeStyle='#c22';ctx.lineWidth=2;ctx.strokeRect(g.x,g.y,g.w,g.h);
    }else if(st===1){
      if(Math.floor(time/5)%2===0){ctx.strokeStyle='#e33';ctx.lineWidth=2;ctx.strokeRect(g.x,g.y,g.w,g.h);}
    }else{
      ctx.strokeStyle='rgba(204,34,34,0.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);
      ctx.strokeRect(g.x,g.y,g.w,g.h);ctx.setLineDash([]);
    }
  }

  // чёрные дыры: граница притяжения, закрученные кольца и тёмное ядро
  for(const h of holes){
    ctx.strokeStyle='rgba(76,29,149,0.25)';ctx.lineWidth=1.5;ctx.setLineDash([2,8]);
    ctx.beginPath();ctx.arc(h.x,h.y,h.R,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='rgba(109,40,217,0.5)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const r=h.r+6+((time*0.8+i*h.R/3)%(h.R*0.7));
      ctx.globalAlpha=0.6*(1-r/(h.R*0.8));
      ctx.beginPath();ctx.arc(h.x,h.y,r,time*0.03+i,time*0.03+i+4.2);ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#1e1b4b';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,TAU);ctx.fill();
    ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,h.r+2,0,TAU);ctx.stroke();
  }
  // подвижные блоки — как битые сектора, только с жёлто-чёрной каймой
  for(const m of movers){
    ctx.fillStyle='#e2e9f1';ctx.fillRect(m.x,m.y,m.w,m.h);
    ctx.strokeStyle='#ca8a04';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.strokeRect(m.x+1.5,m.y+1.5,m.w-3,m.h-3);
    ctx.strokeStyle='#1f2937';ctx.lineDashOffset=6;ctx.strokeRect(m.x+1.5,m.y+1.5,m.w-3,m.h-3);
    ctx.setLineDash([]);ctx.lineDashOffset=0;
  }

  // роутеры: парные кольца одного цвета; пока роутер «остывает», кольца бледнее
  for(let k=0;k<tps.length;k++){
    const col=['#7a4fd6','#d6408a','#2b8a9e'][k%3];
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.globalAlpha=player.tpCd>0?0.35:0.85;
    for(const q of tps[k]){
      ctx.setLineDash([7,5]);ctx.lineDashOffset=-time*0.6;
      ctx.beginPath();ctx.arc(q.x,q.y,TP_R,0,TAU);ctx.stroke();
      ctx.setLineDash([]);ctx.lineDashOffset=0;
      ctx.beginPath();ctx.arc(q.x,q.y,TP_R*0.45+Math.sin(time*0.1+k)*2,0,TAU);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  // сканер: пунктир — отдыхает, сплошной красный — жжёт
  if(scan){
    const hot=scanHot(),warn=!hot&&time%360>=90;
    ctx.strokeStyle=hot?'#e11d48':'rgba(225,29,72,0.45)';
    ctx.lineWidth=hot?5:2;
    if(!hot)ctx.setLineDash(warn&&Math.floor(time/5)%2?[2,4]:[8,8]);
    ctx.beginPath();
    for(let k=0;k<scan.arms;k++){
      const a=scan.a+k*TAU/scan.arms,ux=Math.cos(a),uy=Math.sin(a);
      ctx.moveTo(scan.x+ux*scan.gap,scan.y+uy*scan.gap);ctx.lineTo(scan.x+ux*1000,scan.y+uy*1000);
    }
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#9f1239';ctx.beginPath();ctx.arc(scan.x,scan.y,7,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(159,18,57,0.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(scan.x,scan.y,scan.gap,0,TAU);ctx.stroke();
  }

  // в темноте прячутся данные и бонусы, а враги, портал и пули видны — иначе нечестно
  if(cfg.dark)ctx.drawImage(darkSprite(cfg.dark+D().dark),player.x-W,player.y-H,W*2,H*2);

  // портал
  if(portal){
    const p=portal;
    ctx.save();ctx.translate(p.x,p.y);
    ctx.rotate(p.t*0.03);
    ctx.strokeStyle='#2a6';ctx.lineWidth=4;ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.arc(0,0,p.r+Math.sin(p.t*0.1)*4,0,TAU);ctx.stroke();
    ctx.setLineDash([]);ctx.rotate(-p.t*0.03);
    ctx.fillStyle='#2a64';
    ctx.beginPath();ctx.arc(0,0,p.r*0.5+Math.sin(p.t*0.08)*2,0,TAU);ctx.fill();
    ctx.restore();
  }

  enemies.forEach(drawEnemy);

  // босс
  if(boss){
    const b=boss;
    // сжатие Архиватора — сходящиеся кольца; прицел Дефрагментатора — красная линия
    if(b.pull){
      ctx.strokeStyle=cfg.boss.c2;ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.globalAlpha=0.6;
      for(let i=0;i<3;i++){const r=200-((time*3+i*60)%160);ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.stroke();}
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    if(b.mode==='aim'){
      const a=Math.atan2(b.ty-b.y,b.tx-b.x);
      ctx.strokeStyle='#e33';ctx.lineWidth=b.mt<20?3:1.5;ctx.setLineDash([10,6]);
      ctx.globalAlpha=b.mt<20&&Math.floor(time/3)%2?1:0.6;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*1000,b.y+Math.sin(a)*1000);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    // щит Капчи — пульсирующее синее кольцо
    if(b.shield){
      ctx.strokeStyle='#39c';ctx.lineWidth=3;ctx.globalAlpha=0.55+0.3*Math.sin(time*0.2);
      ctx.beginPath();ctx.arc(b.x,b.y,58,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }
    if(b.kind==='cloak'){
      const c=b.t%360;
      if(c>=260&&c<320){
        ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.setLineDash([5,5]);
        ctx.beginPath();ctx.arc(b.wx,b.wy,b.r+(320-c)*0.6,0,TAU);ctx.stroke();ctx.setLineDash([]);
      }
      ctx.globalAlpha=c<200?1:(c<230?1-(c-200)/30*0.9:(c<320?0.1:1));
    }
    if(b.arms){
      ctx.strokeStyle=cfg.boss.c2;ctx.lineCap='round';
      for(let k=0;k<3;k++){
        const a=b.ang+k*TAU/3,ux=Math.cos(a),uy=Math.sin(a);
        ctx.lineWidth=11;ctx.globalAlpha=0.85;
        ctx.beginPath();ctx.moveTo(b.x+ux*b.r*0.6,b.y+uy*b.r*0.6);ctx.lineTo(b.x+ux*(b.r+KRAKEN_ARM),b.y+uy*(b.r+KRAKEN_ARM));ctx.stroke();
        ctx.fillStyle=cfg.boss.c1;ctx.globalAlpha=1;
        for(let j=1;j<=4;j++){ctx.beginPath();ctx.arc(b.x+ux*(b.r+j*22),b.y+uy*(b.r+j*22),2.5,0,TAU);ctx.fill();}
      }
      ctx.lineCap='butt';ctx.globalAlpha=1;
    }
    if(b.charge>0){
      ctx.strokeStyle='#dc2626';ctx.lineWidth=2+b.charge*4;ctx.globalAlpha=0.3+b.charge*0.6;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+8+b.charge*40,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }
    if(b.light>=0){
      // слева направо: красный, жёлтый, зелёный; b.light: 0 — красный, 1 — жёлтый, 2 — зелёный
      const cols=['#dc2626','#f59e0b','#16a34a'];
      ctx.fillStyle='#1f2937';ctx.fillRect(b.x-26,b.y-b.r-46,52,18);
      for(let i=0;i<3;i++){ctx.fillStyle=i===b.light?cols[i]:'#4b5563';ctx.beginPath();ctx.arc(b.x-16+i*16,b.y-b.r-37,6,0,TAU);ctx.fill();}
    }
    if(b.kind==='balance'){
      const pts=bossPoints(b),spr=bossSprite(cfg.boss);
      ctx.strokeStyle=cfg.boss.c2;ctx.lineWidth=2;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(pts[1][0],pts[1][1]);ctx.lineTo(pts[2][0],pts[2][1]);ctx.stroke();ctx.setLineDash([]);
      drawSprite(spr,b.x,b.y,b.t*0.01,0.6);
      drawSprite(spr,pts[1][0],pts[1][1],-b.t*0.03,0.42);
      drawSprite(spr,pts[2][0],pts[2][1],-b.t*0.03,0.42);
    }else drawSprite(bossSprite(cfg.boss),b.x,b.y,b.t*0.01,1);
    ctx.globalAlpha=1;
    ctx.fillStyle='#0002';ctx.fillRect(b.x-40,b.y-b.r-16,80,6);
    ctx.fillStyle=cfg.boss.c2;ctx.fillRect(b.x-40,b.y-b.r-16,80/b.maxHp*Math.max(0,b.hp),6);
    ctx.fillStyle='#057';ctx.font='bold 11px Courier New, monospace';ctx.textAlign='center';
    ctx.fillText(b.name,b.x,b.y-b.r-21);
  }

  // пули
  for(const b of bullets){
    if(b.rock){drawSprite(SPR_ROCK,b.x,b.y,b.rot,b.r/15);continue;}
    const z=SPR_BULLET.size*b.r/5;
    ctx.drawImage(b.home>0?SPR_HOMING:SPR_BULLET,b.x-z/2,b.y-z/2,z,z);
  }

  // удар с орбиты: красная метка сжимается к центру; когда сойдётся — взрыв
  for(const st of strikes){
    const k=1-st.t/st.T;
    ctx.strokeStyle='#dc2626';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.arc(st.x,st.y,STRIKE_R,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(220,38,38,'+(0.1+0.25*k)+')';ctx.beginPath();ctx.arc(st.x,st.y,STRIKE_R*k,0,TAU);ctx.fill();
    ctx.beginPath();ctx.moveTo(st.x-10,st.y);ctx.lineTo(st.x+10,st.y);ctx.moveTo(st.x,st.y-10);ctx.lineTo(st.x,st.y+10);ctx.stroke();
  }

  // волна подножки расходится от игрока на весь радиус
  if(tripFx){
    const k=tripFx.t/16;
    ctx.globalAlpha=1-k;ctx.strokeStyle='#b7791f';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(tripFx.x,tripFx.y,20+(TRIP_R-20)*k,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }

  drawPlayer();
  if(RACE_DIFF&&MP)mpDrawGhost();

  for(const p of parts){
    ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life/40);
    ctx.fillRect(p.x,p.y,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
  ctx.font='bold 14px Courier New, monospace';ctx.textAlign='center';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.life/25);
    ctx.fillStyle=t.color;
    ctx.fillText(t.str,t.x,t.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // таймер очистки — внизу по центру
  if(cfg.timer&&!portal&&!boss){
    const s=Math.ceil(purge/60),low=s<=10;
    ctx.textAlign='center';ctx.font='bold 14px Courier New, monospace';
    ctx.fillStyle=low?'#c22':'#057';
    ctx.fillText('ОЧИСТКА '+cfg.name+' ЧЕРЕЗ '+s+' с',W/2,H-22);
    ctx.fillStyle='#0001';ctx.fillRect(W/2-100,H-14,200,4);
    ctx.fillStyle=low?'#e33':'#0a5';ctx.fillRect(W/2-100,H-14,200*purge/(timerOf(cfg)*60),4);
  }

  // заставка уровня
  if(intro>0){
    ctx.globalAlpha=Math.min(1,intro/30);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(0,96,W,114);
    ctx.textAlign='center';
    ctx.fillStyle='#a2a';ctx.font='bold 14px Courier New, monospace';
    ctx.fillText(CUSTOM?'УРОВЕНЬ ИГРОКА'+(CUSTOM.by?' · '+CUSTOM.by:''):(RACE_DIFF?'ГОНКА · УРОВЕНЬ '+(lvl+1):'УРОВЕНЬ '+(lvl+1)+' ИЗ '+LEVELS.length),W/2,120);
    ctx.fillStyle='#057';ctx.font='bold 30px Courier New, monospace';
    ctx.fillText(cfg.name,W/2,153);
    ctx.fillStyle='#689';ctx.font='14px Courier New, monospace';
    ctx.fillText(objective(cfg),W/2,178);
    ctx.font='12px Courier New, monospace';
    ctx.fillText(features(cfg),W/2,198);
    ctx.globalAlpha=1;
  }

  // в неофициальной копии — надпись на поле
  if(!OFFICIAL){
    ctx.font='bold 11px Courier New, monospace';ctx.textAlign='right';
    ctx.fillStyle='rgba(204,34,34,0.75)';ctx.fillText('НЕОФИЦИАЛЬНАЯ КОПИЯ · artemiylakin-debug.github.io/Kod-Clod',W-8,H-8);
  }
  // счётчик кадров — включается в настройках
  if(save.fps){
    const s=fpsShown+' FPS · '+tierName();
    ctx.font='bold 11px Courier New, monospace';ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(4,H-20,ctx.measureText(s).width+8,16);
    ctx.fillStyle='#057';ctx.fillText(s,8,H-8);
  }
  if(RACE_DIFF&&MP)mpDrawHud();
  updateHud();
}

// превью облика в меню
// превью: тело справа, за ним — след из 18 точек по дуге
const PV_TRAIL=[];
for(let k=0;k<18;k++)PV_TRAIL.push({x:0,y:0,life:k+1,hot:0});
function drawPreview(){
  const pv=$id('pv');
  if(!pv)return;
  const c=pv.getContext('2d'),s=pv.height/56,L=pvLook||previewLook();
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,pv.width,pv.height);
  c.setTransform(s,0,0,s,0,0);
  const cx=pv.width/s-34,cy=30;
  for(let k=0;k<PV_TRAIL.length;k++){const q=PV_TRAIL[k],d=(PV_TRAIL.length-k)*3.2;q.x=cx-d;q.y=cy+Math.sin(d*0.08+time*0.05)*6;}
  drawTrail(c,PV_TRAIL,L,colOf(L.c,time),PV_TRAIL.length,time);
  drawPlayerBody(c,{x:cx,y:cy,vx:0,vy:0,r:14,face:0},time,true,L);
}

const msgEl=$id('msg');
const hudEl={data:$id('dataVal'),score:$id('scoreVal'),level:$id('levelVal'),hearts:$id('hearts'),dash:$id('dash'),trip:$id('trip'),emp:$id('emp'),bEmp:$id('bEmp'),bDash:$id('bDash'),bTrip:$id('bTrip')};
const hudLast={};
function setHud(k,v){v=String(v);if(hudLast[k]!==v){hudLast[k]=v;hudEl[k].textContent=v;}}
function setOff(k,off){if(hudLast[k+'Off']!==off){hudLast[k+'Off']=off;hudEl[k].classList.toggle('off',off);}}
function updateHud(){
  const c=cfgNow();
  setHud('data',Math.min(got,goalOf(c))+'/'+goalOf(c));
  setHud('score',score);
  setHud('level',CUSTOM?'★':(lvl+1)+'/'+LEVELS.length);
  setHud('hearts',heartsStr(lives));
  const cd=Math.min(5,Math.ceil(player.dashCd/14));
  setHud('dash','▓'.repeat(5-cd)+'░'.repeat(cd));
  const tc=Math.min(5,Math.ceil((player.tripCd||0)/(tripCdMax()/5)));
  setHud('trip','▓'.repeat(5-tc)+'░'.repeat(tc));
  setOff('bTrip',(player.tripCd||0)>0);
  setHud('emp',emp);
  setHud('bEmp','EMP ×'+emp);
  setOff('bDash',player.dashCd>0);
  setOff('bEmp',emp<=0||player.empCd>0);
}

function actGift(n){
  const g=[];
  for(const cat of CATS)cat.list.forEach(it=>{if(it.act===n)g.push('<b>'+it.name+'</b>');});
  return g.length?'<p>Открыто в «Облике»: '+g.join(', ')+'.</p>':'';
}

function showMenu(s,focusAct){
  if(s!=='skins')tryOn=null;
  if(s!=='profile')pvLook=null;
  // новый ключ MCP показывается один раз — уходим с экрана, и он больше не виден
  if(s!=='mcp')mcpNewKey='';
  // перерисовка того же экрана (выбор вкладки, правка в редакторе) не сбрасывает прокрутку
  const keep=s===menuScreen&&!menuEl.hidden?panelEl.scrollTop:0;
  menuScreen=s;
  // конструктору карт нужна вся ширина
  panelEl.classList.toggle('wide',s==='editor');
  panelEl.innerHTML=panelHTML(s);
  menuEl.hidden=false;
  screenEl.classList.add('menu-open');
  panelEl.scrollTop=keep;
  if(kbUser){
    const b=(focusAct&&panelEl.querySelector('[data-act="'+focusAct+'"]'))||((s==='signin'||s==='signup')&&$id('lg-login'))||panelEl.querySelector('.primary')||panelEl.querySelector('button:not([disabled])');
    if(b)b.focus({preventScroll:true});
  }
  // текст ошибки входа приходит и от сервера, поэтому только textContent
  const er=panelEl.querySelector('.err');
  if(er&&NET.err&&(s==='gate'||s==='acct')){er.textContent=NET.err;er.hidden=false;}
  if(s==='termstext'){const box=panelEl.querySelector('.terms');if(box&&TERMS_TPL)box.appendChild(TERMS_TPL.content.cloneNode(true));}
  if(s==='skins')drawPreview();
  if(s==='main'||s==='acct')fillAccount();
  if(s==='top')fillTop();
  if(s==='editor')edBind();
  if(s==='community'&&NET_ON)fillCommunity();
  if(s==='profile')fillProfile();
  if(s==='admin')fillAdmin();
  if(s==='mcp')fillMcp();
  if(s==='mylevels')fillAiDrafts();
  if(s==='race')mpBind();
  if(s==='acct'){const bi=$id('bio');if(bi)bi.value=save.bio||'';}
}
function hideMenu(){
  if(menuEl.contains(document.activeElement))document.activeElement.blur();
  menuEl.hidden=true;
  screenEl.classList.remove('menu-open');
}
function goMenu(){

  walls=[];flows=[];gates=[];lags=[];tps=[];scan=null;movers=[];solids=[];holes=[];invs=[];strikes=[];bgAct=0;boost=0;shake=0;

// подпись предмета: цена, акт, звезда поддержки или галочка у надетого
function itemChip(cat,i,cur){
  const it=cat.list[i],own=owned(cat.id,i);
  if(it.sup&&!own&&!DONATE_ON)return '';
  const tag=own?(save[cat.key]===i?'✓':''):(it.price?'◈ '+it.price:(it.act?'акт '+it.act:'★'));
  const sw=cat.id==='c'?'<span class="sw" style="background:'+it.main+(it.rainbow?';background:conic-gradient(#f33,#fd2,#3d5,#2cf,#55f,#e3e,#f33)':(it.sw?';background:'+it.sw:''))+'"></span>':'';
  return '<button type="button" class="chip'+(own?'':' lock')+'" data-act="item:'+cat.id+':'+i+'" aria-pressed="'+(i===cur)+'">'+sw+it.name+(tag?'<small>'+tag+'</small>':'')+'</button>';
}
// нажатие на предмет: своё — надеть, чужое — примерить (в превью), купить — отдельной кнопкой
function pickItem(cat,i,focusAct){
  const c=catOf(cat);
  if(!c.list[i])return;
  if(owned(cat,i)){save[c.key]=i;tryOn=null;persist();}
  else tryOn={cat,i};
  showMenu('skins',focusAct||'item:'+cat+':'+i);
}
function buyItem(){
  if(!tryOn)return;
  const c=catOf(tryOn.cat),it=c.list[tryOn.i];
  if(!it.price||owned(tryOn.cat,tryOn.i)||coins()<it.price)return;
  save.own.push(tryOn.cat+tryOn.i);
  save[c.key]=tryOn.i;
  const id='item:'+tryOn.cat+':'+tryOn.i;
  tryOn=null;persist();buzz(40);
  showMenu('skins',id);
}
function act(a){
  const k=a.split(':')[0],arg=a.split(':')[1]||'',n=Number(arg);
  // удаление и очистка — вторым нажатием на ту же кнопку
  const sure=armed===a;armed='';
  if((k==='play'||k==='new'||k==='again'||k==='lv')&&needLogin()){showMenu('gate');return;}
  if(k==='play')newRun(save.unlocked-1);
  else if(k==='new'||k==='again')newRun(0);
  else if(k==='lv'){if(n<save.unlocked)newRun(n);}
  else if(k==='lvact'){if(actStart(n)<save.unlocked){lvAct=n;showMenu('levels',a);}}
  else if(k==='levels'){lvAct=actOf(save.unlocked-1);showMenu('levels');}
  else if(k==='tab'){shopTab=catOf(a.split(':')[1]).id;tryOn=null;showMenu('skins',a);}

// джойстик «плавающий»: появляется там, где палец коснулся левой половины поля
const screenEl=$id('screen'),stick=$id('stick'),knob=$id('knob');
let stickId=null,stickX=0,stickY=0,knobX=0,knobY=0,knobDirty=false;
function resetKnob(){
  knobDirty=false;
  knob.style.transform='';
  stick.style.left=stick.style.top=stick.style.bottom='';
  stick.classList.remove('on');
}
function releaseAll(){
  for(const k in keys)keys[k]=false;
  joy.x=joy.y=0;stickId=null;resetKnob();
  pressed.dash=0;pressed.emp=false;pressed.trip=0;

function stickStart(e){
  const r=screenEl.getBoundingClientRect(),R=stick.offsetWidth/2;
  stickId=e.pointerId;stickX=e.clientX;stickY=e.clientY;
  try{screenEl.setPointerCapture(e.pointerId);}catch(_){}
  stick.style.left=(e.clientX-r.left-screenEl.clientLeft-R)+'px';
  stick.style.top=(e.clientY-r.top-screenEl.clientTop-R)+'px';
  stick.style.bottom='auto';
  stick.classList.add('on');
  stickMove(e);
}
function stickMove(e){
  const R=stick.offsetWidth/2||60;
  let x=(e.clientX-stickX)/R,y=(e.clientY-stickY)/R;
  const l=Math.hypot(x,y);
  if(l>1){x/=l;y/=l;}
  if(l<0.15){joy.x=0;joy.y=0;}else{joy.x=x;joy.y=y;}
  // Android шлёт движения пальца до 240 раз в секунду — ручку двигаем один раз за кадр
  knobX=x*R*0.6;knobY=y*R*0.6;knobDirty=true;
}
screenEl.addEventListener('pointerdown',e=>{
  if(e.button>0||e.pointerType==='mouse'||phase!=='game')return;
  e.preventDefault();
  const r=screenEl.getBoundingClientRect();
  if(stickId===null&&e.clientX<r.left+r.width/2)stickStart(e);
});
screenEl.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
const stickEnd=e=>{if(e.pointerId===stickId){stickId=null;joy.x=0;joy.y=0;resetKnob();}};
screenEl.addEventListener('pointerup',stickEnd);

// ================= РАЗМЕР ХОЛСТА =================
// холст вписывается в свободное место; на сенсорном экране поле растягивается на весь экран,
// а клетка фона продолжается по краям. Плотность пикселей задаёт уровень графики (resScale).
const stageEl=$id('stage'),appEl=$id('app'),uiEl=$id('ui');
const touchMQ=matchMedia('(pointer: coarse)');
function fit(){
  const touch=touchMQ.matches;
  let rw,rh;
  if(touch){rw=screenEl.clientWidth;rh=screenEl.clientHeight;}
  else{const r=stageEl.getBoundingClientRect();rw=r.width-4;rh=r.height-4;}
  const k=Math.max(0.2,Math.min(rw/W,rh/H,touch?3:1.4));
  const cw=Math.floor(W*k),ch=Math.floor(H*k);
  cvs.style.width=cw+'px';cvs.style.height=ch+'px';
  if(touch){
    const l=Math.floor((rw-cw)/2),t=Math.floor((rh-ch)/2),g=40*k;
    cvs.style.left=l+'px';cvs.style.top=t+'px';
    screenEl.style.backgroundSize=g+'px '+g+'px';
    screenEl.style.backgroundPosition=l+'px '+t+'px';
    screenEl.style.setProperty('--cvs-top',t+'px');
  }else{
    cvs.style.left=cvs.style.top='';
    screenEl.style.backgroundSize=screenEl.style.backgroundPosition='';
    screenEl.style.removeProperty('--cvs-top');
  }
  const bw=Math.round(cw*resScale),bh=Math.round(ch*resScale);
  if(cvs.width!==bw||cvs.height!==bh){
    cvs.width=bw;cvs.height=bh;
    buildBg();
    render(true);
  }
}
// на сенсорном экране HUD и сообщения переезжают внутрь поля

  if(touchMQ.matches){screenEl.insertBefore(uiEl,menuEl);screenEl.insertBefore(msgEl,menuEl);}
  else{appEl.insertBefore(uiEl,stageEl);appEl.append(msgEl);}
  fit();
}
if(touchMQ.addEventListener)touchMQ.addEventListener('change',place);
else if(touchMQ.addListener)touchMQ.addListener(place);

// ================= ЦИКЛ =================
// логика идёт фиксированными шагами по 60 в секунду, а кадр рисуется только после шага:
// на экранах 90–120 Гц лишние перерисовки съедали шлейфы и давали рывки
let last=performance.now(),lag=0,sinceRender=0,fpsCount=0,fpsT=0,fpsShown=0;
function frame(now){
  const dt=Math.min(250,now-last);last=now;lag+=dt;
  // на слабом устройстве игра лучше чуть замедлится, чем будет перескакивать: не больше 4 шагов за кадр
  if(lag>STEP*4)lag=STEP*4;
  const wasGame=phase==='game';
  let ticks=0;
  while(lag>=STEP){
    if(phase==='game')step();
    else if(phase==='menu'){time++;moveDust();}
    lag-=STEP;ticks++;
  }
  sinceRender+=ticks;
  if(knobDirty){knobDirty=false;knob.style.transform='translate('+knobX+'px,'+knobY+'px)';}
  // на низкой графике кадр рисуется через шаг логики — ровные 30 кадров вместо рваных 40
  if(sinceRender>=(Q.fps30?2:1)&&(wasGame||phase==='game'||phase==='menu')){
    sinceRender=0;
    render(false);
    if(phase==='menu'&&(menuScreen==='skins'||menuScreen==='profile'&&pvLook))drawPreview();
    fpsCount++;
    if(now-fpsT>=1000){fpsShown=Math.round(fpsCount*1000/(now-fpsT));fpsCount=0;fpsT=now;}
    // «Авто»: каждые 2 секунды игры сверяем среднюю длину кадра с целью (60 или 30 кадров)
    if(phase==='game'&&save.q==='auto'){
      if(!perfT)perfT=now;
      perfFrames++;
      const el=now-perfT;
      if(el>=2000){
        const avg=el/perfFrames;
        perfT=0;perfFrames=0;
        if(avg>(Q.fps30?34:17)*1.3)downgrade();
      }
    }
  }
  // пауза и меню не должны попадать в замер
  if(phase!=='game'){perfT=0;perfFrames=0;}
  musUpdate();
  requestAnimationFrame(frame);
}

// ================= УРОВНИ ИГРОКОВ: ФОРМАТ И ПРОВЕРКА =================
// Уровень из редактора хранится в «формате редактора» — карта из клеток, числа, флаги и короткие строки; так же он
// лежит в базе (levels.data). Перед игрой normLevel превращает его в конфиг как у LEVELS. Чужой
// уровень — чужой ввод, поэтому normLevel заново проверяет и обрезает всё, что в нём есть
const ED_TYPES=['chaser','sniper','heavy','glitch','worm','botnet','turret','thief','miner','missile','mirror'];
const ED_NAMES={chaser:'Охотник',sniper:'Снайпер',heavy:'Щитоносец',glitch:'Глитч',worm:'Червь',botnet:'Ботнет',turret:'Турель',thief:'Вор',miner:'Минёр',missile:'Ракета',mirror:'Зеркало'};
const BOSS_KINDS=[['ring','кольца пуль'],['aimed','стреляет в тебя'],['pack','затягивает'],['charge','таранит'],['spiral','спираль'],['balance','две сферы'],['captcha','щит'],['seeker','самонаведение'],['orbit','кружит'],['cloak','исчезает'],['traffic','светофор'],['kraken','щупальца'],['nova','сверхновая'],['twin','двойник'],['final','всё понемногу'],['admin','зовёт ботнет'],['omega','всё сразу'],['singularity','сингулярность']];
const ED_MAX={walls:24,gates:8,flow:4,lag:6,inv:6,holes:4,tps:3,mov:6};
const ED_FLAGS=[['dark','Темнота'],['ice','Невесомость'],['storm','Спам-пули'],['debris','Мусор'],['strike','Удары с орбиты'],['timer','Очистка по таймеру']];
// адрес сайта — для копии игры без своей базы (например, в артефакте): сообщество живёт там
const SITE_URL='https://artemiylakin-debug.github.io/Kod-Clod/';
// вокруг старта игрока (центр поля) препятствия не ставятся
const START_R=60;
function edNum(v,a,b,def){const n=Number(v);return isFinite(n)?Math.max(a,Math.min(b,Math.round(n))):def;}
// строки уровня попадают и в меню, поэтому без управляющих символов и символов разметки
function edStr(v,max){return typeof v==='string'?v.replace(/[\u0000-\u001f\u007f<>&"'`\\]/g,'').replace(/\s+/g,' ').trim().slice(0,max):'';}
function edArr(v,max){return Array.isArray(v)?v.slice(0,max):[];}
function escHTML(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);}
function isUuid(v){return typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);}
function fmtDate(ms){const d=new Date(ms);return ms?String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear():'—';}
function rectNearStart(q,pad){const cx=Math.max(q.x,Math.min(W/2,q.x+q.w)),cy=Math.max(q.y,Math.min(H/2,q.y+q.h));return Math.hypot(cx-W/2,cy-H/2)<pad;}
function edRect(q,min){
  if(!q||typeof q!=='object')return null;
  const w=edNum(q.w,min,W,0),h=edNum(q.h,min,H,0);
  if(!w||!h)return null;
  return{x:edNum(q.x,0,W-w,0),y:edNum(q.y,0,H-h,0),w,h};
}
function edCircle(z){return z&&typeof z==='object'?{x:edNum(z.x,0,W,W/2),y:edNum(z.y,0,H,H/2),r:edNum(z.r,30,140,80)}:null;}
function edPt(p){return p&&typeof p==='object'?{x:edNum(p.x,30,W-30,W/2),y:edNum(p.y,30,H-30,H/2)}:null;}
// подвижный блок не выезжает за поле: размах не больше, чем места до края
function edMover(q){
  const r=edRect(q,10);
  if(!r)return null;
  r.ax=edNum(q.ax,0,Math.min(r.x,W-r.x-r.w,200),0);r.ay=edNum(q.ay,0,Math.min(r.y,H-r.y-r.h,200),0);
  r.sp=Math.max(0.005,Math.min(0.03,Number(q.sp)||0.012));r.ph=Math.max(0,Math.min(7,Number(q.ph)||0));
  return r;
}
function moverZone(m){return{x:m.x-m.ax,y:m.y-m.ay,w:m.w+m.ax*2,h:m.h+m.ay*2};}
// облик босса берём у первого босса того же вида из основной игры
function bossPreset(kind){for(const l of LEVELS)if(l.boss&&l.boss.kind===kind)return l.boss;return LEVELS[4].boss;}
// формат редактора → конфиг уровня; null — это не уровень
// ================= КАРТА ИЗ КЛЕТОК (ФОРМАТ 2) =================
// Поле 800×500 делится на клетки 25×25 — 32 столбца и 20 строк. Карта — 20 строк по 32 символа,
// что значит каждый символ — в TILES. Такую карту удобно рисовать кистью в редакторе и писать
// текстом (так её пишет ИИ через MCP). Стены, барьеры и блоки из соседних клеток сливаются в один
const TILE=25,TCOLS=32,TROWS=20,TILE_N=TCOLS*TROWS;
const TILES={'.':'пусто','#':'стена','F':'барьер файрвола','~':'лаг','I':'инверсия','>':'поток вправо','<':'поток влево','^':'поток вверх','v':'поток вниз',
  'H':'подвижный блок ↔','V':'подвижный блок ↕','O':'чёрная дыра','1':'роутер 1','2':'роутер 2','3':'роутер 3','T':'турель','M':'мина','S':'старт игрока'};
// сколько каких клеток может быть на карте; у роутера — пара клеток одной цифры
const TILE_MAX={O:4,T:6,M:12,S:1,'1':2,'2':2,'3':2};
// эти клетки не ставятся вплотную к старту игрока
const SOLID_TILES='#FHVOTM123';
const FLOW_DIR={'>':[1,0],'<':[-1,0],'^':[0,-1],'v':[0,1]};
function mapCells(rows){
  const out=new Array(TILE_N).fill('.');
  if(!Array.isArray(rows))return out;
  for(let y=0;y<TROWS;y++){
    const r=typeof rows[y]==='string'?rows[y]:'';
    for(let x=0;x<TCOLS;x++){const ch=r.charAt(x);if(TILES[ch])out[y*TCOLS+x]=ch;}
  }
  return out;
}
function cellsRows(cells){const rows=[];for(let y=0;y<TROWS;y++)rows.push(cells.slice(y*TCOLS,(y+1)*TCOLS).join(''));return rows;}
// лишние клетки сверх TILE_MAX убираются
function cleanCells(cells){
  const n={};
  for(let i=0;i<TILE_N;i++){const ch=cells[i],lim=TILE_MAX[ch];if(lim){n[ch]=(n[ch]||0)+1;if(n[ch]>lim)cells[i]='.';}}
  return cells;
}
function cellCenter(i){return{x:(i%TCOLS)*TILE+TILE/2,y:Math.floor(i/TCOLS)*TILE+TILE/2};}
function startOf(cells){const i=cells.indexOf('S');return i>=0?cellCenter(i):{x:W/2,y:H/2};}
function nearStartCell(i,st){const p=cellCenter(i);return Math.hypot(p.x-st.x,p.y-st.y)<START_R;}
// жадное слияние клеток одного вида в прямоугольники: стен на карте — десятки, а не сотни
function mergeTiles(cells,ch){
  const used=new Uint8Array(TILE_N),out=[];
  for(let y=0;y<TROWS;y++)for(let x=0;x<TCOLS;x++){
    const i=y*TCOLS+x;
    if(cells[i]!==ch||used[i])continue;
    let w=1;
    while(x+w<TCOLS&&cells[i+w]===ch&&!used[i+w])w++;
    let h=1,ok=true;
    while(ok&&y+h<TROWS){
      for(let k=0;k<w;k++){const j=(y+h)*TCOLS+x+k;if(cells[j]!==ch||used[j]){ok=false;break;}}
      if(ok)h++;
    }
    for(let yy=0;yy<h;yy++)for(let k=0;k<w;k++)used[(y+yy)*TCOLS+x+k]=1;
    out.push({x:x*TILE,y:y*TILE,w:w*TILE,h:h*TILE});
  }
  return out;
}
// карта → препятствия конфига уровня; твёрдое вплотную к старту пропускается, чтобы было где появиться
function mapToCfg(c,cells){
  const st=startOf(cells);
  cells=cells.map((ch,i)=>SOLID_TILES.indexOf(ch)>=0&&nearStartCell(i,st)?'.':ch);
  if(cells.indexOf('S')>=0)c.startPos=st;
  const set=(k,v)=>{if(v.length)c[k]=v;};
  set('walls',mergeTiles(cells,'#').slice(0,160));
  set('gates',mergeTiles(cells,'F').slice(0,24).map((g,k)=>Object.assign(g,{o:k*100%300})));
  const mov=[];
  for(const ch of ['H','V'])mergeTiles(cells,ch).forEach(m=>{
    m.ax=ch==='H'?Math.max(0,Math.min(75,m.x,W-m.x-m.w)):0;
    m.ay=ch==='V'?Math.max(0,Math.min(75,m.y,H-m.y-m.h)):0;
    m.sp=0.012;m.ph=mov.length*1.6;mov.push(m);
  });
  set('mov',mov.slice(0,12));
  const holes=[],tp={},place=[];
  cells.forEach((ch,i)=>{
    const p=cellCenter(i);
    if(ch==='O')holes.push({x:p.x,y:p.y,R:150,r:15,f:0.085});
    else if(ch==='1'||ch==='2'||ch==='3')(tp[ch]=tp[ch]||[]).push({x:p.x,y:p.y});
    else if(ch==='T')place.push({t:'turret',x:p.x,y:p.y});
    else if(ch==='M')place.push({t:'mine',x:p.x,y:p.y});
  });
  set('holes',holes.filter(h=>Math.hypot(h.x-st.x,h.y-st.y)>=h.r+START_R+40));
  set('tps',Object.keys(tp).sort().map(k=>tp[k]).filter(pr=>pr.length===2&&Math.hypot(pr[0].x-pr[1].x,pr[0].y-pr[1].y)>60));
  set('place',place);
  // лаг, инверсия и потоки остаются клетками: движок смотрит, в какой клетке стоит игрок или враг
  let z='',zl=false,zi=false,zf=false;
  for(const ch of cells){
    if(ch==='~'){z+=ch;zl=true;}
    else if(ch==='I'){z+=ch;zi=true;}
    else if(FLOW_DIR[ch]){z+=ch;zf=true;}
    else z+='.';
  }
  if(zl||zi||zf){c.zmap=z;c.zLag=zl;c.zInv=zi;c.zFlow=zf;}
}
// старый формат (прямоугольники и круги) → клетки: клетка занята, если предмет закрывает хотя бы её четверть
function cfgToCells(c){
  const cells=new Array(TILE_N).fill('.');
  const put=(x,y,ch)=>{const cx=Math.floor(x/TILE),cy=Math.floor(y/TILE);if(cx>=0&&cy>=0&&cx<TCOLS&&cy<TROWS)cells[cy*TCOLS+cx]=ch;};
  const rect=(q,ch)=>{
    for(let y=0;y<TROWS;y++)for(let x=0;x<TCOLS;x++){
      const ox=Math.min(q.x+q.w,(x+1)*TILE)-Math.max(q.x,x*TILE),oy=Math.min(q.y+q.h,(y+1)*TILE)-Math.max(q.y,y*TILE);
      if(ox>0&&oy>0&&ox*oy>=TILE*TILE/4)cells[y*TCOLS+x]=ch;
    }
  };
  const circ=(z,ch)=>{for(let i=0;i<TILE_N;i++){const p=cellCenter(i);if(Math.hypot(p.x-z.x,p.y-z.y)<z.r)cells[i]=ch;}};
  (c.flow||[]).forEach(f=>rect({x:0,y:f.y,w:W,h:f.h},f.dir>0?'>':'<'));
  (c.lag||[]).forEach(z=>circ(z,'~'));
  (c.inv||[]).forEach(z=>circ(z,'I'));
  (c.walls||[]).forEach(q=>rect(q,'#'));
  (c.gates||[]).forEach(q=>rect(q,'F'));
  (c.mov||[]).forEach(m=>rect(m,m.ay>m.ax?'V':'H'));
  (c.holes||[]).forEach(h=>put(h.x,h.y,'O'));
  (c.tps||[]).forEach((pr,k)=>pr.forEach(p=>put(p.x,p.y,String(k+1))));
  return cleanCells(cells);
}
// клетка поля в точке (для лага, инверсии и потоков из клеток)
function zoneAt(x,y){
  const cx=Math.floor(x/TILE),cy=Math.floor(y/TILE);
  return cx>=0&&cy>=0&&cx<TCOLS&&cy<TROWS?zmap.charAt(cy*TCOLS+cx):'.';
}
// турели и мины, которые автор поставил на карту, — на месте с начала уровня; мины не исчезают
function placeEnemy(q){
  if(q.t==='mine'){enemies.push({x:q.x,y:q.y,vx:0,vy:0,r:8,type:'mine',t:0,arm:60,life:1e9,inside:true});return;}
  spawnEnemy('turret');
  const e=enemies[enemies.length-1];
  if(e&&e.type==='turret'){e.x=q.x;e.y=q.y;}
}
function normLevel(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return null;
  const okType=t=>ED_TYPES.indexOf(t)>=0;
  const c={name:edStr(d.name,30)||'Без названия',descr:edStr(d.descr,200),goal:edNum(d.goal,5,30,15),cap:edNum(d.cap,3,9,6),tripCd:420,
    start:edArr(d.start,8).filter(okType),ramp:edArr(d.ramp,6).filter(okType),theme:edNum(d.theme,0,ACTS.length-1,0)};
  // формат 2 — карта из клеток; формат 1 (первый редактор) — прямоугольники и круги
  if(Array.isArray(d.map))mapToCfg(c,cleanCells(mapCells(d.map)));
  else{
  const set=(k,v)=>{if(v.length)c[k]=v;};
  set('walls',edArr(d.walls,ED_MAX.walls).map(q=>edRect(q,10)).filter(q=>q&&!rectNearStart(q,START_R)));
  set('gates',edArr(d.gates,ED_MAX.gates).map(q=>{const r=edRect(q,10);if(r)r.o=edNum(q.o,0,299,0);return r;}).filter(q=>q&&!rectNearStart(q,START_R)));
  set('flow',edArr(d.flow,ED_MAX.flow).map(f=>f&&typeof f==='object'?{y:edNum(f.y,0,H-20,0),h:edNum(f.h,20,160,60),dir:f.dir<0?-1:1}:null).filter(Boolean));
  set('lag',edArr(d.lag,ED_MAX.lag).map(edCircle).filter(Boolean));
  set('inv',edArr(d.inv,ED_MAX.inv).map(edCircle).filter(Boolean));
  set('holes',edArr(d.holes,ED_MAX.holes).map(z=>z&&typeof z==='object'?{x:edNum(z.x,20,W-20,W/2),y:edNum(z.y,20,H-20,H/2),R:edNum(z.R,80,200,150),r:15,f:0.085}:null)
    .filter(h=>h&&Math.hypot(h.x-W/2,h.y-H/2)>=h.r+START_R+40));
  set('tps',edArr(d.tps,ED_MAX.tps).map(pr=>Array.isArray(pr)&&pr.length===2?[edPt(pr[0]),edPt(pr[1])]:null)
    .filter(pr=>pr&&pr[0]&&pr[1]&&Math.hypot(pr[0].x-pr[1].x,pr[0].y-pr[1].y)>60&&!pr.some(p=>Math.hypot(p.x-W/2,p.y-H/2)<START_R)));
  set('mov',edArr(d.mov,ED_MAX.mov).map(edMover).filter(m=>m&&!rectNearStart(moverZone(m),START_R)));
  }
  if(d.scan===1||d.scan===2)c.scan=d.scan===2?SCANS.two:SCANS.one;
  if(d.dark)c.dark=220;
  if(d.ice)c.ice=true;
  if(d.storm)c.storm=150;
  if(d.debris)c.debris=200;
  if(d.strike)c.strike=280;
  if(d.timer)c.timer=50;
  const tj=edNum(d.trojan,0,2,0);
  if(tj)c.trojan=tj*0.15;
  const b=d.boss;
  if(b&&typeof b==='object'&&BOSS_KINDS.some(k=>k[0]===b.kind)){
    const p=bossPreset(b.kind);
    c.boss=Object.assign({},p,{name:edStr(b.name,20)||p.name,hp:edNum(b.hp,3,8,5)});
  }
  return c;
}

// поле редактора: клетки, оси симметрии, старт и подсветка клетки под курсором
function edDraw(){
  const cv=$id('ed');
  if(!cv||!ED||!edCells)return;
  const g=cv.getContext('2d'),ac=ACTS[ED.theme]||ACTS[0],st=startOf(edCells);
  g.setLineDash([]);g.globalAlpha=1;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=ac.bg;g.fillRect(0,0,W,H);
  g.lineWidth=1;
  for(let x=0;x<=TCOLS;x++){g.strokeStyle=x%4?'rgba(0,40,60,0.06)':ac.grid;g.beginPath();g.moveTo(x*TILE,0);g.lineTo(x*TILE,H);g.stroke();}
  for(let y=0;y<=TROWS;y++){g.strokeStyle=y%4?'rgba(0,40,60,0.06)':ac.grid;g.beginPath();g.moveTo(0,y*TILE);g.lineTo(W,y*TILE);g.stroke();}
  const tp={};
  for(let i=0;i<TILE_N;i++){
    const ch=edCells[i];
    if(ch==='.'||ch==='S')continue;
    const x=(i%TCOLS)*TILE,y=Math.floor(i/TCOLS)*TILE,L=TILE_LOOK[ch],cx=x+TILE/2,cy=y+TILE/2;
    if(ch==='O'){
      g.strokeStyle='rgba(76,29,149,0.35)';g.setLineDash([3,6]);g.beginPath();g.arc(cx,cy,150,0,TAU);g.stroke();g.setLineDash([]);
      g.fillStyle=L[0];g.beginPath();g.arc(cx,cy,11,0,TAU);g.fill();g.strokeStyle=L[1];g.lineWidth=2;g.stroke();g.lineWidth=1;
    }else if(ch==='1'||ch==='2'||ch==='3'){
      (tp[ch]=tp[ch]||[]).push([cx,cy]);
      g.strokeStyle=L[1];g.lineWidth=3;g.beginPath();g.arc(cx,cy,10,0,TAU);g.stroke();g.lineWidth=1;
      g.fillStyle=L[1];g.font='bold 11px Courier New, monospace';g.fillText(ch,cx,cy+1);
    }else{
      g.fillStyle=L[0];g.fillRect(x+1,y+1,TILE-2,TILE-2);
      g.strokeStyle=L[1];g.lineWidth=ch==='H'||ch==='V'?2.5:1.5;g.strokeRect(x+1.5,y+1.5,TILE-3,TILE-3);g.lineWidth=1;
      if(L[2]){g.fillStyle=L[1];g.font='bold 14px Courier New, monospace';g.fillText(L[2],cx,cy+1);}
    }
    // твёрдое вплотную к старту в игре не сработает — помечаем крестом
    if(SOLID_TILES.indexOf(ch)>=0&&nearStartCell(i,st)){
      g.strokeStyle='#dc2626';g.lineWidth=2;g.beginPath();g.moveTo(x+4,y+4);g.lineTo(x+TILE-4,y+TILE-4);g.moveTo(x+TILE-4,y+4);g.lineTo(x+4,y+TILE-4);g.stroke();g.lineWidth=1;
    }
  }
  for(const k in tp)if(tp[k].length===2){
    g.strokeStyle=TILE_LOOK[k][1];g.globalAlpha=0.4;g.setLineDash([2,6]);g.beginPath();g.moveTo(tp[k][0][0],tp[k][0][1]);g.lineTo(tp[k][1][0],tp[k][1][1]);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  }
  // старт и место вокруг него
  g.strokeStyle='#0aa';g.lineWidth=2;g.setLineDash([5,5]);g.beginPath();g.arc(st.x,st.y,START_R,0,TAU);g.stroke();g.setLineDash([]);
  g.fillStyle='#0cc';g.beginPath();g.arc(st.x,st.y,12,0,TAU);g.fill();
  g.fillStyle='#057';g.font='bold 12px Courier New, monospace';g.fillText('СТАРТ',st.x,st.y+26);
  // оси симметрии
  if(edSym!=='none'){
    g.strokeStyle='rgba(170,34,170,0.55)';g.lineWidth=2;g.setLineDash([8,6]);g.beginPath();
    if(edSym==='h'||edSym==='hv'){g.moveTo(W/2,0);g.lineTo(W/2,H);}
    if(edSym==='v'||edSym==='hv'){g.moveTo(0,H/2);g.lineTo(W,H/2);}
    g.stroke();g.setLineDash([]);
    if(edSym==='r'){g.fillStyle='rgba(170,34,170,0.7)';g.beginPath();g.arc(W/2,H/2,5,0,TAU);g.fill();}
    g.lineWidth=1;
  }
  // клетка под курсором и её зеркальные копии
  if(edHover>=0&&!edStroke){
    const pts=edBrush==='S'?[[edHover%TCOLS,Math.floor(edHover/TCOLS)]]:symPoints(edHover%TCOLS,Math.floor(edHover/TCOLS));
    g.strokeStyle='#a2a';g.lineWidth=2;
    for(const p of pts)g.strokeRect(p[0]*TILE+1,p[1]*TILE+1,TILE-2,TILE-2);
    g.lineWidth=1;
  }
  g.textBaseline='alphabetic';
}
// зеркальные клетки для выбранной симметрии (с самой клеткой первой)
function symPoints(x,y){
  const pts=[[x,y]],add=(a,b)=>{if(!pts.some(p=>p[0]===a&&p[1]===b))pts.push([a,b]);};
  const mx=TCOLS-1-x,my=TROWS-1-y;
  if(edSym==='h')add(mx,y);
  else if(edSym==='v')add(x,my);
  else if(edSym==='hv'){add(mx,y);add(x,my);add(mx,my);}
  else if(edSym==='r')add(mx,my);
  return pts;
}
// в зеркальной клетке стрелка потока смотрит в зеркальную сторону
function symTile(ch,x0,y0,x,y){
  const fx=x!==x0,fy=y!==y0;
  if(fx&&ch==='>')return '<';
  if(fx&&ch==='<')return '>';
  if(fy&&ch==='^')return 'v';
  if(fy&&ch==='v')return '^';
  return ch;
}
function edCellAt(e,cv){
  const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*TCOLS),y=Math.floor((e.clientY-r.top)/r.height*TROWS);
  return x>=0&&y>=0&&x<TCOLS&&y<TROWS?y*TCOLS+x:-1;
}
// одиночные предметы ставятся нажатием, остальное рисуется, пока ведёшь
const ED_ONE='OST123M';
function edBind(){
  const cv=$id('ed');
  if(!cv)return;
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const i=edCellAt(e,cv);
    if(i<0)return;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    edStroke={last:i,changed:false,note:''};edPushUndo();edPaint(i);edDraw();
  });
  cv.addEventListener('pointermove',e=>{
    const i=edCellAt(e,cv);
    if(edStroke){if(i>=0&&i!==edStroke.last&&ED_ONE.indexOf(edBrush)<0){edLine(edStroke.last,i);edStroke.last=i;edDraw();}}
    else if(i!==edHover){edHover=i;edDraw();}
  });
  const end=()=>{
    if(!edStroke)return;
    const s=edStroke;edStroke=null;
    if(s.changed){edRedoS=[];edChanged();}else edUndoS.pop();
    if(s.note)edSay(s.note);
    edDraw();
  };
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',()=>{if(!edStroke&&edHover>=0){edHover=-1;edDraw();}});
  edDraw();
}
// клетки между двумя точками мазка (быстрое движение не оставляет дыр)
function edLine(a,b){
  let x0=a%TCOLS,y0=Math.floor(a/TCOLS);
  const x1=b%TCOLS,y1=Math.floor(b/TCOLS),dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let err=dx+dy;
  while(x0!==x1||y0!==y1){
    const e2=2*err;
    if(e2>=dy){err+=dy;x0+=sx;}
    if(e2<=dx){err+=dx;y0+=sy;}
    edPaint(y0*TCOLS+x0);
  }
}
function edPaint(i){
  const ch=edBrush,x0=i%TCOLS,y0=Math.floor(i/TCOLS);
  let pts=ch==='S'?[[x0,y0]]:symPoints(x0,y0);
  if(ch==='1'||ch==='2'||ch==='3')pts=pts.slice(0,2);
  const st=ch==='S'?cellCenter(i):startOf(edCells);
  if(ch==='S'){
    for(let k=0;k<TILE_N;k++)if(SOLID_TILES.indexOf(edCells[k])>=0&&nearStartCell(k,st)){edStroke.note='Здесь вплотную стены и предметы — освободи место для старта.';return;}
    const old=edCells.indexOf('S');
    if(old>=0)edCells[old]='.';
  }
  for(const [x,y] of pts){
    const j=y*TCOLS+x,t=symTile(ch,x0,y0,x,y);
    if(edCells[j]===t)continue;
    if(t!=='.'&&t!=='S'){
      if(SOLID_TILES.indexOf(t)>=0&&nearStartCell(j,st)){edStroke.note='Вплотную к старту ничего твёрдого не ставится.';continue;}
      const lim=TILE_MAX[t];
      if(lim&&edCount(t)>=lim){edStroke.note=TILES[t].charAt(0).toUpperCase()+TILES[t].slice(1)+': больше '+lim+' не поставить.';continue;}
    }
    edCells[j]=t;edStroke.changed=true;
  }
}
function edPushUndo(){edUndoS.push(edCells.join(''));if(edUndoS.length>60)edUndoS.shift();}
function edUndo(){
  if(!edUndoS.length)return edSay('Отменять нечего.');
  edRedoS.push(edCells.join(''));edCells=edUndoS.pop().split('');edChanged();
}
function edRedo(){
  if(!edRedoS.length)return edSay('Возвращать нечего.');
  edUndoS.push(edCells.join(''));edCells=edRedoS.pop().split('');edChanged();
}
function edTest(){
  ED.map=cellsRows(edCells);
  const c=normLevel(ED);
  if(!c)return;
  edPersist();
  c.src='ed';c.edKey=edKey();
  customBack='editor';
  newRunCustom(c);
}
async function edPublish(){
  if(!ED||!edCanPub()){edSay(ED?edPubHint():'');return;}
  const b=panelEl.querySelector('[data-act="edpub"]');
  if(b){b.disabled=true;b.textContent='Публикую…';}
  const body=JSON.stringify({name:edStr(ED.name,30),descr:edStr(ED.descr,200),data:ED});
  try{
    const tok=await netToken();
    if(!tok)throw Object.assign(new Error('нужно войти в аккаунт'),{status:401});
    const h=Object.assign(netHeaders(tok),{Prefer:'return=representation'});
    let rows=null;
    if(edDraft&&edDraft.pub)rows=await netFetch('/rest/v1/levels?id=eq.'+edDraft.pub,{method:'PATCH',headers:h,body});
    // уровень удалили на сервере — публикуем заново
    if(!Array.isArray(rows)||!rows.length)rows=await netFetch('/rest/v1/levels',{method:'POST',headers:h,body});
    const id=Array.isArray(rows)&&rows[0]&&Number(rows[0].id);
    if(!id)throw new Error('сервер не вернул уровень');
    if(!edDraft)edDraft={id:'d'+Date.now().toString(36),pub:null};
    edDraft.pub=id;edPersist();
    edNote='Опубликовано! Уровень виден всем в «Сообществе».';
  }catch(e){edNote='Не получилось опубликовать: '+(e.status===0?'нет связи с сервером.':errMsg(e));}
  if(menuScreen==='editor')showMenu('editor');
}

  return{id,name:edStr(v.name,30)||'Без названия',descr:edStr(v.descr,200),author:v.author,plays:clampInt(v.plays,0,1e9,0),likes:clampInt(v.likes,0,1e9,0),hidden:v.hidden===true,at:Date.parse(v.created_at)||0};

// имена авторов — отдельным запросом; скрытые администратором игроки остаются безымянными
async function loadNames(ids,tok){
  ids=ids.filter(isUuid).filter(id=>!comNames[id]);
  if(!ids.length)return;
  const rows=await netFetch('/rest/v1/progress?select=user_id,name&user_id=in.('+ids.join(',')+')',{headers:netHeaders(tok)});
  (Array.isArray(rows)?rows:[]).forEach(r=>{if(isUuid(r.user_id))comNames[r.user_id]=edStr(r.name,20)||'Игрок';});
}
async function loadLiked(ids,tok){

async function fillCommunity(){
  const box=panelEl.querySelector('.lcards'),st=panelEl.querySelector('.com-status');

// сколько строк подходит под запрос, без самих строк: PostgREST пишет число в Content-Range
async function netCount(q){
  const opt={method:'HEAD',headers:Object.assign(netHeaders(),{Prefer:'count=exact'})};
  let tm=0;
  if(typeof AbortController==='function'){const c=new AbortController();opt.signal=c.signal;tm=setTimeout(()=>c.abort(),15000);}
  try{
    const r=await fetch(ONLINE.supabaseUrl.replace(/\/+$/,'')+q,opt);
    const m=/\/(\d+)$/.exec(r.headers.get('content-range')||'');
    return m?Number(m[1]):null;
  }catch(_){return null;}
  finally{clearTimeout(tm);}
}
function topVal(r,tab){return tab==='unlocked'?r.unlocked:(tab==='wins'?r.wins:r.best);}

  if(tab==='wins')return{big:String(r.wins),small:'побегов · рекорд '+r.best};
  return{big:String(r.best),small:'ур. '+r.unlocked+(r.wins?' · побегов: '+r.wins:'')};
}

// ================= ГОНКА: МУЛЬТИПЛЕЕР =================
// Двое проходят один и тот же уровень, у каждого свои враги; соперник виден полупрозрачным двойником.
// Побеждает тот, кто раньше дойдёт до портала. Гибель отправляет в начало уровня, а часы гонки идут дальше.
// Связь — каналы Supabase Realtime (broadcast и presence) по протоколу Phoenix, без своего сервера.
// Гонка не открывает уровней и не даёт ни рекорда, ни бит, поэтому в каналах ходят только положение
// и счёт: подделать там нечего. Соперника ищут в общем канале-лобби или зовут по коду комнаты
const MP_ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',MP_COUNT=3000,MP_SEND=200,MP_LOST=8000;
const RT={ws:null,ref:0,beat:0,chans:{},retry:0};
function rtURL(){return ONLINE.supabaseUrl.replace(/\/+$/,'').replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(ONLINE.supabaseKey)+'&vsn=1.0.0';}
function rtRaw(topic,event,payload,jr){
  if(!RT.ws||RT.ws.readyState!==1)return;
  RT.ws.send(JSON.stringify({topic,event,payload,ref:String(++RT.ref),join_ref:jr||null}));
}
function rtConnect(){
  if(RT.ws&&RT.ws.readyState<2)return;
  let ws;
  try{ws=new WebSocket(rtURL());}catch(_){return;}
  RT.ws=ws;
  ws.onopen=()=>{for(const t in RT.chans)rtJoinSend(RT.chans[t]);};
  // старый сокет (его закрывают с задержкой) новых каналов уже не касается
  ws.onmessage=e=>{if(RT.ws!==ws)return;let m;try{m=JSON.parse(e.data);}catch(_){return;}const ch=m&&RT.chans[m.topic];if(ch)rtOnMsg(ch,m);};
  // связь оборвалась — переподключаемся и заново входим во все каналы, пока они нужны
  ws.onclose=()=>{
    if(RT.ws!==ws)return;
    RT.ws=null;
    for(const t in RT.chans)RT.chans[t].joined=false;
    clearTimeout(RT.retry);
    if(Object.keys(RT.chans).length)RT.retry=setTimeout(rtConnect,1500);
  };
  clearInterval(RT.beat);
  RT.beat=setInterval(()=>rtRaw('phoenix','heartbeat',{}),25000);
}
function rtJoinSend(ch){
  if(!RT.ws||RT.ws.readyState!==1)return;
  ch.jr=String(++RT.ref);
  RT.ws.send(JSON.stringify({topic:ch.topic,event:'phx_join',ref:ch.jr,join_ref:ch.jr,
    payload:{config:{broadcast:{self:false},presence:{key:ch.key},private:false},access_token:ONLINE.supabaseKey}}));
}
function rtChannel(name,key,on){
  const ch={topic:'realtime:'+name,key,on,joined:false,jr:'',meta:null,pres:{}};
  RT.chans[ch.topic]=ch;
  rtConnect();
  rtJoinSend(ch);
  return ch;
}
function rtOnMsg(ch,m){
  const p=m.payload&&typeof m.payload==='object'?m.payload:{};
  if(m.event==='phx_reply'&&m.ref===ch.jr){
    if(p.status==='ok'){ch.joined=true;if(ch.meta)rtTrack(ch,ch.meta);ch.on('joined',{});}
    return;
  }
  if(m.event==='presence_state'){ch.pres={};rtPres(ch,p,null);ch.on('presence',{});return;}
  if(m.event==='presence_diff'){rtPres(ch,p.joins||{},p.leaves||{});ch.on('presence',{});return;}
  if(m.event==='broadcast'&&typeof p.event==='string'){ch.on('b:'+p.event,p.payload&&typeof p.payload==='object'?p.payload:{});return;}
  if(m.event==='phx_error'){
    ch.joined=false;
    setTimeout(()=>{if(RT.chans[ch.topic]===ch&&!ch.joined)rtJoinSend(ch);},1500);
  }
}
// у ключа может быть несколько записей (переподключение): уходит только та, что совпадает с текущей
function rtPres(ch,joins,leaves){
  if(leaves)for(const k in leaves){
    const cur=ch.pres[k],gone=(leaves[k]&&leaves[k].metas||[]).map(x=>x.phx_ref);
    if(cur&&gone.indexOf(cur.phx_ref)>=0)delete ch.pres[k];
  }
  for(const k in joins){const ms=joins[k]&&joins[k].metas||[];if(ms.length)ch.pres[k]=ms[ms.length-1];}
}
function rtTrack(ch,meta){ch.meta=meta;if(ch.joined)rtRaw(ch.topic,'presence',{type:'presence',event:'track',payload:meta},ch.jr);}
function rtSay(ch,event,payload){if(ch&&ch.joined)rtRaw(ch.topic,'broadcast',{type:'broadcast',event,payload},ch.jr);}
function rtLeave(ch){
  if(!ch||RT.chans[ch.topic]!==ch)return;
  delete RT.chans[ch.topic];
  rtRaw(ch.topic,'phx_leave',{},ch.jr);
  if(Object.keys(RT.chans).length)return;
  clearInterval(RT.beat);clearTimeout(RT.retry);
  const ws=RT.ws;RT.ws=null;
  if(ws)setTimeout(()=>{try{ws.close();}catch(_){}},300);
}

// кто я для соперника: имя, сколько уровней открыто и облик
function mpMe(){
  const L=wornLook();
  return{n:(save.nick||'Игрок').slice(0,20),u:save.unlocked,l:[L.c,L.s,L.t,L.h],t:Date.now()};
}
function mpCode(){
  const a=new Uint32Array(5);crypto.getRandomValues(a);
  let s='';for(const v of a)s+=MP_ALPH[v%MP_ALPH.length];
  return s;
}
function mpLook(v){
  const a=Array.isArray(v)?v:[];
  return{c:clampInt(a[0],0,SKIN_COLORS.length-1,0),s:clampInt(a[1],0,SKIN_SHAPES.length-1,0),t:clampInt(a[2],0,TRAILS.length-1,0),h:clampInt(a[3],0,HATS.length-1,0)};
}
function mpNum(v,a,b){const x=Number(v);return x>=a&&x<=b?x:(x>b?b:a);}
function mpSec(ms){return (Math.max(0,ms)/1000).toFixed(1).replace('.',',');}
function mpNew(mode){
  return{st:'idle',mode,id:NET.user.id,host:false,code:'',lobby:null,room:null,opp:null,expect:'',lv:0,diff:save.diff,seed:1,
    startAt:0,myT:-1,deaths:0,note:'',rtt:0,pingI:0,pingAt:0,tm:0,sendT:0,wait:0,respawnAt:0,result:'',waiting:0,
    iv:setInterval(mpTick,50)};
}
function mpRedraw(){if(MP&&phase==='menu'&&menuScreen==='race')showMenu('race');}
// выйти отовсюду: из лобби, из комнаты (сопернику — «пока») и из идущей гонки
function mpLeave(){
  if(!MP)return;
  if(MP.room){rtSay(MP.room,'bye',{f:MP.id});rtLeave(MP.room);}
  if(MP.lobby)rtLeave(MP.lobby);
  clearInterval(MP.iv);clearTimeout(MP.tm);
  const racing=RACE_DIFF&&phase!=='menu';
  MP=null;RACE_DIFF='';
  if(racing){runBits=0;lvBits=0;goMenu();}
}
// случайный соперник: все ждущие в лобби по порядку входа разбиваются на пары; первый в паре
// придумывает комнату и зовёт второго. Не дошёл за 10 секунд — оба снова в поиске
function mpFind(){
  mpLeave();
  MP=mpNew('random');MP.st='search';
  MP.lobby=rtChannel('dataout-lobby',MP.id,mpLobbyEv);
  rtTrack(MP.lobby,mpMe());
  showMenu('race');
}
function mpLobbyEv(ev,p){
  if(!MP||MP.st!=='search')return;
  if(ev==='presence'){
    const pr=MP.lobby.pres;
    const list=Object.keys(pr).map(k=>({k,t:Number(pr[k].t)||0})).sort((a,b)=>a.t-b.t||(a.k<b.k?-1:1));
    MP.waiting=list.length;
    const i=list.findIndex(x=>x.k===MP.id);
    if(i>=0&&i%2===0&&list[i+1]){
      const code=mpCode(),to=list[i+1].k;
      rtSay(MP.lobby,'match',{to,code});
      mpEnterRoom(code,true,to);
      return;
    }
    mpRedraw();
  }else if(ev==='b:match'&&p.to===MP.id&&typeof p.code==='string'&&/^[A-Z2-9]{5}$/.test(p.code))mpEnterRoom(p.code,false,'');
}
function mpCreate(){mpLeave();MP=mpNew('friend');mpEnterRoom(mpCode(),true,'');}
function mpJoinCode(){
  const inp=$id('mp-code'),code=inp?inp.value.toUpperCase().replace(/[^A-Z0-9]/g,''):'';
  if(!/^[A-Z2-9]{5}$/.test(code)){msg('Код комнаты — 5 букв и цифр, его видно у друга на экране гонки.');return;}
  mpLeave();MP=mpNew('friend');mpEnterRoom(code,false,'');
}
function mpEnterRoom(code,host,expect){
  if(MP.lobby){
    const lb=MP.lobby;MP.lobby=null;
    // позвавший ещё пару секунд остаётся в лобби невидимым и повторяет приглашение: если выйти сразу,
    // сервер может закрыть канал раньше, чем разошлёт его
    if(host&&expect){
      rtRaw(lb.topic,'presence',{type:'presence',event:'untrack'},lb.jr);
      let n=0;
      const again=()=>{if(!MP||MP.st!=='room'||MP.code!==code||MP.opp||n++>=3){rtLeave(lb);return;}rtSay(lb,'match',{to:expect,code});setTimeout(again,1000);};
      setTimeout(again,1000);
    }else rtLeave(lb);
  }
  Object.assign(MP,{st:'room',code,host,expect:expect||'',opp:null,note:''});
  MP.room=rtChannel('dataout-race-'+code,MP.id,mpRoomEv);
  rtTrack(MP.room,Object.assign(mpMe(),{h:host?1:0}));
  clearTimeout(MP.tm);
  if(MP.mode==='random')MP.tm=setTimeout(()=>{if(MP&&MP.st==='room'&&!MP.opp)mpFind();},10000);
  else if(!host)MP.tm=setTimeout(()=>{if(MP&&MP.st==='room'&&!MP.opp){MP.note='В комнате никого — проверь код у друга.';mpRedraw();}},6000);
  mpRedraw();
}
function mpMaxLv(){return Math.max(1,Math.min(save.unlocked,MP.opp?MP.opp.unl:save.unlocked));}
function mpSetLv(v){MP.lv=Math.max(0,Math.min(mpMaxLv()-1,v));mpCfg();}
function mpCfg(){if(MP.host)rtSay(MP.room,'cfg',{f:MP.id,lv:MP.lv,diff:MP.diff});}
function mpPing(){MP.pingI++;MP.pingAt=performance.now();rtSay(MP.room,'ping',{f:MP.id,i:MP.pingI});}
function mpPresence(){
  const pr=MP.room.pres,mine=pr[MP.id];
  const others=Object.keys(pr).filter(k=>k!==MP.id).map(k=>({k,m:pr[k]})).sort((a,b)=>(Number(a.m.t)||0)-(Number(b.m.t)||0));
  // в комнате гоняются двое; кто вошёл третьим — уходит сам
  if(mine&&MP.mode==='friend'&&others.length>=2&&(Number(others[1].m.t)||0)<(Number(mine.t)||0)){
    mpLeave();MP=mpNew('friend');MP.note='В этой комнате уже гоняются двое.';showMenu('race');
    return;
  }
  const o=MP.expect?others.find(x=>x.k===MP.expect):others[0];
  const racing=MP.st==='count'||MP.st==='race';
  if(o&&(!MP.opp||MP.opp.id!==o.k)&&!racing){
    MP.opp={id:o.k,name:edStr(o.m.n,20)||'Соперник',look:mpLook(o.m.l),unl:clampInt(o.m.u,1,LEVELS.length,1),
      x:W/2,y:H/2,vx:0,vy:0,at:0,gx:W/2,gy:H/2,face:0,got:0,goal:0,lives:0,pause:false,seen:performance.now(),deaths:0,t:-1};
    clearTimeout(MP.tm);MP.note='';
    // тот же соперник вернулся (мигнула связь) — выбранный уровень не сбрасываем
    const fresh=MP.lastOpp!==o.k;MP.lastOpp=o.k;
    if(MP.host){
      mpPing();
      if(MP.mode==='random'){if(fresh)MP.lv=Math.floor(Math.random()*mpMaxLv());MP.tm=setTimeout(mpGo,1500);}
      else MP.lv=fresh?mpMaxLv()-1:Math.min(MP.lv,mpMaxLv()-1);
      mpCfg();
    }
  }
  // во время гонки пропажа из списка — чаще всего переподключение: ждём MP_LOST, потом засчитываем
  if(!o&&MP.opp&&!racing){MP.note=MP.opp.name+' — больше не в комнате.';MP.opp=null;clearTimeout(MP.tm);}
  mpRedraw();
}
function mpRoomEv(ev,p){
  if(!MP||!MP.room)return;
  if(ev==='presence'){mpPresence();return;}
  const o=MP.opp;
  if(!o||p.f!==o.id)return;
  if(ev==='b:ping'){if(!MP.host)rtSay(MP.room,'pong',{f:MP.id,i:p.i});}
  else if(ev==='b:pong'){if(MP.host&&p.i===MP.pingI){const r=Math.min(1000,performance.now()-MP.pingAt);MP.rtt=MP.rtt?MP.rtt*0.6+r*0.4:r;}}
  else if(ev==='b:cfg'){
    if(MP.host||MP.st==='count'||MP.st==='race')return;
    MP.lv=clampInt(p.lv,0,LEVELS.length-1,0);
    if(DIFFS.indexOf(p.diff)>=0)MP.diff=p.diff;
    mpRedraw();
  }
  else if(ev==='b:go'){
    if(MP.host||!(MP.st==='room'||MP.st==='end'))return;
    mpCountdown(clampInt(p.lv,0,LEVELS.length-1,0),DIFFS.indexOf(p.diff)>=0?p.diff:'easy',clampInt(p.seed,1,2147483646,1),0);
  }
  else if(ev==='b:st'){
    o.x=mpNum(p.x,0,W);o.y=mpNum(p.y,0,H);o.vx=mpNum(p.vx,-20,20);o.vy=mpNum(p.vy,-20,20);
    o.got=clampInt(p.g,0,999,0);o.goal=clampInt(p.G,0,999,0);o.lives=clampInt(p.l,0,9,0);o.pause=p.p===1;
    o.at=o.seen=performance.now();
  }
  else if(ev==='b:die'){
    o.deaths++;o.seen=performance.now();
    if(MP.st==='race'&&phase==='game')popup(o.gx,o.gy-20,o.name+': копия','#7c3aed');
  }
  else if(ev==='b:fin'){
    o.seen=performance.now();
    const t=mpNum(p.t,0,36e5);
    if(MP.st==='race'){o.t=t;if(MP.myT>=0)mpDecide();else mpEnd('lose');}
    // финиш соперника пришёл уже после моего итога: если он был раньше — итог исправляется
    else if(MP.st==='end'&&MP.result==='win'&&MP.myT>=0&&t<MP.myT){o.t=t;if(MP.sum)MP.sum.t=t;save.mpWins=Math.max(0,(save.mpWins||0)-1);MP.result='lose';persist();mpRedraw();}
  }
  else if(ev==='b:bye'){
    if(MP.st==='race'||MP.st==='count')mpEnd('left');
    else{MP.note=o.name+' — больше не в комнате.';MP.opp=null;mpRedraw();}
  }
}
function mpGo(){
  if(!MP||!MP.host||!MP.opp||!(MP.st==='room'||MP.st==='end'))return;
  MP.lv=Math.max(0,Math.min(mpMaxLv()-1,MP.lv));
  const seed=1+Math.floor(Math.random()*2147483645);
  rtSay(MP.room,'go',{f:MP.id,lv:MP.lv,diff:MP.diff,seed});
  // гость узнаёт о старте на полпути туда-обратно позже — хозяин ровно на столько же ждёт дольше
  mpCountdown(MP.lv,MP.diff,seed,MP.rtt/2);
}
function mpCountdown(lv,diff,seed,extra){
  clearTimeout(MP.tm);
  Object.assign(MP,{st:'count',lv,diff,seed,startAt:performance.now()+MP_COUNT+extra,myT:-1,deaths:0,note:'',result:'',wait:0,respawnAt:0});
  Object.assign(MP.opp,{t:-1,got:0,goal:0,deaths:0,at:0,seen:performance.now(),pause:false});
  RACE_DIFF=diff;
  if(phase!=='menu')goMenu();
  showMenu('race');
}
// одинаковое начало уровня у обоих: на время startLevel случайность берётся из общего зерна
function mpSeeded(fn){
  const r=Math.random;let x=MP.seed;
  Math.random=()=>(x=x*16807%2147483647)/2147483647;
  try{fn();}finally{Math.random=r;}
}
function mpRunLevel(){score=0;lives=maxLives();emp=1;mpSeeded(()=>startLevel(MP.lv));}
function mpTick(){
  if(!MP)return;
  const now=performance.now();
  if(MP.st==='count'){
    const left=MP.startAt-now,el=panelEl.querySelector('.mp-count');
    if(el)el.textContent=left>0?String(Math.ceil(left/1000)):'СТАРТ!';
    if(left<=0){MP.st='race';MP.sendT=0;mpRunLevel();msg('ГОНКА! Побеждает тот, кто раньше дойдёт до портала.',4000);}
    return;
  }
  if((MP.st==='room'||MP.st==='end')&&MP.host&&MP.opp&&now-MP.pingAt>2000)mpPing();
  if(MP.st!=='race')return;
  if(MP.respawnAt&&now>=MP.respawnAt){MP.respawnAt=0;if(phase==='dead'){mpRunLevel();intro=60;}}
  if(now-MP.sendT>=MP_SEND){MP.sendT=now;mpSendState();}
  if(MP.wait&&now>=MP.wait)mpDecide();
  if(MP.opp&&now-MP.opp.seen>MP_LOST)mpEnd('lost');
}
function mpSendState(){
  if(!player)return;
  const c=cfgNow();
  rtSay(MP.room,'st',{f:MP.id,x:Math.round(player.x),y:Math.round(player.y),vx:Math.round(player.vx*100)/100,vy:Math.round(player.vy*100)/100,
    g:Math.min(got,goalOf(c)),G:goalOf(c),l:lives,p:phase==='game'?0:1});
}
// погиб в гонке: миг замирания — и резервная копия с начала того же уровня
function mpDied(){
  MP.deaths++;
  rtSay(MP.room,'die',{f:MP.id});
  phase='dead';MP.respawnAt=performance.now()+700;
  msg('ФАЙЛ УДАЛЁН — копия с начала уровня. Часы гонки идут!',3500);
}
function mpFinished(){
  MP.myT=performance.now()-MP.startAt;
  rtSay(MP.room,'fin',{f:MP.id,t:Math.round(MP.myT)});
  phase='dead';
  // итог — со следующего тика (мы внутри шага игры); если финиш соперника ещё в пути — чуть ждём его
  const o=MP.opp;
  MP.wait=performance.now()+(o&&o.t>=0?1:800);
  msg('ФИНИШ! '+mpSec(MP.myT)+' с',3000);
}
function mpDecide(){
  MP.wait=0;
  const o=MP.opp;
  mpEnd(o&&o.t>=0&&o.t<MP.myT?'lose':'win');
}
function mpEnd(res){
  if(!MP||MP.st==='end')return;
  MP.st='end';MP.result=res;MP.respawnAt=0;MP.wait=0;
  // итог запоминается сразу: соперник может уйти из комнаты, а его время и имя должны остаться на экране
  const o=MP.opp;
  MP.sum=o?{name:o.name,t:o.t,got:o.got,goal:o.goal,deaths:o.deaths}:null;
  save.mpRaces=(save.mpRaces||0)+1;
  if(res==='win'||res==='left'||res==='lost')save.mpWins=(save.mpWins||0)+1;
  persist();
  runBits=0;lvBits=0;RACE_DIFF='';
  if(phase!=='menu')goMenu();
  showMenu('race');
}
// сдаться: соперник получает «пока» и победу, а сдавшийся выходит и из комнаты
function mpQuit(){
  if(!MP)return;
  save.mpRaces=(save.mpRaces||0)+1;persist();
  mpLeave();
  showMenu('race');
  msg('Гонка сдана.');
}
// двойник соперника: его облик, полупрозрачный, с именем; между пакетами (5 в секунду) — по скорости
let mpGhostCv=null;
function mpDrawGhost(){
  const o=MP.opp;
  if(!o||!o.at)return;
  const k=Math.min(12,(performance.now()-o.at)/STEP);
  const tx=Math.max(0,Math.min(W,o.x+o.vx*k)),ty=Math.max(0,Math.min(H,o.y+o.vy*k));
  if(Math.hypot(tx-o.gx,ty-o.gy)>120){o.gx=tx;o.gy=ty;}
  else{o.gx+=(tx-o.gx)*0.35;o.gy+=(ty-o.gy)*0.35;}
  if(Math.hypot(o.vx,o.vy)>0.5)o.face=Math.atan2(o.vy,o.vx);
  const s=Math.max(1,Math.min(2,cvs.width/W)),z=Math.round(72*s);
  if(!mpGhostCv){mpGhostCv=document.createElement('canvas');}
  if(mpGhostCv.width!==z){mpGhostCv.width=z;mpGhostCv.height=z;}
  const g=mpGhostCv.getContext('2d');
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,z,z);g.setTransform(s,0,0,s,0,0);
  drawPlayerBody(g,{x:36,y:36,vx:o.vx,vy:o.vy,r:14,face:o.face},time,false,o.look);
  ctx.globalAlpha=o.pause?0.25:0.5;
  ctx.drawImage(mpGhostCv,o.gx-36,o.gy-36,72,72);
  ctx.globalAlpha=1;
  ctx.font='bold 11px Courier New, monospace';ctx.textAlign='center';ctx.fillStyle='#7c3aed';
  ctx.fillText(o.name+(o.pause?' · пауза':''),o.gx,o.gy-28);
}
// табличка гонки слева сверху: время и счёт обоих
function mpDrawHud(){
  const o=MP.opp,c=cfgNow(),t=MP.st==='race'?performance.now()-MP.startAt:0;
  const l1='ГОНКА · '+mpSec(MP.myT>=0?MP.myT:t)+' с',l2='ты '+Math.min(got,goalOf(c))+'/'+goalOf(c)+(o?' · '+o.name.slice(0,10)+' '+o.got+'/'+(o.goal||goalOf(c)):'');
  ctx.font='bold 11px Courier New, monospace';ctx.textAlign='left';
  const w=Math.max(ctx.measureText(l1).width,ctx.measureText(l2).width)+12;
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(6,6,w,32);
  ctx.fillStyle='#7c3aed';ctx.fillText(l1,12,18);
  ctx.fillStyle='#057';ctx.fillText(l2,12,32);
}
function mpResultHTML(){
  const o=MP.sum,r=MP.result,lose=r==='lose';
  const title={win:'ПОБЕДА!',lose:'ПОРАЖЕНИЕ',left:'ПОБЕДА',lost:'ПОБЕДА'}[r]||'ИТОГ';
  const why={win:'Ты у портала раньше!',lose:o?'У портала раньше — '+escHTML(o.name)+'.':'',left:'Соперника больше нет в гонке.',lost:'Связь с соперником пропала.'}[r]||'';
  const mine=MP.myT>=0?mpSec(MP.myT)+' с':'без финиша',theirs=o?(o.t>=0?mpSec(o.t)+' с':'без финиша'+(o.goal?' ('+o.got+'/'+o.goal+')':'')):'—';
  return '<h2 class="'+(lose?'bad':'good')+'">'+title+'</h2>'+(why?'<p>'+why+'</p>':'')+
    '<p>Ты: <b>'+mine+'</b>'+(MP.deaths?' · гибелей: '+MP.deaths:'')+'<br>'+(o?escHTML(o.name):'Соперник')+': <b>'+theirs+'</b>'+(o&&o.deaths?' · гибелей: '+o.deaths:'')+'</p>';
}

  if(M.st==='count')return head+'<p>Соперник: <b>'+escHTML(M.opp.name)+'</b></p><p>Уровень '+lvName(M.lv)+' · «'+DIFF[M.diff].name+'»<br>'+objective(LEVELS[M.lv])+'</p><p class="mp-count">'+Math.max(1,Math.ceil((M.startAt-performance.now())/1000))+'</p>';

  h+='<p>Ты'+(M.host?' (комната твоя)':'')+' и '+(M.opp?'<b>'+escHTML(M.opp.name)+'</b>':'… ждём соперника')+'</p>';
  if(M.note)h+='<p class="bad">'+escHTML(M.note)+'</p>';
  if(M.opp){
    if(M.host&&M.mode==='random'&&M.st==='room')h+='<p class="good">Соперник найден! Старт через секунду…</p>';
    else if(M.host)h+='<p class="lbl2">УРОВЕНЬ</p><div class="mp-lv">'+mb('mplv:-1','−','sm')+'<span>'+lvName(M.lv)+'</span>'+mb('mplv:1','+','sm')+mb('mplvr','Случайный','sm')+'</div>'+
      '<p class="foot">Можно выбрать до '+mpMaxLv()+' — столько открыто у вас обоих.</p>'+
      '<p class="lbl2">СЛОЖНОСТЬ</p><div class="chips">'+DIFFS.map(k=>chip('mpdiff:'+k,DIFF[k].name,M.diff===k)).join('')+'</div>'+

    else h+='<p>Уровень '+lvName(M.lv)+' · «'+DIFF[M.diff].name+'». Ждём, когда начнёт '+escHTML(M.opp.name)+'.</p>';
  }
