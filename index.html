<body>
<title>DATA.OUT v5.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Раскладка: на компьютере — заголовок, полоса HUD, холст 800×500, строка сообщений; меню лежит поверх поля. На сенсорном экране поле занимает весь экран, HUD, джойстик и кнопки лежат прямо на нём (боком — по краям поля). Одна светлая тема, как в оригинале. */
  :root{
    color-scheme:light;
    --bg:#f4f6fa;--ink:#057;--ink-2:#046;--muted:#689;--panel:#fff;--line:#0574;--kbd-line:#0576;
    --heart:#e02444;--score:#0a5;--coin:#b45309;--level:#a2a;--emp:#39c;--trip:#a8691a;--danger:#c22;--win:#2a6;
    --c-chaser:#a33;--c-sniper:#a70;--c-heavy:#a4a;--c-pick:#2a6;--c-trojan:#c22;--c-glitch:#a2b;--c-worm:#8a6d00;--c-bot:#c24d16;--c-turret:#475569;--c-thief:#6d28d9;--c-miner:#a16207;--c-missile:#c2410c;--c-mirror:#0e7490;
    --brand-vk:#0077ff;--brand-yandex:#fc3f1d;--brand-google:#34a853;--brand-apple:#111;
    --keys-bg:#eef;--keys-ink:#468;--keys-line:#57a;--shadow:#0572;
    --out:#eef2f7;--grid:rgba(0,120,150,.12);--glass:rgba(255,255,255,.72);--veil:rgba(244,246,250,.55);
    --font:'Courier New',Courier,ui-monospace,monospace;
  }
  html,body{height:100%;overscroll-behavior:none}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
  /* у min/max/clamp есть запасные значения для старых браузеров */
  #app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px;padding-bottom:8px;padding-left:16px;padding-right:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{margin:0;font-size:20px;font-size:clamp(15px,3.4vw,22px);letter-spacing:2px;letter-spacing:clamp(1px,.5vw,4px);text-align:center;text-wrap:balance}
  #ui{display:flex;gap:8px 10px;align-items:stretch;flex-wrap:wrap;justify-content:center}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 12px;display:flex;align-items:center;gap:8px}
  .stat .lbl{font-size:10px;color:var(--muted);letter-spacing:.5px}
  .stat .val{font-weight:bold;font-variant-numeric:tabular-nums}
  #hearts{color:var(--heart);font-size:16px}
  #dataVal,#scoreVal{color:var(--score);font-size:16px}
  #levelVal{color:var(--level);font-size:16px}
  #emp{color:var(--emp)}
  #keys{background:var(--keys-bg);border:1px dashed var(--keys-line);border-radius:6px;padding:4px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;color:var(--keys-ink);font-size:12px}
  kbd{background:var(--panel);border:1px solid var(--kbd-line);border-radius:4px;padding:0 6px;font-family:inherit}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #screen{position:relative}
  canvas{display:block}
  #c{background:var(--panel);border:2px solid var(--ink);border-radius:8px;box-shadow:0 4px 20px var(--shadow);touch-action:none}
  #msg{color:var(--level);font-weight:bold;min-height:18px;text-align:center;font-size:14px;text-wrap:balance}
  button:focus-visible{outline:3px solid var(--level);outline-offset:2px}
  /* Android подсвечивает нажатия синим прямоугольником — убираем */
  button,#screen{-webkit-tap-highlight-color:transparent}
  #stick,.pbtns,.tbtns,#rot,.rotp{display:none}
  @media (max-width:520px){.stat{padding:3px 8px;gap:6px}#hearts,#dataVal,#scoreVal,#levelVal{font-size:14px}}

  /* меню поверх поля */
  #menu{position:absolute;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;background:var(--veil);border-radius:8px}
  #menu[hidden]{display:none}
  .panel{box-sizing:border-box;width:100%;max-width:560px;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px var(--shadow);color:var(--ink)}
  .panel h2{margin:0;font-size:24px;font-size:clamp(20px,4vw,28px);letter-spacing:3px;text-align:center;text-wrap:balance}
  .panel h2.bad{color:var(--danger)}
  .panel h2.good{color:var(--win)}
  .panel p{margin:0;font-size:13px;line-height:1.45;color:var(--muted);text-align:center;text-wrap:balance}
  .panel p b{color:var(--ink)}
  .panel .sub{margin-top:-6px;font-size:11px;letter-spacing:2px}
  .panel .foot{font-size:11px}
  .panel .hp{color:var(--heart);font-size:16px}
  .panel .lbl2{font-size:10px;letter-spacing:1px}
  .panel .err{color:var(--danger)}
  /* кнопки входа на сайте: цветная метка сервиса слева от подписи */
  .prov{display:flex;align-items:center;justify-content:center;gap:8px}
  .prov::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
  .prov-vk{--pc:var(--brand-vk)}.prov-yandex{--pc:var(--brand-yandex)}.prov-google{--pc:var(--brand-google)}.prov-apple{--pc:var(--brand-apple)}
  .nick{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .nick input{font:14px var(--font);padding:8px 10px;border:2px solid var(--line);border-radius:8px;color:var(--ink);background:var(--panel)}
  .nick input:focus-visible{outline:3px solid var(--level);outline-offset:1px}
  /* iOS увеличивает страницу при вводе в поле со шрифтом мельче 16px */
  @media (pointer:coarse){.nick input{font-size:16px}}
  /* поле игры запрещает выделение, а без него iOS не даёт печатать в поля ввода */
  .panel input{user-select:text;-webkit-user-select:text}
  .lform{display:flex;flex-direction:column;gap:10px;margin:0}
  .tsum{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .tsum ul{margin:6px 0 0;padding-left:18px;font-size:12px;line-height:1.45;color:var(--ink)}
  .tsum li{margin-bottom:3px}
  .tcheck{display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:bold;cursor:pointer;line-height:1.4}
  .tcheck input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ink)}
  .terms h1{margin:0;font-size:20px;letter-spacing:3px;text-align:center}
  .panel .terms h2{margin:14px 0 4px;font-size:14px;letter-spacing:1px;text-align:left}
  .terms h3{margin:10px 0 4px;font-size:13px}
  .panel .terms p{margin:0 0 6px;font-size:12px;text-align:left;color:var(--ink)}
  .terms hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .terms a,.panel .foot a{color:var(--ink);overflow-wrap:anywhere}
  .mrow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .mcol{display:flex;flex-direction:column;gap:8px}
  .mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .acct{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
  .acct img{width:32px;height:32px;border-radius:50%;flex:none}
  .acct b{display:block;font-size:14px}
  .acct small{display:block;font-size:11px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .stats div{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
  .stats b{display:block;font-size:18px;color:var(--level);font-variant-numeric:tabular-nums}
  .stats span{font-size:10px;color:var(--muted)}
  .top{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .top li{display:grid;grid-template-columns:28px 24px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .top li.me{border-color:var(--ink);background:var(--keys-bg)}
  .top img{width:24px;height:24px;border-radius:50%}
  .top .rk{color:var(--muted);font-variant-numeric:tabular-nums}
  .top .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .sc{font-weight:bold;color:var(--score);font-variant-numeric:tabular-nums;text-align:right}
  .top small{display:block;font-weight:normal;font-size:10px;color:var(--muted)}
  @media (max-height:420px){.panel .intro{display:none}}
  .mbtn{font:bold 14px var(--font);color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
  .mbtn:hover:not(:disabled){background:var(--keys-bg)}
  .mbtn.primary{background:var(--ink);color:var(--panel)}
  .mbtn.primary:hover:not(:disabled){background:var(--ink-2)}
  .mbtn:disabled{opacity:.4;cursor:default}
  .lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .lvbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;text-align:left;font-size:12px;border-width:1px}
  .lvbtn b{font-size:15px;color:var(--level)}
  .lvbtn small{font-weight:normal;font-size:10px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .chip{display:flex;align-items:center;gap:6px;font:bold 12px var(--font);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--keys-bg)}
  .chip:disabled{opacity:.4;cursor:default}
  .sw{width:12px;height:12px;border-radius:50%;flex:none}
  #pv{margin:0 auto;width:180px;height:84px}
  .chip small{font-weight:normal;font-size:10px;color:var(--muted)}
  .chip.lock{border-style:dashed}
  .panel .coins{font-size:15px;color:var(--ink)}
  .panel .coins b{color:var(--coin)}
  .mbtn.buy{border-color:var(--coin);color:var(--coin)}
  .mbtn.donate{border-color:var(--heart);color:var(--heart)}
  .panel p.good{color:var(--win)}
  .help{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
  .help .r b{color:var(--c-chaser)}
  .help .y b{color:var(--c-sniper)}
  .help .p b{color:var(--c-heavy)}
  .help .g b{color:var(--c-pick)}
  .help .t b{color:var(--c-trojan)}
  .help .m b{color:var(--c-glitch)}
  .help .o b{color:var(--c-worm)}
  .help .b b{color:var(--c-bot)}
  .help .tu b{color:var(--c-turret)}
  .help .th b{color:var(--c-thief)}
  .help .mn b{color:var(--c-miner)}
  .help .mi b{color:var(--c-missile)}
  .help .mr b{color:var(--c-mirror)}
  .story p{color:var(--ink)}

  /* сенсорный экран: поле во весь экран, всё управление поверх него */
  @media (pointer:coarse){
    #keys{display:none}
    #screen{flex:1;align-self:stretch;min-width:0;box-sizing:border-box;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background-color:var(--out);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    #screen #c{position:absolute;border:0;border-radius:0;box-shadow:none;outline:1px dashed var(--keys-line)}
    #ui{position:absolute;z-index:2;top:8px;right:8px;bottom:8px;left:8px;margin:0;display:grid;grid-template-columns:auto 1fr auto;align-content:start;gap:4px;pointer-events:none}
    .s-data{grid-area:1/1}.s-score{grid-area:2/1}.s-level{grid-area:3/1}.s-hp{grid-area:4/1}
    .s-dash{grid-area:1/3}.s-trip{grid-area:2/3}.s-emp{grid-area:3/3}
    .stat{justify-self:start;background:var(--glass);padding:2px 8px;gap:6px}
    .s-dash,.s-trip,.s-emp{justify-self:end}
    .stat .lbl{font-size:9px}
    #hearts,#dataVal,#scoreVal,#levelVal,#emp{font-size:13px}
    #dash,#trip{font-size:12px}
    .tbtns{grid-area:4/3;justify-self:end;display:flex;gap:4px;pointer-events:auto}
    .tbtns button{font:bold 10px var(--font);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:4px 8px;touch-action:none}
    #msg{position:absolute;z-index:2;top:calc(var(--cvs-top,0px) + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:56%;max-width:min(56%,420px);min-height:0;font-size:12px;background:var(--glass);border-radius:6px;padding:3px 10px;pointer-events:none}
    #msg:empty{display:none}
    #stick{display:block;position:absolute;z-index:3;left:14px;bottom:14px;width:120px;height:120px;border-radius:50%;background:var(--glass);border:2px dashed var(--keys-line);opacity:.6;pointer-events:none}
    #stick.on{opacity:1}
    #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--ink);opacity:.8}
    /* дугой под большой палец: EMP слева, ПОДНОЖКА над РЫВКОМ */
    .pbtns{display:grid;grid-template-columns:auto auto;position:absolute;z-index:3;right:14px;bottom:14px;align-items:end;justify-items:center;gap:10px}
    .pbtns button{border-radius:50%;border:2px solid var(--ink);background:var(--glass);color:var(--ink);font:bold 12px var(--font);touch-action:none}
    .pbtns button:active{background:var(--keys-bg)}
    .pbtns button.off{opacity:.45}
    #bTrip{grid-area:1/2;width:64px;height:64px;border-color:var(--trip);color:var(--trip);font-size:10px}
    #bDash{grid-area:2/2;width:84px;height:84px}
    #bEmp{grid-area:2/1;width:64px;height:64px;margin-bottom:44px;border-color:var(--emp);color:var(--emp)}
    #rot{display:block;position:absolute;left:0;right:0;top:calc(var(--cvs-top,0px) - 26px);text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
    #screen.menu-open #ui,#screen.menu-open .pbtns,#screen.menu-open #stick,#screen.menu-open #msg,#screen.menu-open #rot{visibility:hidden}
    .panel{padding:12px 14px;gap:8px}
    .mbtn{padding:9px 10px;font-size:13px}
  }
  @media (pointer:coarse) and (orientation:portrait){.panel .rotp{display:block}}
  @media (pointer:coarse) and (orientation:landscape){
    h1,#rot{display:none}
    #app{padding-top:4px;padding-bottom:4px}
  }
</style>

<div id="app">
  <h1>DATA.OUT v5.0 — ПОБЕГ ИЗ КОРЗИНЫ</h1>
  <div id="ui">
    <div class="stat s-data"><span class="lbl">ДАННЫЕ</span><span class="val" id="dataVal">0/15</span></div>

    </div>
  </div>
  <div id="msg" role="status"></div>
</div>

<hr>
<h2>ПРЕАМБУЛА. ОБЩИЕ ПОЛОЖЕНИЯ</h2>
<p>Настоящий документ (далее — «Соглашение») устанавливает совокупность условий, правил, ограничений и иных положений, регулирующих предоставление доступа к программному продукту Data.out, его интерфейсным компонентам, игровым режимам, учётным записям, внутриигровым объектам, цифровым единицам учёта и иным составляющим интерактивной программной среды (далее совместно — «Система»).</p>
<p>Использование Системы допускается при условии принятия Пользователем применимых положений настоящего Соглашения посредством предусмотренного интерфейсом механизма подтверждения согласия.</p>
<p><b>Принцип договорной интерпретации:</b> предоставление доступа к Системе само по себе не означает передачи Пользователю исключительных прав на программный продукт, его исходный код, серверную инфраструктуру, игровые механики либо иные охраняемые результаты интеллектуальной деятельности.</p>
<hr>
<h2>РАЗДЕЛ I. ПРАВОВОЙ СТАТУС ИГРОВОЙ СРЕДЫ</h2>
<h3>1.1. Предоставление ограниченного разрешения</h3>
<p>1.1.1. Пользователю предоставляется ограниченное, неисключительное и непередаваемое разрешение на использование доступной функциональности Системы в личных игровых целях.</p>
<p>1.1.2. Указанное разрешение не предполагает возникновения у Пользователя права собственности на саму Систему, её исходный код, серверные компоненты, интерфейсные элементы и принадлежащие Оператору результаты интеллектуальной деятельности.</p>
<p>1.1.3. Доступность отдельных функций может зависеть от технических, организационных, игровых и иных условий функционирования Системы.</p>

function objective(c){return 'Собери '+goalOf(c)+' данных — '+(c.boss?'потом придёт «'+c.boss.name+'»':'откроется портал');}
const ENEMY_TAGS={turret:'турели',thief:'воры',miner:'мины',missile:'ракеты',mirror:'зеркала'};
function features(c){
  const f=[];
  if(c.timer)f.push('очистка каждые '+timerOf(c)+' с');
  if(c.walls)f.push('битые сектора');
  if(c.storm)f.push('спам-пули с краёв');
  if(c.dark)f.push('темнота');
  if(c.fast)f.push('быстрые охотники');
  if(c.trojan)f.push('трояны');
  if(c.flow)f.push('потоки трафика');
  if(c.gates)f.push('барьеры файрвола');
  if(c.lag)f.push('зоны лага');
  if(c.tps)f.push('роутеры');
  if(c.ice)f.push('невесомость');
  if(c.debris)f.push('космический мусор');
  if(c.scan)f.push(c.scan.arms>1?'два луча сканера':'сканер');
  if(c.mov)f.push('подвижные блоки');
  if(c.holes)f.push('чёрные дыры');
  if(c.strike)f.push('удары с орбиты');
  if(c.inv)f.push('зоны инверсии');
  // враги города и дальше — их легко не заметить в списке, поэтому называем
  for(const t in ENEMY_TAGS)if(c.start.indexOf(t)>=0||c.ramp.indexOf(t)>=0)f.push(ENEMY_TAGS[t]);
  if(c.boss)f.push('босс');
  return f.join(' · ');
}

// купленные предметы — коды вида «c4» (цвет №4), «t2» (след №2); берём только то, что продаётся
function parseOwn(v){
  const a=Array.isArray(v)?v:(typeof v==='string'?v.split(','):[]),out=[];
  for(const id of a){
    if(typeof id!=='string'||!/^[csth]\d{1,2}$/.test(id)||out.indexOf(id)>=0)continue;
    const it=catOf(id[0]).list[Number(id.slice(1))];
    if(it&&it.price)out.push(id);
  }
  return out;
}

  if(!it)return false;

// у радуги цвет меняется со временем; остальные цвета — как есть
function hslHex(h,s,l){
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1)))).toString(16).padStart(2,'0');
  return '#'+f(0)+f(8)+f(4);
}
const RAINBOW={main:'',dark:'',ring:'',trail:''},SHIMMER={main:'',dark:'',ring:'',trail:''};
function colOf(i,t){
  const k=SKIN_COLORS[i]||SKIN_COLORS[0];
  if(k.shimmer){
    // алмаз: оттенок плавно ходит от голубого к сиреневому и обратно (8 шагов — свечение кэшируется)
    const h=190+Math.round(4*(1-Math.cos(t*0.03)))*8;
    SHIMMER.main=hslHex(h,0.9,0.8);SHIMMER.dark=hslHex(h,0.6,0.24);SHIMMER.ring=hslHex(h,0.8,0.62);SHIMMER.trail=hslHex(h,0.9,0.88);
    return SHIMMER;
  }
  if(!k.rainbow)return k;
  const h=Math.floor(t*2/15)*15%360;
  RAINBOW.main=hslHex(h,0.85,0.5);RAINBOW.dark=hslHex(h,0.7,0.2);RAINBOW.ring=hslHex(h,0.8,0.4);RAINBOW.trail=hslHex(h,0.85,0.6);
  return RAINBOW;
}

function setLayout(c){
  walls=c.walls||[];flows=c.flow||[];gates=c.gates||[];lags=c.lag||[];tps=c.tps||[];
  scan=c.scan?{x:c.scan.x,y:c.scan.y,arms:c.scan.arms,v:c.scan.v,gap:c.scan.gap,a:0}:null;

  holes=c.holes||[];invs=c.inv||[];strikes=[];

// подвижный блок ходит туда-сюда по синусу
function moveMovers(){for(const m of movers){const k=Math.sin(time*m.sp+m.ph);m.x=m.bx+k*m.ax;m.y=m.by+k*m.ay;}}
// путь подвижного блока целиком — там не появляются данные, бонусы и турели
function inMoverZone(x,y,pad){
  for(const m of movers){const ax=Math.abs(m.ax),ay=Math.abs(m.ay);
    if(x>m.bx-ax-pad&&x<m.bx+ax+m.w+pad&&y>m.by-ay-pad&&y<m.by+ay+m.h+pad)return true;}
  return false;
}
function inInv(x,y){for(const z of invs)if(Math.hypot(x-z.x,y-z.y)<z.r)return true;return false;}
function nearHole(x,y,pad){for(const h of holes)if(Math.hypot(x-h.x,y-h.y)<h.r+pad)return true;return false;}
// расстояние от точки до щупальца: отрезок из (x,y) под углом a от r0 до r1
function armDist(px,py,x,y,a,r0,r1){
  const ux=Math.cos(a),uy=Math.sin(a),t=Math.max(r0,Math.min(r1,(px-x)*ux+(py-y)*uy));
  return Math.hypot(px-(x+ux*t),py-(y+uy*t));
}
function newRun(i){score=0;lives=maxLives();emp=1;startLevel(i);}
function nextLevel(){lives=Math.min(maxLives(),lives+D().heal);startLevel(lvl+1);}
// после гибели — все жизни («резервная копия»), при перезапуске из паузы — как было на старте уровня
function retryLevel(full){score=lvStart.score;emp=lvStart.emp;lives=full?maxLives():Math.min(maxLives(),lvStart.lives);startLevel(lvl);}

function msg(t,ms){
  msgEl.textContent=t;
  clearTimeout(msg._t);
  msg._t=setTimeout(()=>{if(msgEl.textContent===t)msgEl.textContent='';},ms||3500);
}
function burst(x,y,color,n=18,sp=3){
  n=Math.max(2,Math.round(n*Q.fx));
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,v=1+Math.random()*sp;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:30+Math.random()*15,color,sz:2+Math.random()*3});
  }
  const cap=Math.round(350*Q.fx);
  if(parts.length>cap)parts.splice(0,parts.length-cap);
}
function popup(x,y,str,color){
  texts.push({x,y,str,color,life:50});
}
function inGate(x,y,pad){
  for(const g of gates)if(x>g.x-pad&&x<g.x+g.w+pad&&y>g.y-pad&&y<g.y+g.h+pad)return true;
  return false;
}
// 0 — выключен, 1 — мигает (вот-вот загорится), 2 — горит и ранит; на лёгкой сложности горит меньше
function gateState(g){const c=(time+g.o)%300,lit=D().gate;return c<250-lit?0:(c<300-lit?1:2);}
function inLag(x,y){
  for(const z of lags)if(Math.hypot(x-z.x,y-z.y)<z.r)return true;
  return false;
}
function inTp(x,y,pad){
  for(const pr of tps)for(const q of pr)if(Math.hypot(x-q.x,y-q.y)<TP_R+pad)return true;
  return false;
}
// сканер жжёт 4 с из каждых 6, в начале цикла — отдых
function scanHot(){return scan&&time%360>=120;}
function inScan(x,y,r){
  for(let k=0;k<scan.arms;k++){
    const a=scan.a+k*TAU/scan.arms,ux=Math.cos(a),uy=Math.sin(a);
    const t=(x-scan.x)*ux+(y-scan.y)*uy;
    if(t<scan.gap||t>1000)continue;
    if(Math.abs((x-scan.x)*uy-(y-scan.y)*ux)<r)return true;
  }
  return false;
}
function inWall(x,y,pad){
  for(const w of solids)if(x>w.x-pad&&x<w.x+w.w+pad&&y>w.y-pad&&y<w.y+w.h+pad)return true;
  return false;
}
// выталкивает круг из стен и гасит скорость, направленную в стену
function pushOut(o,r){
  for(const w of solids){
    const cx=Math.max(w.x,Math.min(o.x,w.x+w.w)),cy=Math.max(w.y,Math.min(o.y,w.y+w.h));
    const dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
    if(d2>=r*r)continue;
    if(d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      o.x=cx+nx*r;o.y=cy+ny*r;
      const vn=o.vx*nx+o.vy*ny;
      if(vn<0){o.vx-=vn*nx;o.vy-=vn*ny;}
    }else{
      const l=o.x-w.x,rt=w.x+w.w-o.x,t=o.y-w.y,b=w.y+w.h-o.y,m=Math.min(l,rt,t,b);
      if(m===l){o.x=w.x-r;o.vx=Math.min(0,o.vx);}
      else if(m===rt){o.x=w.x+w.w+r;o.vx=Math.max(0,o.vx);}
      else if(m===t){o.y=w.y-r;o.vy=Math.min(0,o.vy);}
      else{o.y=w.y+w.h+r;o.vy=Math.max(0,o.vy);}
    }
  }
}
// зайдя на поле, враг остаётся в его границах: снайпер не стреляет из-за края экрана
function keepIn(e){
  if(!e.inside&&e.x>e.r&&e.x<W-e.r&&e.y>e.r&&e.y<H-e.r)e.inside=true;
  if(e.inside){
    if(e.x<e.r){e.x=e.r;e.vx=Math.abs(e.vx)*0.5;}else if(e.x>W-e.r){e.x=W-e.r;e.vx=-Math.abs(e.vx)*0.5;}
    if(e.y<e.r){e.y=e.r;e.vy=Math.abs(e.vy)*0.5;}else if(e.y>H-e.r){e.y=H-e.r;e.vy=-Math.abs(e.vy)*0.5;}
  }
  if(solids.length)pushOut(e,e.r);
}
// бонусы: подпись над появившимся предметом и цвет его значка
const PICK={emp:{label:'EMP',color:'#39c'},hp:{label:'АПТЕЧКА',color:'#e02444'},boost:{label:'РАЗГОН',color:'#fa0'}};
// бонус появляется в стороне: под игроком он подбирался бы в тот же кадр;
// одинаковых на поле не больше PICK_MAX — иначе нетронутые аптечки и заряды заваливали поле
const PICK_MAX={emp:3,hp:2,boost:1};
function dropPickup(type){
  let n=0;for(const q of pickups)if(q.type===type)n++;
  if(n>=PICK_MAX[type])return;
  const s=freeSpot(140,40,20);
  pickups.push({x:s.x,y:s.y,r:11,t:0,type});
  popup(s.x,s.y-18,PICK[type].label,PICK[type].color);
}
// случайная точка поля вне стен и не ближе minDist к игроку
function freeSpot(minDist,margin,pad){
  for(let i=0;i<80;i++){
    const x=margin+Math.random()*(W-margin*2),y=margin+Math.random()*(H-margin*2);
    if(inWall(x,y,pad)||inGate(x,y,pad)||inTp(x,y,pad)||inMoverZone(x,y,pad)||nearHole(x,y,pad+30))continue;
    if(i<50&&Math.hypot(x-player.x,y-player.y)<minDist)continue;
    return{x,y};
  }
  return{x:W/2,y:H/2};
}

function countType(t){let n=0;for(const e of enemies)if(e.type===t)n++;return n;}
// трояны стоят на месте и не считаются в лимит врагов уровня
function activeEnemies(){return enemies.length-countType('trojan')-countType('mine');}
function wormSeg(e,i){
  const n=e.hist.length/2,k=Math.max(0,n-1-i*WORM_GAP);
  return [e.hist[k*2],e.hist[k*2+1]];
}
// расстояние до врага; у червя — до ближайшего звена
function enemyDist(e,x,y){
  let d=Math.hypot(e.x-x,e.y-y);
  if(e.type==='worm')for(let i=1;i<=WORM_SEGS;i++){const s=wormSeg(e,i);d=Math.min(d,Math.hypot(s[0]-x,s[1]-y));}
  return d;
}
function edgePos(off){
  let p,tries=0;
  do{
    const side=Math.floor(Math.random()*4);
    if(side===0)p={x:-off,y:Math.random()*H};
    else if(side===1)p={x:W+off,y:Math.random()*H};
    else if(side===2)p={x:Math.random()*W,y:-off};
    else p={x:Math.random()*W,y:H+off};
  }while(++tries<12&&Math.hypot(p.x-player.x,p.y-player.y)<220);
  return p;
}
function spawnEnemy(type){
  const p=edgePos(30),c=LEVELS[lvl];
  const spd=D().speed;
  if(type==='sniper')enemies.push({...p,vx:0,vy:0,r:11,speed:1.3*spd,type,fireT:Math.round(90*D().fire),t:0});
  else if(type==='heavy')enemies.push({...p,vx:0,vy:0,r:19,speed:0.65*spd,type,hp:2,t:0,touchCd:0});
  else if(type==='glitch')enemies.push({...p,vx:0,vy:0,r:10,speed:0.6*spd,type,t:0,tp:90+Math.random()*60,warp:0,lunge:0,wx:0,wy:0});
  else if(type==='botnet'){
    // четыре мелких бота заходят на поле стайкой
    for(let k=0;k<4;k++)enemies.push({x:p.x+(k%2)*16-8,y:p.y+(k>>1)*16-8,vx:0,vy:0,r:7,speed:Math.min(2.2,1.6+lvl*0.02)*spd,type:'bot',t:0});
  }
  else if(type==='worm'){
    const hist=[];
    for(let i=0;i<WORM_HIST;i++)hist.push(p.x,p.y);
    enemies.push({...p,vx:0,vy:0,r:10,speed:Math.min(2.3,1.9+lvl*0.03)*spd,type,t:0,touchCd:0,ang:Math.atan2(player.y-p.y,player.x-p.x),hist});
  }
  // турель вырастает внутри поля: 2/3 секунды её видно, но она ещё не стреляет и не ранит
  else if(type==='turret'){
    const q=freeSpot(220,70,26);
    enemies.push({x:q.x,y:q.y,vx:0,vy:0,r:14,type,t:0,ang:Math.atan2(player.y-q.y,player.x-q.x),fireT:Math.round(120*D().fire),inside:true,touchCd:0,rise:40});
  }
  else if(type==='thief')enemies.push({...p,vx:0,vy:0,r:10,speed:2.3*spd,type,t:0,loot:0,flee:0});
  else if(type==='missile')enemies.push({...p,vx:0,vy:0,r:8,speed:0,type,t:0,ang:Math.atan2(player.y-p.y,player.x-p.x),life:420});
  else if(type==='mirror')enemies.push({...p,vx:0,vy:0,r:12,speed:2.6*spd,type,t:0});
  else if(type==='miner')enemies.push({...p,vx:0,vy:0,r:12,speed:0.8*spd,type,t:0,dropT:Math.round(160*D().fire),tx:W/2,ty:H/2});
  // у скорости охотника есть потолок, иначе к концу уровня он вдвое быстрее игрока
  else enemies.push({...p,vx:0,vy:0,r:11,speed:Math.min(c.fast?2.8:2.3,1.4+threat*0.22+Math.min(lvl,ACT1_END)*0.03+(c.fast?0.3:0))*spd,type:'chaser',t:0});
}
function spawnBoss(){
  const b=LEVELS[lvl].boss;
  // Капча выходит сразу под щитом — иначе первый EMP до её первого хода проходил бы насквозь
  const hp=Math.max(Math.min(D().bossMin,b.hp),b.hp-D().bossHp);
  boss={x:W/2,y:-70,r:b.r||42,t:0,hp,maxHp:hp,vx:0,vy:0,kind:b.kind,name:b.name,ang:0,shield:b.kind==='captcha'};
  lastEmpDrop=time-300;
  msg('⚠ БОСС: «'+b.name+'» ВЫШЕЛ НА УДАЛЕНИЕ — БЕРЕГИСЬ И БЕРЕГИ EMP ⚠');
}

let bossVolley=false,thinN=0;
function shoot(x,y,a,sp,r,life){
  if(bossVolley&&D().thin&&++thinN%D().thin===0)return;
  sp*=D().bullet;life=Math.round((life||220)/D().bullet);
  bullets.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:r||5,life:life||220});
}
function hitPlayer(){
  if(phase!=='game'||player.cool>0)return;
  burst(player.x,player.y,'#e33',20);
  lives--;shake=10;
  buzz(lives<=0?200:70);
  player.cool=D().cool;
  player.vx=(Math.random()-0.5)*14;
  player.vy=(Math.random()-0.5)*14;
  if(lives<=0){
    lives=0;
    save.best=Math.max(save.best,score);bankBits();persist();
    phase='dead';showMenu('dead');
  }
}
function levelClear(){
  save.best=Math.max(save.best,score);
  runBits+=clearBits(lvl);lvBits+=clearBits(lvl);bankBits();
  if(lvl>=LEVELS.length-1){
    save.unlocked=LEVELS.length;
    save.wins=(save.wins||0)+1;
    persist();
    phase='win';showMenu('win');
    return;
  }
  save.unlocked=Math.max(save.unlocked,lvl+2);persist();
  phase='clear';showMenu('clear');
}
// роутер: вошёл в кольцо — вышел из парного; снова сработает, только когда выйдешь из колец
function teleport(){
  if(player.tpCd>0){if(!inTp(player.x,player.y,0))player.tpCd--;return;}
  for(const pr of tps)for(let k=0;k<2;k++){
    const a=pr[k],b=pr[1-k];
    if(Math.hypot(player.x-a.x,player.y-a.y)>=TP_R)continue;
    burst(a.x,a.y,'#7a4fd6',12);
    player.x=b.x;player.y=b.y;player.tpCd=20;
    trail.length=0;
    burst(b.x,b.y,'#7a4fd6',12);buzz(20);
    return;
  }
}
// обломок летит через всё поле почти поперёк, с небольшим разбросом
function spawnDebris(){
  const side=Math.floor(Math.random()*4),sp=(1.3+Math.random()*0.7)*D().bullet,r=12+Math.random()*7;
  let x,y,a;
  if(side===0){x=-20;y=40+Math.random()*(H-80);a=0;}
  else if(side===1){x=W+20;y=40+Math.random()*(H-80);a=Math.PI;}
  else if(side===2){x=40+Math.random()*(W-80);y=-20;a=Math.PI/2;}
  else{x=40+Math.random()*(W-80);y=H+20;a=-Math.PI/2;}
  a+=(Math.random()-0.5)*0.6;
  bullets.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,life:900,rock:1,rot:Math.random()*TAU});
}
function moveDust(){
  for(let i=0;i<Q.dust&&i<dust.length;i++){
    const d=dust[i];
    d.x+=d.vx;d.y+=d.vy;
    if(d.x<0)d.x=W;if(d.x>W)d.x=0;
    if(d.y<0)d.y=H;if(d.y>H)d.y=0;
  }
}
// удаление элементов на месте, без нового массива каждый кадр
function compact(arr,keep){
  let j=0;
  for(let i=0;i<arr.length;i++){const v=arr[i];if(keep(v))arr[j++]=v;}
  arr.length=j;
}

// ================= ЛОГИКА =================
function step(){
  time++;if(shake>0)shake--;if(boost>0)boost--;if(intro>0)intro--;
  if(movers.length)moveMovers();
  const sk=colOf(wornLook().c,time),cfg=LEVELS[lvl];

  // движение: вектор нормализован, иначе по диагонали скорость была в 1.41 раза выше
  // в невесомости разгон слабее, а торможение дольше — скорость та же, но всё «скользит»
  const acc=(player.dashT>0?0.15:0.35)*(cfg.ice?0.42:1);
  const mult=boost>0?2:1;
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  let iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
  const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;}
  // в зоне инверсии управление наоборот
  if(invs.length&&inInv(player.x,player.y)){ix=-ix;iy=-iy;}
  player.vx+=ix*acc*mult;player.vy+=iy*acc*mult;
  const fr=(cfg.ice?0.975:0.94)*(lags.length&&inLag(player.x,player.y)?0.93:1);
  player.vx*=fr;player.vy*=fr;
  if(Math.hypot(player.vx,player.vy)>0.5)player.face=Math.atan2(player.vy,player.vx);

  // рывок — по нажатию SPACE (с буфером в 8 кадров), а не пока клавиша зажата
  if(player.dashCd>0)player.dashCd--;
  if(player.dashT>0)player.dashT--;
  if(pressed.dash>0){
    if(player.dashCd===0){
      pressed.dash=0;
      const d=Math.hypot(player.vx,player.vy);
      let dx,dy;
      if(d>0.5){dx=player.vx/d;dy=player.vy/d;}
      else{dx=Math.cos(player.face);dy=Math.sin(player.face);}
      player.vx=dx*16;player.vy=dy*16;
      player.dashT=14;player.dashCd=70;
      burst(player.x,player.y,sk.trail,12);
    }else pressed.dash--;
  }

  // подножка — как рывок, без предметов: охотники и снайперы рядом спотыкаются на 5 секунд
  if(player.tripCd>0)player.tripCd--;
  if(pressed.trip>0){
    if(player.tripCd===0){
      pressed.trip=0;
      player.tripCd=tripCdMax();
      tripFx={x:player.x,y:player.y,t:0};
      let n=0;
      for(const e of enemies){
        if(!TRIPPABLE[e.type])continue;
        const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy)||1;
        if(enemyDist(e,player.x,player.y)>TRIP_R+e.r)continue;
        e.trip=TRIP_STUN;e.tripRot=Math.random()*TAU;
        e.vx=e.type==='turret'?0:dx/d*3;e.vy=e.type==='turret'?0:dy/d*3;
        e.warp=0;e.lunge=0;
        n++;
      }
      burst(player.x,player.y,'#b7791f',14,3);
      buzz(25);
      msg(n?'ПОДНОЖКА! Споткнулись: '+n+' — беги!':'ПОДНОЖКА: рядом никого');
    }else pressed.trip--;
  }
  if(tripFx&&++tripFx.t>16)tripFx=null;

  // потоки трафика сносят в сторону
  for(const f of flows)if(player.y>f.y&&player.y<f.y+f.h)player.vx+=f.dir*0.12;
  // чёрные дыры тянут к себе: чем ближе, тем сильнее; бегом можно уйти, рывком — легко
  for(const h of holes){
    const hx=h.x-player.x,hy=h.y-player.y,hd=Math.hypot(hx,hy)||1;
    if(hd<h.R){const k=h.f*(1-hd/h.R)*(0.4+0.6*D().speed);player.vx+=hx/hd*k;player.vy+=hy/hd*k;}
  }

  player.x=Math.max(player.r,Math.min(W-player.r,player.x+player.vx));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y+player.vy));
  if(solids.length)pushOut(player,player.r);
  if(tps.length)teleport();
  if(player.cool>0)player.cool--;
  if(player.empCd>0)player.empCd--;

  // шлейф скорости (длина зависит от графики); во время рывка и разгона он ярче
  trail.push({x:player.x,y:player.y,life:Q.trail,hot:player.dashT>0?1:(boost>0?2:0)});
  // после смены графики старые точки живут дольше новых, поэтому чистим весь шлейф, а не только начало
  for(const t of trail)t.life--;
  compact(trail,t=>t.life>0);
  if(boost>0&&Q.fx>=0.6&&time%2===0&&Math.hypot(player.vx,player.vy)>1.5){
    parts.push({x:player.x-player.vx*2+(Math.random()-0.5)*10,y:player.y-player.vy*2+(Math.random()-0.5)*10,vx:-player.vx*0.15,vy:-player.vy*0.15,life:20,color:'#fa0',sz:2+Math.random()*2});
  }

  // EMP
  if(pressed.emp){
    pressed.emp=false;
    if(emp>0&&player.empCd===0){
      emp--;player.empCd=25;shake=12;
      buzz(30);
      burst(player.x,player.y,'#39c',26,4);
      let gained=0;
      enemies=enemies.filter(e=>{
        const d=enemyDist(e,player.x,player.y);
        if(d>=170)return true;
        // у щитоносца 2 hp: первый заряд снимает щит, второй добивает
        if(e.type==='heavy'&&e.hp>1){
          e.hp--;e.touchCd=50;
          e.vx=(e.x-player.x)/(d||1)*9;e.vy=(e.y-player.y)/(d||1)*9;
          burst(e.x,e.y,'#92b',16);
          popup(e.x,e.y,'ЩИТ −1','#92b');
          return true;
        }
        const pts=PTS[e.type]||1;
        burst(e.x,e.y,'#e33',16);
        popup(e.x,e.y,'+'+pts,'#0a5');
        gained+=pts;
        if(e.type==='thief'&&e.loot)returnLoot(e);
        return false;
      });
      bullets=[];
      if(boss&&bossDist(boss)<200&&boss.hid){
        msg('«'+boss.name+'» растворился — EMP его не видит. Жди, где он выйдет');
      }else if(boss&&bossDist(boss)<200&&boss.shield){
        popup(boss.x,boss.y-boss.r-26,'ЩИТ!','#39c');
        msg('Щит «'+boss.name+'» держит EMP — бей, когда он погаснет');
      }else if(boss&&bossDist(boss)<200){
        boss.hp--;
        burst(boss.x,boss.y,'#39c',24);
        shake=14;
        if(boss.hp<=0){
          const name=boss.name;
          buzz(120);
          burst(boss.x,boss.y,'#f80',40,5);
          popup(boss.x,boss.y,'+5','#f80');
          boss=null;
          spawnPortal();
          gained+=5;runBits+=BOSS_BITS;lvBits+=BOSS_BITS;
          popup(player.x,player.y-40,'+'+BOSS_BITS+' ◈','#b45309');
          const a=actOf(lvl);
          msg('«'+name+'» УНИЧТОЖЕН! '+(lvl===LEVELS.length-1?'ВЫХОД НА СВОБОДУ':(lvl===ACTS[a].end?'ПОРТАЛ: '+ACTS[a+1].name:'ПОРТАЛ'))+' ОТКРЫТ — ВХОДИ!');
        }else{
          msg(boss.name+' повреждён: осталось ядер — '+boss.hp);
        }
      }else{
        msg('EMP-ВЗРЫВ!');
      }
      score+=gained;
    }
  }

  moveDust();

  // враги
  for(const e of enemies){
    e.t=(e.t||0)+1;
    if(e.touchCd>0)e.touchCd--;
    // споткнувшийся враг немного проезжает по инерции и лежит: не гонится, не стреляет, не ест данные
    if(e.trip>0){
      e.trip--;
      e.vx*=0.85;e.vy*=0.85;
      e.x+=e.vx;e.y+=e.vy;
      keepIn(e);
      continue;
    }
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    // троян стоит на месте; подойдёшь ближе 70 — через ¾ секунды взрывается кольцом пуль
    if(e.type==='trojan'){
      if(e.arm>0){
        if(--e.arm===0){
          for(let k=0;k<8;k++)shoot(e.x,e.y,k/8*TAU+e.t*0.1,2.6,4,120);
          burst(e.x,e.y,'#e33',16);shake=Math.max(shake,6);
          e.dead=true;
        }
      }else if(d<70){e.arm=45;popup(e.x,e.y-16,'!','#c22');}
      continue;
    }
    // червь ползёт к игроку плавной дугой, звенья повторяют путь головы
    if(e.type==='worm'){
      let da=Math.atan2(dy,dx)-e.ang;
      while(da>Math.PI)da-=TAU;
      while(da<-Math.PI)da+=TAU;
      e.ang+=Math.max(-0.05,Math.min(0.05,da))+Math.sin(e.t*0.08)*0.03;
      const ws=lags.length&&inLag(e.x,e.y)?0.5:1;
      e.vx=Math.cos(e.ang)*e.speed*ws;e.vy=Math.sin(e.ang)*e.speed*ws;
      e.x+=e.vx;e.y+=e.vy;
      keepIn(e);
      if(Math.hypot(e.vx,e.vy)>0.1)e.ang=Math.atan2(e.vy,e.vx);
      e.hist.push(e.x,e.y);
      if(e.hist.length>WORM_HIST*2)e.hist.splice(0,2);
      continue;
    }
    // глитч дрейфует к игроку, а раз в 2–3 с телепортируется рядом и бросается
    if(e.type==='glitch'){
      if(e.warp>0){
        if(--e.warp===0){
          burst(e.x,e.y,'#c3f',10);
          e.x=e.wx;e.y=e.wy;e.inside=true;
          burst(e.x,e.y,'#c3f',10);
          const lx=player.x-e.x,ly=player.y-e.y,ld=Math.hypot(lx,ly)||1;
          e.vx=lx/ld*5.5*D().speed;e.vy=ly/ld*5.5*D().speed;e.lunge=18;
          e.tp=150+Math.random()*60;
        }
        continue;
      }
      if(e.lunge>0){
        e.lunge--;e.x+=e.vx;e.y+=e.vy;keepIn(e);
        if(e.lunge===0){e.vx*=0.3;e.vy*=0.3;}
        continue;
      }
      if(e.inside&&--e.tp<=0){
        const a=Math.random()*TAU,R=110+Math.random()*40;
        const wx=Math.max(30,Math.min(W-30,player.x+Math.cos(a)*R)),wy=Math.max(30,Math.min(H-30,player.y+Math.sin(a)*R));
        if(inWall(wx,wy,14)||Math.hypot(wx-player.x,wy-player.y)<80)e.tp=10;
        else{e.wx=wx;e.wy=wy;e.warp=40;}
      }
    }
    // турель стоит на месте, доворачивает ствол и бьёт очередью из трёх пуль
    if(e.type==='turret'){
      if(e.rise>0){e.rise--;continue;}
      let da=Math.atan2(dy,dx)-e.ang;
      while(da>Math.PI)da-=TAU;
      while(da<-Math.PI)da+=TAU;
      e.ang+=Math.max(-0.03,Math.min(0.03,da));
      if(--e.fireT<=0&&d<420){
        e.fireT=Math.round(130*D().fire);
        for(let i=-1;i<=1;i++)shoot(e.x+Math.cos(e.ang)*16,e.y+Math.sin(e.ang)*16,e.ang+i*0.12,3.2,4,200);
      }
      continue;
    }
    // вор подбирается, крадёт данные и 4 секунды удирает
    if(e.type==='thief'){
      const away=e.flee>0;
      if(away)e.flee--;
      const sv=e.speed*(away?1.15:1),sx=(away?-dx:dx)/d,sy=(away?-dy:dy)/d;
      e.vx+=(sx*sv-e.vx)*0.08;e.vy+=(sy*sv-e.vy)*0.08;
      e.x+=e.vx;e.y+=e.vy;keepIn(e);
      continue;
    }
    // ракета летит к игроку, но поворачивает медленно; через 7 секунд выгорает, об стену — взрывается
    if(e.type==='missile'){
      let da=Math.atan2(dy,dx)-e.ang;
      while(da>Math.PI)da-=TAU;
      while(da<-Math.PI)da+=TAU;
      e.ang+=Math.max(-0.035,Math.min(0.035,da));
      e.speed=Math.min(4*D().speed,e.speed+0.05);
      e.vx=Math.cos(e.ang)*e.speed;e.vy=Math.sin(e.ang)*e.speed;
      e.x+=e.vx;e.y+=e.vy;
      if(--e.life<=0||(solids.length&&inWall(e.x,e.y,e.r-2))||e.x<-60||e.x>W+60||e.y<-60||e.y>H+60){burst(e.x,e.y,'#f97316',12);e.dead=true;}
      continue;
    }
    // зеркало держится там, где отражение игрока относительно центра поля
    if(e.type==='mirror'){
      const ox=W-player.x-e.x,oy=H-player.y-e.y,od=Math.hypot(ox,oy)||1,v=Math.min(e.speed,od*0.08);
      e.vx+=(ox/od*v-e.vx)*0.15;e.vy+=(oy/od*v-e.vy)*0.15;
      e.x+=e.vx;e.y+=e.vy;keepIn(e);
      continue;
    }
    // минёр бродит по полю и оставляет мины; мина взводится за секунду и живёт ~18 секунд
    if(e.type==='miner'){
      if(Math.hypot(e.tx-e.x,e.ty-e.y)<20||e.t%240===0){const q=freeSpot(100,60,20);e.tx=q.x;e.ty=q.y;}
      const ox=e.tx-e.x,oy=e.ty-e.y,od=Math.hypot(ox,oy)||1;
      e.vx+=(ox/od*e.speed-e.vx)*0.05;e.vy+=(oy/od*e.speed-e.vy)*0.05;
      e.x+=e.vx;e.y+=e.vy;keepIn(e);
      if(--e.dropT<=0){
        e.dropT=Math.round(170*D().fire);
        if(e.inside&&countType('mine')<6)enemies.push({x:e.x,y:e.y,vx:0,vy:0,r:8,type:'mine',t:0,arm:60,life:1100,inside:true});
      }
      continue;
    }
    if(e.type==='mine'){
      if(e.arm>0)e.arm--;
      if(--e.life<=0)e.dead=true;
      continue;
    }
    let mx=dx/d,my=dy/d;
    if(e.type==='sniper'){
      if(d<170){mx=-mx;my=-my;}
      e.fireT--;
      if(e.fireT<=0&&d<400){
        e.fireT=Math.round(Math.max(60,110-threat*4-lvl*2)*D().fire);
        bullets.push({x:e.x,y:e.y,vx:dx/d*4*D().bullet,vy:dy/d*4*D().bullet,r:4,life:Math.round(170/D().bullet)});
      }
    }
    const k=e.type==='heavy'?0.03:0.08;
    e.vx+=mx*k*e.speed*2;e.vy+=my*k*e.speed*2;
    e.vx*=0.96;e.vy*=0.96;
    for(const f of flows)if(e.y>f.y&&e.y<f.y+f.h)e.vx+=f.dir*0.05;
    for(const h of holes){const hx=h.x-e.x,hy=h.y-e.y,hd=Math.hypot(hx,hy)||1;if(hd<h.R){const k=h.f*0.5*(1-hd/h.R);e.vx+=hx/hd*k;e.vy+=hy/hd*k;}}
    if(lags.length&&inLag(e.x,e.y)){e.vx*=0.93;e.vy*=0.93;}
    e.x+=e.vx;e.y+=e.vy;
    keepIn(e);
    // боты расталкивают друг друга, чтобы стайка не слипалась в одну точку
    if(e.type==='bot')for(const o of enemies){
      if(o===e||o.type!=='bot')continue;
      const sx=e.x-o.x,sy=e.y-o.y,s2=sx*sx+sy*sy;
      if(s2<196&&s2>0.01){const s=Math.sqrt(s2);e.x+=sx/s*0.6;e.y+=sy/s*0.6;}
    }
    if(e.type==='chaser'){
      for(let i=data.length-1;i>=0;i--){
        const dt=data[i];
        if(Math.hypot(dt.x-e.x,dt.y-e.y)<e.r+dt.r){
          burst(dt.x,dt.y,'#f80');
          data.splice(i,1);spawnData();
          if(activeEnemies()<capOf(cfg)&&Math.random()<D().breed){
            enemies.push({x:e.x,y:e.y,vx:-e.vx*1.5,vy:-e.vy*1.5,r:9,speed:e.speed,type:'chaser',t:0});
          }
        }
      }
    }
  }
  if(enemies.some(e=>e.dead))enemies=enemies.filter(e=>!e.dead);

  // касание врагов
  if(player.cool===0&&!player.dashT){
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      // споткнувшегося вора можно поймать — он отдаст украденное
      if(e.trip>0){
        if(e.type==='thief'&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
          burst(e.x,e.y,'#7c3aed',16);popup(e.x,e.y-14,'ПОЙМАН!','#7c3aed');
          if(e.loot)returnLoot(e);
          score+=PTS.thief;enemies.splice(i,1);
        }
        continue;
      }
      // мина взрывается, только когда взведена; рывок проскакивает
      if(e.type==='mine'){
        if(!e.arm&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
          burst(e.x,e.y,'#ef4444',22,4);shake=Math.max(shake,8);
          enemies.splice(i,1);hitPlayer();break;
        }
        continue;
      }
      if(e.type==='turret'&&e.rise>0)continue;
      // вор не ранит: крадёт до трёх данных и убегает
      if(e.type==='thief'){
        if(e.flee<=0&&!portal&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
          const n=Math.min(3,got);
          got-=n;score=Math.max(0,score-n);e.loot+=n;e.flee=240;
          burst(e.x,e.y,'#7c3aed',12);popup(e.x,e.y-14,n?'−'+n+' ◆':'мимо','#7c3aed');
          msg(n?'ВОР УТАЩИЛ '+n+' ДАННЫХ — сбей его подножкой или EMP и забери обратно':'Вор промахнулся — у тебя ещё нечего красть');
        }
        continue;
      }
      // наступил на троян — взрыв в следующем кадре
      if(e.type==='trojan'){
        if(!e.arm&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r)e.arm=1;
        continue;
      }
      // червь ранит любым звеном и после этого полсекунды не кусает
      if(e.type==='worm'){
        if(e.touchCd<=0&&enemyDist(e,player.x,player.y)<player.r+8){e.touchCd=50;hitPlayer();break;}
        continue;
      }
      if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
        if(e.type==='heavy'||e.type==='turret'){
          if(e.touchCd<=0){
            e.touchCd=50;
            if(e.type==='heavy'){
              const d=Math.hypot(e.x-player.x,e.y-player.y)||1;
              e.vx=(e.x-player.x)/d*9;e.vy=(e.y-player.y)/d*9;
            }
            hitPlayer();
          }
        }else if(e.type==='glitch'||e.type==='bot'||e.type==='missile'||e.type==='mirror'||e.type==='miner'){
          burst(e.x,e.y,e.type==='bot'?'#e8742a':'#c3f');
          enemies.splice(i,1);
          hitPlayer();
        }else{
          burst(e.x,e.y,'#e33');
          enemies.splice(i,1);
          spawnEnemy(Math.random()<0.3?'sniper':'chaser');
          hitPlayer();
        }
        break;
      }
    }
  }
  // после смерти кадр дальше не считается — иначе можно было «выиграть», уже погибнув
  if(phase!=='game')return;

  // барьеры файрвола ранят, пока горят; рывок проскакивает
  if(gates.length&&player.cool===0&&!player.dashT){
    for(const g of gates){
      if(gateState(g)!==2)continue;
      const cx=Math.max(g.x,Math.min(player.x,g.x+g.w)),cy=Math.max(g.y,Math.min(player.y,g.y+g.h));
      if(Math.hypot(player.x-cx,player.y-cy)<player.r-2){hitPlayer();break;}
    }
    if(phase!=='game')return;
  }

  // сканер крутится всегда, а ранит, пока луч сплошной; рывок проскакивает
  if(scan){
    scan.a+=scan.v*D().speed;
    if(scanHot()&&intro===0&&player.cool===0&&!player.dashT&&inScan(player.x,player.y,player.r+3)){
      hitPlayer();
      if(phase==='game')msg('Луч сканера! Перепрыгивай его рывком');
    }
    if(phase!=='game')return;
  }
  if(cfg.debris&&intro===0&&!portal&&--debrisT<=0){debrisT=Math.round(cfg.debris*D().hazard);spawnDebris();}

  // ядро чёрной дыры ранит и отбрасывает наружу
  if(holes.length&&player.cool===0&&!player.dashT){
    for(const h of holes){
      const hx=player.x-h.x,hy=player.y-h.y,hd=Math.hypot(hx,hy)||1;
      if(hd<h.r+player.r-4){
        hitPlayer();
        player.vx=hx/hd*9;player.vy=hy/hd*9;
        if(phase==='game')msg('Ядро чёрной дыры! Держись подальше — рывок вытаскивает');
        break;
      }
    }
    if(phase!=='game')return;
  }
  // удары с орбиты: метка рядом с игроком, через секунду с небольшим — взрыв; он задевает и врагов
  if(cfg.strike&&intro===0&&!portal&&--strikeT<=0){
    strikeT=Math.round(cfg.strike*D().hazard);
    const a=Math.random()*TAU,o=Math.random()*70;
    strikes.push({x:Math.max(40,Math.min(W-40,player.x+Math.cos(a)*o)),y:Math.max(40,Math.min(H-40,player.y+Math.sin(a)*o)),t:Math.round(STRIKE_T/D().speed),T:Math.round(STRIKE_T/D().speed)});
  }
  if(strikes.length){
    for(const st of strikes){
      if(--st.t>0)continue;
      burst(st.x,st.y,'#f97316',22,4);shake=Math.max(shake,8);
      if(player.cool===0&&!player.dashT&&Math.hypot(player.x-st.x,player.y-st.y)<STRIKE_R+player.r-4)hitPlayer();
      for(const e of enemies){
        if(e.dead||enemyDist(e,st.x,st.y)>=STRIKE_R+e.r)continue;
        if(e.type==='heavy'&&e.hp>1){e.hp--;continue;}
        e.dead=true;burst(e.x,e.y,'#e33',10);
        if(e.type==='thief'&&e.loot)returnLoot(e);
      }
    }
    compact(strikes,st=>st.t>0);
    if(enemies.some(e=>e.dead))enemies=enemies.filter(e=>!e.dead);
    if(phase!=='game')return;
  }

  // очистка по таймеру
  if(cfg.timer&&!portal&&!boss){
    if(purge>0)purge--;
    else if(player.cool===0){
      hitPlayer();
      purge=timerOf(cfg)*60;
      burst(player.x,player.y,'#e33',30,5);
      if(phase==='game')msg('ОЧИСТКА '+cfg.name+'! Минус жизнь, таймер запущен заново');
    }
    if(phase!=='game')return;
  }

  // спам-пули с краёв поля
  if(cfg.storm&&intro===0&&!portal&&--stormT<=0){
    stormT=Math.round(cfg.storm*D().hazard);
    const p=edgePos(10);
    shoot(p.x,p.y,Math.atan2(player.y-p.y,player.x-p.x)+(Math.random()-0.5)*0.7,2.6,4,320);
  }

  // босс
  if(boss){
    // на лёгкой и средней сложности босс пропускает часть кадров: ходит и стреляет реже
    boss.slow=(boss.slow||0)+D().boss;
    if(boss.slow>=1){boss.slow-=1;bossAct(boss);}
    const dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;
    // Архиватор во время сжатия тянет игрока к себе; бегом можно вырваться, рывком — легко
    if(boss.pull&&d<450){player.vx-=dx/d*0.16*D().boss;player.vy-=dy/d*0.16*D().boss;}
    // рывок защищает и от босса, как от всех остальных
    if(!boss.hid&&Math.hypot(player.x-boss.x,player.y-boss.y)<player.r+boss.r*0.6&&player.cool===0&&!player.dashT)hitPlayer();
    // щупальца Кракена (и Сингулярности в его фазе) ранят по всей длине
    if(boss.arms&&player.cool===0&&!player.dashT){
      for(let k=0;k<3;k++)if(armDist(player.x,player.y,boss.x,boss.y,boss.ang+k*TAU/3,boss.r*0.6,boss.r+KRAKEN_ARM)<player.r+5){hitPlayer();break;}
    }
    // у Балансировщика ранят и сферы
    if(boss.kind==='balance'&&player.cool===0&&!player.dashT){
      const pts=bossPoints(boss);
      for(let i=1;i<pts.length;i++)if(Math.hypot(player.x-pts[i][0],player.y-pts[i][1])<player.r+16){hitPlayer();break;}
    }
    if(phase!=='game')return;
    // в бою с боссом заряд EMP появляется на поле не реже раза в 7 секунд
    if(time-lastEmpDrop>Math.round(420*D().boss)&&!pickups.some(p=>p.type==='emp')){
      lastEmpDrop=time;
      dropPickup('emp');
    }
  }

  // пули
  compact(bullets,b=>{
    // пули Поисковика первые 1,5 с доворачивают к игроку
    if(b.home>0){
      b.home--;
      const sp=Math.hypot(b.vx,b.vy);
      let da=Math.atan2(player.y-b.y,player.x-b.x)-Math.atan2(b.vy,b.vx);
      while(da>Math.PI)da-=TAU;
      while(da<-Math.PI)da+=TAU;
      const na=Math.atan2(b.vy,b.vx)+Math.max(-0.03,Math.min(0.03,da));
      b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
    }
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.rock)b.rot+=0.02;
    if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+b.r&&player.cool===0&&!player.dashT){
      hitPlayer();
      return false;
    }
    if(solids.length&&inWall(b.x,b.y,b.r-1))return false;
    const m=b.rock?40:20;
    return b.life>0&&b.x>-m&&b.x<W+m&&b.y>-m&&b.y<H+m;
  });
  if(phase!=='game')return;

  // данные
  for(let i=data.length-1;i>=0;i--){
    const dt=data[i];dt.t++;
    if(Math.hypot(dt.x-player.x,dt.y-player.y)<player.r+dt.r+5){
      burst(dt.x,dt.y,'#0a5',12);
      popup(dt.x,dt.y,'+1','#0a5');
      data.splice(i,1);spawnData();
      score++;got++;runBits++;lvBits++;
      // бонусы по расписанию: каждые 5 данных — EMP, аптечка — каждые 6–10 (по сложности), каждые 12 — разгон
      if(!portal){
        if(got%5===0)dropPickup('emp');
        if(got%D().hp===0)dropPickup('hp');
        if(got%12===0)dropPickup('boost');
      }
      if(got%D().ramp===0&&!portal){
        threat++;
        const type=cfg.ramp[(threat-2)%cfg.ramp.length];
        if(activeEnemies()<capOf(cfg)){spawnEnemy(type);msg('УГРОЗА '+threat+': '+RAMP_MSG[type]);}
      }
      checkGoal();
    }
  }

  // усилители
  compact(pickups,p=>{
    p.t++;
    if(Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r+4){
      // при полном здоровье аптечка остаётся лежать, пока не понадобится
      if(p.type==='hp'){
        if(lives>=maxLives())return true;
        lives++;
        burst(p.x,p.y,'#e33',14);popup(p.x,p.y,'+♥','#e02444');msg('АПТЕЧКА: +1 жизнь');buzz(40);
        return false;
      }
      burst(p.x,p.y,'#fa0',14);
      if(p.type==='emp'){emp++;popup(p.x,p.y,'EMP +1','#39c');msg('EMP-ЗАРЯД (Q)');}
      else{boost=240;popup(p.x,p.y,'РАЗГОН!','#fa0');msg('РАЗГОН: скорость x2!');}
      return false;
    }
    return true;
  });

  // портал — следующий уровень
  if(portal){
    portal.t++;
    if(Math.hypot(portal.x-player.x,portal.y-player.y)<portal.r+player.r){levelClear();return;}
  }

  compact(parts,p=>{
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life--;
    return p.life>0;
  });
  compact(texts,t=>{t.y-=0.7;t.life--;return t.life>0;});
}

// данные собраны — босс или портал
function checkGoal(){
  const c=LEVELS[lvl];
  if(got>=goalOf(c)&&!boss&&!portal){
    if(c.boss)spawnBoss();
    else{spawnPortal();msg('ДАННЫЕ СОБРАНЫ — ПОРТАЛ ОТКРЫТ, ВХОДИ!');}
  }
}
// пойманный или сбитый вор возвращает украденное
function returnLoot(e){
  got+=e.loot;score+=e.loot;
  popup(e.x,e.y-28,'+'+e.loot+' ◆ ВОЗВРАЩЕНО','#0a5');
  e.loot=0;
  checkGoal();
}
// ход босса: движение и стрельба
function bossAct(b){
  b.t++;
  const dx=player.x-b.x,dy=player.y-b.y,d=Math.hypot(dx,dy)||1;
  if(b.kind==='charge')bossCharge(b);
  else if(b.kind==='orbit')bossOrbit(b);
  else if(b.kind==='cloak'&&b.hid){b.vx=0;b.vy=0;}
  // Двойник держится зеркально игроку относительно центра поля
  else if(b.kind==='twin'){b.vx=(W-player.x-b.x)*0.04;b.vy=(H-player.y-b.y)*0.04;b.x+=b.vx;b.y+=b.vy;}
  // Светофор на жёлтом и красном стоит на месте
  else if(b.kind==='traffic'&&b.t%360>=120){b.vx*=0.85;b.vy*=0.85;b.x+=b.vx;b.y+=b.vy;}
  else{
    const ba=b.kind==='final'||b.kind==='admin'||b.kind==='omega'?0.055:(b.kind==='pack'||b.kind==='captcha'||b.kind==='balance'?0.035:0.045);
    b.vx+=(dx/d)*ba;b.vy+=(dy/d)*ba;
    b.vx*=0.97;b.vy*=0.97;
    b.x+=b.vx;b.y+=b.vy;
  }
  bossVolley=true;bossFire(b,Math.atan2(dy,dx));bossVolley=false;
}
// точки, по которым считаются касание и попадание EMP: ядро и, у Балансировщика, две сферы
function bossPoints(b){
  if(b.kind!=='balance')return [[b.x,b.y]];
  const cx=Math.cos(b.ang)*75,cy=Math.sin(b.ang)*75;
  return [[b.x,b.y],[b.x+cx,b.y+cy],[b.x-cx,b.y-cy]];
}
function bossDist(b){
  let d=1e9;
  for(const p of bossPoints(b))d=Math.min(d,Math.hypot(p[0]-player.x,p[1]-player.y));
  return d;
}

function bossFire(b,aim){
  const lost=b.maxHp-b.hp;
  let kind=b.kind;
  b.pull=false;b.shield=false;b.arms=false;b.charge=0;b.light=-1;
  // у Сингулярности атаки меняются каждые 5 с, поэтому циклы её фаз считаются от начала фазы
  const lt=b.kind==='singularity'?b.t%300:b.t;
  if(kind==='singularity'){
    kind=['ring','spiral','kraken','nova','aimed','traffic'][Math.floor(b.t/300)%6];
    if(b.t%540===270&&activeEnemies()<capOf(LEVELS[lvl]))spawnEnemy(['missile','mirror','thief','miner'][Math.floor(b.t/540)%4]);
  }
  if(kind==='traffic'){
    // Светофор: 2 с зелёный (едет к тебе, EMP его берёт), 1 с жёлтый, 3 с красный — щит и потоки пуль крестом
    const c=lt%360;
    b.light=c<120?2:(c<180?1:0);
    b.shield=c>=120;
    if(c===0)popup(b.x,b.y-b.r-34,'ЗЕЛЁНЫЙ — БЕЙ!','#16a34a');
    if(c===120)popup(b.x,b.y-b.r-34,'ЖЁЛТЫЙ!','#d97706');
    if(c>=180&&b.t%9===0){const r0=(c-180)*0.012;for(let i=0;i<4;i++)shoot(b.x,b.y,r0+i*TAU/4,2.6,4);}
    return;
  }
  if(kind==='kraken'){
    // Кракен: три щупальца крутятся вокруг (ранят, рывок проскакивает), кляксы — медленные крупные пули
    b.arms=true;b.ang+=0.018+lost*0.003;
    if(b.t%110===0)for(let i=-1;i<=1;i++)shoot(b.x,b.y,aim+i*0.35,1.6,9,320);
    return;
  }
  if(kind==='nova'){
    // Сверхновая: 4 с копит заряд и тянет к себе, потом три волны колец с просветами
    const c=lt%420;
    b.charge=c<240?c/240:0;
    b.pull=c>=60&&c<240;
    if(c===200)popup(b.x,b.y-b.r-34,'СЕЙЧАС ВЗОРВЁТСЯ!','#dc2626');
    if(c===240||c===258||c===276){
      const n=18+lost*2,gap=Math.random()*TAU;
      for(let i=0;i<n;i++){const a=i/n*TAU;if(Math.abs(Math.sin((a-gap)*1.5))<0.3)continue;shoot(b.x,b.y,a,2.3,5);}
    }
    if(c>300&&b.t%60===0)for(let i=-1;i<=1;i++)shoot(b.x,b.y,aim+i*0.2,2.8,4);
    return;
  }
  if(kind==='twin'){
    // Двойник: очереди в тебя и кольцо раз в 4 с
    if(b.t%75===0)for(let i=-2;i<=2;i++)shoot(b.x,b.y,aim+i*0.16,3,4);
    if(b.t%240===120){const n=12+lost;for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*TAU,2.2);}
    return;
  }
  if(kind==='seeker'){
    // Поисковик: пары самонаводящихся пуль и время от времени кольцо
    if(b.t%80===0)for(const o of [-0.6,0.6])bullets.push({x:b.x,y:b.y,vx:Math.cos(aim+o)*2.3*D().bullet,vy:Math.sin(aim+o)*2.3*D().bullet,r:5,life:260,home:90});
    if(b.t%260===130){const n=10+lost;for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*TAU,2.1);}
    return;
  }
  if(kind==='orbit'){
    // Перехватчик: тройные очереди в игрока и обломки
    if(b.t%70===0)for(let i=-1;i<=1;i++)shoot(b.x,b.y,aim+i*0.15,3,4);
    if(b.t%200===100){const sp=1.5*D().bullet;bullets.push({x:b.x,y:b.y,vx:Math.cos(aim)*sp,vy:Math.sin(aim)*sp,r:15,life:600,rock:1,rot:0});}
    return;
  }
  if(kind==='cloak'){bossCloak(b,aim);return;}
  if(kind==='omega'){
    // Главный алгоритм: по 5 с каждой атаки прежних боссов, под конец — щит; зовёт ботнет и глитчей
    kind=['ring','spiral','aimed','pack','captcha'][Math.floor(b.t/300)%5];
    if(b.t%600===300&&activeEnemies()<capOf(LEVELS[lvl]))spawnEnemy(b.t%1200===300?'botnet':'glitch');
  }
  if(kind==='admin'){
    // Админ облака перебирает атаки по 5 с и время от времени зовёт ботнет
    kind=['ring','spiral','aimed','pack'][Math.floor(b.t/300)%4];
    if(b.t%720===0&&activeEnemies()<capOf(LEVELS[lvl]))spawnEnemy('botnet');
  }
  if(kind==='final'){
    kind=['ring','spiral','aimed'][Math.floor(b.t/300)%3];
    if(b.t%600===0&&activeEnemies()<capOf(LEVELS[lvl]))enemies.push({x:b.x,y:b.y,vx:0,vy:0,r:9,speed:2*D().speed,type:'chaser',t:0,inside:true});
  }
  if(kind==='ring'){
    if(b.t%(b.kind==='final'?40:50)===0){
      const n=6+lost*2;
      for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*TAU+b.t*0.01,2.4);
    }
  }else if(kind==='aimed'){
    if(b.t%64===0)for(let i=-2;i<=2;i++)shoot(b.x,b.y,aim+i*0.18,3.2,4);
    if(b.t%160===80)for(let i=0;i<8;i++)shoot(b.x,b.y,i/8*TAU,2.2);
  }else if(kind==='spiral'&&b.t%5===0){
    b.ang+=0.27+lost*0.03;
    shoot(b.x,b.y,b.ang,2.3,4);
    if(b.kind==='final')shoot(b.x,b.y,b.ang+Math.PI,2.3,4);
  }else if(kind==='pack'){
    // цикл 4 с: 2,5 с обстрела веером, затем 1,5 с сжатия
    const c=b.t%240;
    b.pull=c>=150;
    if(c===150)popup(b.x,b.y-b.r-34,'СЖАТИЕ!','#b5651d');
    if(!b.pull&&b.t%70===0)for(let i=-1;i<=1;i++)shoot(b.x,b.y,aim+i*0.3,2.4);
  }else if(kind==='balance'){
    // две сферы кружат вокруг ядра, по очереди стреляют в игрока и иногда дают кольцо
    b.ang+=0.025+lost*0.004;
    const pts=bossPoints(b);
    if(b.t%50===0){const o=pts[1+(b.t/50)%2];shoot(o[0],o[1],Math.atan2(player.y-o[1],player.x-o[0]),3);}
    if(b.t%200===100)for(let k=1;k<3;k++)for(let i=0;i<6;i++)shoot(pts[k][0],pts[k][1],i/6*TAU,2.2);
  }else if(kind==='captcha'){
    // цикл 5,5 с: 3,3 с под щитом (стреляет крестами), 2,2 с без щита (уязвима и молчит)
    const c=b.t%330;
    b.shield=c<200;
    if(c===200)popup(b.x,b.y-b.r-34,'ЩИТ СНЯТ — БЕЙ!','#39c');
    if(b.shield&&b.t%60===0){
      const r0=(b.t/60)%2?Math.PI/8:0;
      for(let i=0;i<8;i++)shoot(b.x,b.y,r0+i/8*TAU,2.6,4);
    }
  }
}

// Перехватчик облетает поле по эллипсу и понемногу ускоряется
function bossOrbit(b){
  const lost=b.maxHp-b.hp;
  b.oa=(b.oa||-Math.PI/2)+0.006+lost*0.0012;
  const tx=W/2+Math.cos(b.oa)*290,ty=H/2+Math.sin(b.oa)*170;
  b.vx=(tx-b.x)*0.05;b.vy=(ty-b.y)*0.05;
  b.x+=b.vx;b.y+=b.vy;
}
// Страж: 3,3 с охотится и стреляет, затем растворяется и через 2 с выходит рядом с игроком с кольцом пуль
function bossCloak(b,aim){
  const c=b.t%360;
  b.hid=c>=200&&c<320;
  if(c===200)popup(b.x,b.y-b.r-34,'ИСЧЕЗ…','#334155');
  if(c===260){
    const a=Math.random()*TAU;
    b.wx=Math.max(60,Math.min(W-60,player.x+Math.cos(a)*170));
    b.wy=Math.max(60,Math.min(H-60,player.y+Math.sin(a)*170));
  }
  if(c===320){
    b.x=b.wx;b.y=b.wy;b.vx=0;b.vy=0;
    const n=12+(b.maxHp-b.hp)*2;
    for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*TAU,2.2);
    shake=Math.max(shake,6);
  }
  if(!b.hid&&c<200&&b.t%70===0)for(let i=-1;i<=1;i++)shoot(b.x,b.y,aim+i*0.22,2.8,4);
}
// Дефрагментатор: заходит на поле, секунду целится (красная линия), таранит до края и отдыхает
function bossCharge(b){
  const lost=b.maxHp-b.hp;
  if(!b.mode)b.mode='enter';
  if(b.mode==='enter'){
    b.y+=2;
    if(b.y>=b.r+20){b.mode='aim';b.mt=60;b.tx=player.x;b.ty=player.y;}
  }else if(b.mode==='aim'){
    b.tx+=(player.x-b.tx)*0.08;b.ty+=(player.y-b.ty)*0.08;
    if(--b.mt<=0){
      const a=Math.atan2(b.ty-b.y,b.tx-b.x);
      b.cvx=Math.cos(a)*9;b.cvy=Math.sin(a)*9;
      b.mode='dash';b.mt=0;
    }
  }else if(b.mode==='dash'){
    b.x+=b.cvx;b.y+=b.cvy;b.mt++;
    if(b.mt%5===0){
      const pa=Math.atan2(b.cvy,b.cvx)+Math.PI/2;
      shoot(b.x,b.y,pa,1.1,4,200);shoot(b.x,b.y,pa+Math.PI,1.1,4,200);
    }
    if(b.x<b.r||b.x>W-b.r||b.y<b.r||b.y>H-b.r||b.mt>120){
      b.x=Math.max(b.r,Math.min(W-b.r,b.x));b.y=Math.max(b.r,Math.min(H-b.r,b.y));
      b.mode='rest';b.mt=70;shake=Math.max(shake,8);
      const n=8+lost*2;
      for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*TAU,2.2);
    }
  }else if(b.mode==='rest'){
    if(--b.mt<=0){b.mode='aim';b.mt=Math.max(35,60-lost*8);b.tx=player.x;b.ty=player.y;}
  }
}

// ================= СПРАЙТЫ =================
// всё, что рисовалось градиентами и shadowBlur каждый кадр, заранее рисуется в маленькие холсты:
// shadowBlur на телефонах был главной причиной тормозов
const SPR=3;
function makeSprite(size,draw){
  const c=document.createElement('canvas');
  c.width=c.height=Math.ceil(size*SPR);
  const g=c.getContext('2d');
  g.scale(SPR,SPR);g.translate(size/2,size/2);
  draw(g);
  c.size=size;
  return c;
}
function drawSprite(s,x,y,rot,sc){
  const z=s.size*(sc||1);
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.drawImage(s,-z/2,-z/2,z,z);
  ctx.restore();
}
function rgba(hex,a){
  const h=hex.slice(1),f=h.length===3?h.split('').map(x=>x+x):h.match(/../g);
  return 'rgba('+f.map(x=>parseInt(x,16)).join(',')+','+a+')';
}
function polyPath(c,n,r,rot){
  c.beginPath();
  for(let i=0;i<n;i++){
    const a=i/n*TAU+rot;
    c[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);
  }
  c.closePath();
}

function starPath(c,n,ro,ri,rot){
  c.beginPath();
  for(let i=0;i<n*2;i++){const a=i/(n*2)*TAU+rot,r=i%2?ri:ro;c[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);}
  c.closePath();
}
function gearPath(c,n,ro,ri,rot){
  c.beginPath();
  for(let i=0;i<n;i++){
    const a=i/n*TAU+rot,w=TAU/n;
    for(const q of [[-0.25,ri],[-0.15,ro],[0.15,ro],[0.25,ri]])c[i||q[0]>-0.2?'lineTo':'moveTo'](Math.cos(a+q[0]*w)*q[1],Math.sin(a+q[0]*w)*q[1]);
  }
  c.closePath();
}
function shapePath(c,s,rr,rot){
  if(s===1){c.beginPath();c.arc(0,0,rr,0,TAU);}
  else if(s===2)polyPath(c,4,rr+2,rot+Math.PI/4);
  else if(s===3)polyPath(c,3,rr+4,rot-Math.PI/2);
  else if(s===4){c.beginPath();c.rect(-rr*0.9,-rr*0.9,rr*1.8,rr*1.8);}
  else if(s===5)starPath(c,5,rr+5,rr*0.6,rot-Math.PI/2);
  else if(s===6)gearPath(c,8,rr+3,rr-1,rot);
  else if(s===7){c.beginPath();c.moveTo(0,-rr-6);c.lineTo(rr*0.8,-rr*0.3);c.lineTo(rr*0.8,rr*0.4);c.lineTo(0,rr+6);c.lineTo(-rr*0.8,rr*0.4);c.lineTo(-rr*0.8,-rr*0.3);c.closePath();}
  else if(s===8){const k=rr/13;c.beginPath();c.moveTo(0,14*k);c.bezierCurveTo(-22*k,0,-13*k,-19*k,0,-8*k);c.bezierCurveTo(13*k,-19*k,22*k,0,0,14*k);c.closePath();}
  else if(s===9){
    // щит: плоский верх, острый низ
    c.beginPath();c.moveTo(-rr,-rr*0.75);c.quadraticCurveTo(0,-rr*1.2,rr,-rr*0.75);c.lineTo(rr*0.92,rr*0.15);
    c.quadraticCurveTo(rr*0.62,rr*0.85,0,rr+4);c.quadraticCurveTo(-rr*0.62,rr*0.85,-rr*0.92,rr*0.15);c.closePath();
  }
  else if(s===10){
    // капля: острая макушка, круглое дно
    c.beginPath();c.moveTo(0,-rr-8);c.quadraticCurveTo(rr*0.85,-rr*0.35,rr,rr*0.2);c.arc(0,rr*0.2,rr,0,Math.PI);c.quadraticCurveTo(-rr*0.85,-rr*0.35,0,-rr-8);c.closePath();
  }
  else polyPath(c,6,rr,rot);
}

function drawHat(c,h,rr,sk,t,f){

    c.fillStyle='#fff';c.beginPath();c.arc(0,-rr-5,1.6,0,TAU);c.fill();

  }else if(h===5){
    c.fillStyle='#c22';
    for(const d of [-1,1]){c.beginPath();c.moveTo(d*4,-rr+3);c.lineTo(d*10,-rr-8);c.lineTo(d*11,-rr+2);c.closePath();c.fill();}
  }else if(h===6){
    c.strokeStyle='#e8b400';c.lineWidth=2.5;c.beginPath();c.ellipse(0,-rr-7,10,3.5,0,0,TAU);c.stroke();
  }else if(h===7){
    c.fillStyle='#f5c518';c.strokeStyle='#a87b00';c.lineWidth=1;
    c.beginPath();c.moveTo(-10,-rr+3);c.lineTo(-10,-rr-6);c.lineTo(-5,-rr-1);c.lineTo(0,-rr-9);c.lineTo(5,-rr-1);c.lineTo(10,-rr-6);c.lineTo(10,-rr+3);c.closePath();c.fill();c.stroke();
    c.fillStyle='#e33';c.beginPath();c.arc(0,-rr-2,1.8,0,TAU);c.fill();

    c.lineCap='round';
    c.strokeStyle='rgba(14,165,233,0.78)';c.lineWidth=6;c.beginPath();c.arc(0,0,6.5,f-1.05,f+1.05);c.stroke();
    c.strokeStyle='rgba(255,255,255,0.85)';c.lineWidth=1.5;c.beginPath();c.arc(0,0,7.5,f-0.7,f-0.2);c.stroke();
    c.lineCap='butt';
  }else if(h===10){
    // крылья машут по бокам
    const fl=Math.sin(t*0.25)*0.35;
    for(const d of [-1,1]){
      c.save();c.translate(d*(rr-2),-4);c.rotate(d*(-0.5+fl));

      c.beginPath();c.ellipse(d*7,5,8,3.5,0.3*d,0,TAU);c.fill();c.stroke();
      c.restore();
    }
  }else if(h===11){
    // ореол звёзд: пять звёздочек кружат над головой
    c.fillStyle='#facc15';

}
// шлейф по стилю следа; pts — точки {x,y,life,hot}, max — их полная жизнь
function drawTrail(c,pts,L,sk,max,t){
  const st=L.t;
  for(let i=0;i<pts.length;i++){
    const q=pts[i],a=Math.min(1,q.life/max);
    c.globalAlpha=a*(q.hot?0.6:(st===0?0.35:0.5));
    // разгон всегда оранжевый, иначе его не заметить
    if(q.hot===2){c.fillStyle='#fa0';c.beginPath();c.arc(q.x,q.y,3+6*a,0,TAU);c.fill();continue;}
    if(st===1){c.fillStyle=i%2?sk.main:sk.trail;const z=3+5*a;c.fillRect(Math.round(q.x/4)*4-z/2,Math.round(q.y/4)*4-z/2,z,z);}
    else if(st===2){c.fillStyle=i%3?sk.main:'#fff';c.beginPath();c.arc(q.x+Math.sin(i*12.9+t*0.3)*5,q.y+Math.cos(i*7.3+t*0.3)*5,1.5+2.5*a,0,TAU);c.fill();}
    else if(st===3){c.fillStyle=a>0.66?'#ffd23f':(a>0.33?'#ff8c1a':'#e0301e');c.beginPath();c.arc(q.x,q.y,2+7*a,0,TAU);c.fill();}
    else if(st===4){if(i%3===0){c.fillStyle=sk.main;c.font='bold '+Math.round(7+5*a)+'px Courier New, monospace';c.textAlign='center';c.fillText((i*7+Math.floor(i/3))%2?'1':'0',q.x,q.y+4);}}
    else if(st===5){c.fillStyle='hsl('+((i*14+t*4)%360)+',85%,55%)';c.beginPath();c.arc(q.x,q.y,3+5*a,0,TAU);c.fill();}
    else if(st===6){if(i>0){const o=pts[i-1];c.strokeStyle=sk.main;c.lineWidth=2+9*a;c.lineCap='round';c.beginPath();c.moveTo(o.x,o.y);c.lineTo(q.x,q.y);c.stroke();}}
    else if(st===7){
      c.fillStyle=i%2?'#f5c518':'#ffe58a';c.beginPath();c.arc(q.x,q.y,1.5+3*a,0,TAU);c.fill();
      if(i%5===0){c.fillRect(q.x-4*a,q.y-0.6,8*a,1.2);c.fillRect(q.x-0.6,q.y-4*a,1.2,8*a);}
    }
    else if(st===8){
      // созвездие: звёзды через одну точку из трёх, соединённые тонкой линией
      if(i%3===0){
        if(i>=3){const o=pts[i-3];c.strokeStyle=sk.main;c.lineWidth=1;c.beginPath();c.moveTo(o.x,o.y);c.lineTo(q.x,q.y);c.stroke();}
        c.fillStyle=i%2?'#fef08a':'#ffffff';c.beginPath();c.arc(q.x,q.y,1.5+2.5*a,0,TAU);c.fill();
      }
    }
    else if(st===9){
      if(i%4===0){c.save();c.translate(q.x,q.y);c.fillStyle=i%8?'#f43f5e':'#fb7185';shapePath(c,8,3+6*a,0);c.fill();c.restore();}
    }
    else if(st===10){
      // пузыри всплывают и растут, пока гаснут
      if(i%2===0){
        const bx=q.x+Math.sin(i*1.7+t*0.05)*3,by=q.y-(1-a)*12,br=2+5*(1-a);
        c.strokeStyle=sk.trail;c.lineWidth=1.5;c.beginPath();c.arc(bx,by,br,0,TAU);c.stroke();
        c.fillStyle='#fff';c.beginPath();c.arc(bx-br*0.35,by-br*0.35,Math.max(0.8,br*0.25),0,TAU);c.fill();
      }
    }
    else{c.fillStyle=q.hot===1?sk.main:sk.trail;c.beginPath();c.arc(q.x,q.y,3+6*a,0,TAU);c.fill();}
  }
  c.globalAlpha=1;c.lineCap='butt';
}

const bgCanvas=document.createElement('canvas'),bgx=bgCanvas.getContext('2d');
function buildBg(){
  bgCanvas.width=cvs.width;bgCanvas.height=cvs.height;

  bgx.fillStyle=ac.bg;bgx.fillRect(0,0,W,H);

  for(let y=0;y<H;y+=40){bgx.moveTo(0,y);bgx.lineTo(W,y);}
  bgx.stroke();

  for(const f of flows)bgx.fillRect(0,f.y,W,f.h);
  // зоны инверсии — розовые круги со стрелками «туда-обратно»
  for(const z of invs){
    bgx.fillStyle='rgba(219,39,119,0.07)';bgx.beginPath();bgx.arc(z.x,z.y,z.r,0,TAU);bgx.fill();
    bgx.strokeStyle='rgba(219,39,119,0.45)';bgx.lineWidth=1.5;bgx.setLineDash([3,6]);bgx.stroke();bgx.setLineDash([]);
    bgx.fillStyle='rgba(190,24,93,0.6)';bgx.font='bold 18px Courier New, monospace';bgx.textAlign='center';

  }
  // зоны лага — штрихованные круги
  for(const z of lags){
    bgx.save();bgx.beginPath();bgx.arc(z.x,z.y,z.r,0,TAU);
    bgx.fillStyle='rgba(120,90,200,0.08)';bgx.fill();bgx.clip();
    bgx.strokeStyle='rgba(120,90,200,0.22)';bgx.lineWidth=2;bgx.beginPath();
    for(let i=-z.r*2;i<z.r*2;i+=12){bgx.moveTo(z.x+i-z.r,z.y+z.r);bgx.lineTo(z.x+i+z.r,z.y-z.r);}
    bgx.stroke();bgx.restore();
    bgx.strokeStyle='rgba(120,90,200,0.5)';bgx.lineWidth=1.5;bgx.setLineDash([6,5]);
    bgx.beginPath();bgx.arc(z.x,z.y,z.r,0,TAU);bgx.stroke();bgx.setLineDash([]);
    bgx.fillStyle='rgba(100,70,180,0.55)';bgx.font='bold 11px Courier New, monospace';bgx.textAlign='center';
    bgx.fillText('ЛАГ',z.x,z.y+4);
  }
  for(const w of walls){
    bgx.fillStyle='#e2e9f1';bgx.fillRect(w.x,w.y,w.w,w.h);
    bgx.save();bgx.beginPath();bgx.rect(w.x,w.y,w.w,w.h);bgx.clip();
    bgx.strokeStyle='rgba(0,85,119,0.25)';bgx.lineWidth=2;bgx.beginPath();
    for(let i=-w.h;i<w.w;i+=10){bgx.moveTo(w.x+i,w.y+w.h);bgx.lineTo(w.x+i+w.h,w.y);}
    bgx.stroke();bgx.restore();
    bgx.strokeStyle='#057';bgx.lineWidth=2;bgx.strokeRect(w.x+1,w.y+1,w.w-2,w.h-2);
  }
}

function drawHeart(cx,cy,s,fill){
