  c.rotate(f);c.scale(1+stretch,1-stretch*0.5);c.rotate(-f);

  // свечение — готовый спрайт вместо shadowBlur
  if(full||Q.glow){
    const gl=glowSprite(sk.main);
    c.drawImage(gl,-gl.size/2,-gl.size/2,gl.size,gl.size);
  }

  // кольца
  c.strokeStyle=sk.ring;c.lineWidth=2.5;
  c.save();c.rotate(t*0.05);
  for(let i=0;i<3;i++){
    c.rotate(TAU/3);
    c.beginPath();c.arc(0,0,p.r+7,0,TAU*0.22);c.stroke();
  }
  c.restore();

  // тело по форме
  const rot=t*0.02;
  const rr=p.r*(1+Math.sin(t*0.1)*0.05);
  if(full||Q.grad){
    const grad=c.createRadialGradient(-4,-4,2,0,0,rr+4);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.4,sk.main);
    grad.addColorStop(1,sk.dark);
    c.fillStyle=grad;
  }else c.fillStyle=sk.main;
  shapePath(c,L.s,rr,rot);
  c.fill();
  c.strokeStyle=sk.dark;c.lineWidth=1.5;c.stroke();

  // глаза; в очках — тёмные стёкла с перемычкой
  const ex=Math.cos(f)*4,ey=Math.sin(f)*4;
  const e1x=ex-4+ey*0.5,e1y=ey-ex*0.5,e2x=ex+4+ey*0.5,e2y=ey+ex*0.5;
  c.fillStyle=L.h===4?'#111':sk.dark;
  const er=L.h===4?4:2.6;
  c.beginPath();c.arc(e1x,e1y,er,0,TAU);c.fill();
  c.beginPath();c.arc(e2x,e2y,er,0,TAU);c.fill();
  if(L.h===4){c.strokeStyle='#111';c.lineWidth=1.5;c.beginPath();c.moveTo(e1x,e1y);c.lineTo(e2x,e2y);c.stroke();}
  drawHat(c,L.h,rr,sk,t,f);
  c.restore();
}

function drawPlayer(){
  const L=wornLook(),sk=colOf(L.c,time);
  const p=player;
  drawTrail(ctx,trail,L,sk,Q.trail,time);
  // линии скорости при рывке и разгоне
  const sp=Math.hypot(p.vx,p.vy);
  if((boost>0||p.dashT>0)&&sp>2){
    const ux=p.vx/sp,uy=p.vy/sp,len=6+sp*2.2;
    ctx.strokeStyle=p.dashT>0?sk.main:'#fa0';ctx.lineWidth=2;ctx.globalAlpha=0.75;
    ctx.beginPath();
    for(let i=-1;i<=1;i++){
      const ox=-uy*i*8,oy=ux*i*8,st=20+Math.abs(i)*6;
      ctx.moveTo(p.x-ux*st+ox,p.y-uy*st+oy);ctx.lineTo(p.x-ux*(st+len)+ox,p.y-uy*(st+len)+oy);
    }
    ctx.stroke();ctx.globalAlpha=1;
  }
  if(p.cool>0&&Math.floor(time/4)%2===1)return;
  drawPlayerBody(ctx,p,time,false,L);

  // сердечки над игроком; с аксессуаром — чуть выше, чтобы не налезали
  const hy=L.h&&L.h!==4?36:30;
  const ml=maxLives();
  for(let i=0;i<ml;i++)drawHeart(p.x-(ml-1)*7+i*14,p.y-hy,6,i<lives);

  // полоски: рывок, подножка и оставшийся разгон
  ctx.fillStyle='#0001';ctx.fillRect(p.x-16,p.y+22,32,4);ctx.fillRect(p.x-16,p.y+27,32,3);
  ctx.fillStyle=sk.ring;ctx.fillRect(p.x-16,p.y+22,32*Math.max(0,1-p.dashCd/70),4);
  ctx.fillStyle='#b7791f';ctx.fillRect(p.x-16,p.y+27,32*Math.max(0,1-(p.tripCd||0)/tripCdMax()),3);
  if(boost>0){ctx.fillStyle='#fa0';ctx.fillRect(p.x-16,p.y+31,32*boost/240,3);}
}

// над споткнувшимся кружат звёздочки; за секунду до подъёма они мигают
function drawStars(e){
  if(e.trip>60||Math.floor(time/6)%2===0){
    ctx.fillStyle='#e9b020';
    for(let i=0;i<3;i++){
      const s=time*0.12+i*TAU/3;
      ctx.fillRect(e.x+Math.cos(s)*9-1.5,e.y-e.r-7+Math.sin(s)*3-1.5,3,3);
    }
  }
}
function drawWorm(e){
  if(e.trip>0)ctx.globalAlpha=0.7;
  for(let i=WORM_SEGS;i>=1;i--){const s=wormSeg(e,i);drawSprite(SPR_WSEG,s[0],s[1],0,1-i*0.05);}
  drawSprite(SPR_WHEAD,e.x,e.y,e.ang,1);
  ctx.globalAlpha=1;
}

function drawEnemy(e){
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  if(e.type==='worm'){drawWorm(e);if(e.trip>0)drawStars(e);return;}
  if(e.trip>0){
    // споткнулся: полсекунды кувыркается, потом лежит
    ctx.globalAlpha=0.7;
    const spr={sniper:SPR_SNIPER,glitch:SPR_GLITCH,bot:SPR_BOT,turret:SPR_TURRET,thief:SPR_THIEF,mirror:SPR_MIRROR,miner:SPR_MINER}[e.type]||SPR_CHASER;
    drawSprite(spr,e.x,e.y,e.trip>TRIP_STUN-30?time*0.35:e.tripRot,e.type==='sniper'||e.type==='chaser'?e.r/11:1);
    ctx.globalAlpha=1;
    drawStars(e);
    return;
  }
  if(e.type==='trojan'){
    // от настоящих данных отличает красная точка в центре и вращение в другую сторону
    const red=e.arm>0&&Math.floor(e.arm/4)%2===0;
    drawSprite(red?SPR_TROJAN:SPR_DATA,e.x,e.y,-e.t*0.05,1+Math.sin(e.t*0.12)*0.25);
    ctx.fillStyle='#d22';ctx.beginPath();ctx.arc(e.x,e.y,1.8,0,TAU);ctx.fill();
    if(e.arm>0){ctx.strokeStyle='#e33';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,10+(45-e.arm)*0.4,0,TAU);ctx.stroke();}
    return;
  }
  if(e.type==='glitch'){
    // перед прыжком — пунктирный круг там, где он появится
    if(e.warp>0){
      ctx.strokeStyle='#c3f';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(e.wx,e.wy,10+e.warp*0.4,0,TAU);ctx.stroke();ctx.setLineDash([]);
    }
    const j=e.warp>0?3:1;
    drawSprite(SPR_GLITCH,e.x+(Math.random()-0.5)*2*j,e.y+(Math.random()-0.5)*2*j,a,1);
    return;
  }
  if(e.type==='turret'){
    // поднимается — пунктир и полупрозрачность; за треть секунды до очереди ствол краснеет
    if(e.rise>0){
      ctx.globalAlpha=0.35+0.6*(1-e.rise/40);
      ctx.strokeStyle='#475569';ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(e.x,e.y,22,0,TAU);ctx.stroke();ctx.setLineDash([]);
    }
    drawSprite(SPR_TURRET,e.x,e.y,0,1);
    ctx.strokeStyle=e.rise<=0&&e.fireT<20?'#dc2626':'#1e293b';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(e.ang)*17,e.y+Math.sin(e.ang)*17);ctx.stroke();ctx.lineCap='butt';
    ctx.globalAlpha=1;
    return;
  }
  if(e.type==='thief'){
    drawSprite(SPR_THIEF,e.x,e.y,Math.atan2(e.vy,e.vx),1);
    if(e.loot){ctx.fillStyle='#6d28d9';ctx.font='bold 11px Courier New, monospace';ctx.textAlign='center';ctx.fillText('◆'+e.loot,e.x,e.y-14);}
    return;
  }
  if(e.type==='missile'){
    ctx.fillStyle=Math.floor(time/3)%2?'#fb923c':'#facc15';
    ctx.beginPath();ctx.arc(e.x-Math.cos(e.ang)*12,e.y-Math.sin(e.ang)*12,3+Math.random()*2,0,TAU);ctx.fill();
    drawSprite(SPR_MISSILE,e.x,e.y,e.ang,1);
    return;
  }
  if(e.type==='mirror'){
    ctx.globalAlpha=0.9;drawSprite(SPR_MIRROR,e.x,e.y,-time*0.02,1);ctx.globalAlpha=1;
    return;
  }
  if(e.type==='miner'){drawSprite(SPR_MINER,e.x,e.y,time*0.03,1);return;}
  if(e.type==='mine'){
    ctx.globalAlpha=e.life<120?e.life/120:(e.arm>0?0.5:1);
    drawSprite(SPR_MINE,e.x,e.y,0,1);
    if(!e.arm&&Math.floor(time/10)%2){ctx.strokeStyle='#ef4444';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(e.x,e.y,13,0,TAU);ctx.stroke();}
    ctx.globalAlpha=1;
    return;
  }
  if(e.type==='heavy'){
    drawSprite(SPR_HEAVY,e.x,e.y,a+time*0.01,1);
    ctx.fillStyle='#401';
    ctx.beginPath();ctx.arc(e.x+Math.cos(a)*e.r*0.15,e.y+Math.sin(a)*e.r*0.15,e.r*0.22,0,TAU);ctx.fill();
    ctx.fillStyle='#0002';ctx.fillRect(e.x-14,e.y-e.r-9,28,4);
    ctx.fillStyle='#92b';ctx.fillRect(e.x-14,e.y-e.r-9,14*e.hp,4);
  }else if(e.type==='bot'){
    drawSprite(SPR_BOT,e.x,e.y,a,1);
  }else{
    drawSprite(e.type==='sniper'?SPR_SNIPER:SPR_CHASER,e.x,e.y,a,e.r/11);
  }
}

// opaque — нарисовать фон без шлейфов (после смены размера холста или для застывшего кадра)
function render(opaque){
  if(!ready)return;
  ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);
  // фон: полупрозрачный слой оставляет шлейфы за всем, что движется (так задумано)
  // на низкой графике фон кладётся сразу целиком: без шлейфов, зато дешевле
  ctx.globalAlpha=opaque||!Q.ghost?1:0.4;
  ctx.drawImage(bgCanvas,0,0,W,H);
  ctx.fillStyle='#068';
  for(let i=0;i<Q.dust&&i<dust.length;i++){const d=dust[i];ctx.globalAlpha=d.a;ctx.fillRect(d.x,d.y,d.s,d.s);}
  ctx.globalAlpha=1;
  if(phase==='menu'){updateHud();return;}

  const cfg=LEVELS[lvl];
  ctx.save();
  if(shake>0&&phase==='game'&&!RM)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // данные
  for(const dt of data)drawSprite(SPR_DATA,dt.x,dt.y,dt.t*0.05,1+Math.sin(dt.t*0.12)*0.25);

  // усилители
  ctx.font='bold 13px Courier New, monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=2;
  for(const p of pickups){
    const y=p.y+Math.sin(p.t*0.08)*3,col=PICK[p.type].color;
    // запасная аптечка при полном здоровье бледнее — её пока не взять
    if(p.type==='hp'&&lives>=maxLives())ctx.globalAlpha=0.45;
    ctx.strokeStyle=col;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(p.x,y,p.r,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=col;
    if(p.type==='hp'){ctx.fillRect(p.x-6,y-2,12,4);ctx.fillRect(p.x-2,y-6,4,12);}
    else if(p.type==='emp'){ctx.font='bold 8px Courier New, monospace';ctx.fillText('EMP',p.x,y+1);}
    else{ctx.font='bold 13px Courier New, monospace';ctx.fillText('»',p.x,y+1);}
    ctx.globalAlpha=1;
  }
  ctx.textBaseline='alphabetic';

  // потоки трафика — бегущие стрелки; барьеры файрвола — пунктир, мигание, красная полоса
  if(flows.length){
    ctx.strokeStyle='rgba(51,153,204,0.45)';ctx.lineWidth=2;ctx.beginPath();
    for(const f of flows){
      const cy=f.y+f.h/2,off=((time*1.5*f.dir)%50+50)%50;
      for(let x=-50+off;x<W+50;x+=50){ctx.moveTo(x-5*f.dir,cy-7);ctx.lineTo(x+5*f.dir,cy);ctx.lineTo(x-5*f.dir,cy+7);}
    }
    ctx.stroke();
  }
  for(const g of gates){
    const st=gateState(g);
    if(st===2){
      ctx.fillStyle='rgba(230,40,50,0.55)';ctx.fillRect(g.x,g.y,g.w,g.h);
      ctx.strokeStyle='#c22';ctx.lineWidth=2;ctx.strokeRect(g.x,g.y,g.w,g.h);
    }else if(st===1){
      if(Math.floor(time/5)%2===0){ctx.strokeStyle='#e33';ctx.lineWidth=2;ctx.strokeRect(g.x,g.y,g.w,g.h);}
    }else{
      ctx.strokeStyle='rgba(204,34,34,0.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);
      ctx.strokeRect(g.x,g.y,g.w,g.h);ctx.setLineDash([]);
    }
  }

  // чёрные дыры: граница притяжения, закрученные кольца и тёмное ядро
  for(const h of holes){
    ctx.strokeStyle='rgba(76,29,149,0.25)';ctx.lineWidth=1.5;ctx.setLineDash([2,8]);
    ctx.beginPath();ctx.arc(h.x,h.y,h.R,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='rgba(109,40,217,0.5)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const r=h.r+6+((time*0.8+i*h.R/3)%(h.R*0.7));
      ctx.globalAlpha=0.6*(1-r/(h.R*0.8));
      ctx.beginPath();ctx.arc(h.x,h.y,r,time*0.03+i,time*0.03+i+4.2);ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#1e1b4b';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,TAU);ctx.fill();
    ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,h.r+2,0,TAU);ctx.stroke();
  }
  // подвижные блоки — как битые сектора, только с жёлто-чёрной каймой
  for(const m of movers){
    ctx.fillStyle='#e2e9f1';ctx.fillRect(m.x,m.y,m.w,m.h);
    ctx.strokeStyle='#ca8a04';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.strokeRect(m.x+1.5,m.y+1.5,m.w-3,m.h-3);
    ctx.strokeStyle='#1f2937';ctx.lineDashOffset=6;ctx.strokeRect(m.x+1.5,m.y+1.5,m.w-3,m.h-3);
    ctx.setLineDash([]);ctx.lineDashOffset=0;
  }

  // роутеры: парные кольца одного цвета; пока роутер «остывает», кольца бледнее
  for(let k=0;k<tps.length;k++){
    const col=['#7a4fd6','#d6408a','#2b8a9e'][k%3];
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.globalAlpha=player.tpCd>0?0.35:0.85;
    for(const q of tps[k]){
      ctx.setLineDash([7,5]);ctx.lineDashOffset=-time*0.6;
      ctx.beginPath();ctx.arc(q.x,q.y,TP_R,0,TAU);ctx.stroke();
      ctx.setLineDash([]);ctx.lineDashOffset=0;
      ctx.beginPath();ctx.arc(q.x,q.y,TP_R*0.45+Math.sin(time*0.1+k)*2,0,TAU);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  // сканер: пунктир — отдыхает, сплошной красный — жжёт
  if(scan){
    const hot=scanHot(),warn=!hot&&time%360>=90;
    ctx.strokeStyle=hot?'#e11d48':'rgba(225,29,72,0.45)';
    ctx.lineWidth=hot?5:2;
    if(!hot)ctx.setLineDash(warn&&Math.floor(time/5)%2?[2,4]:[8,8]);
    ctx.beginPath();
    for(let k=0;k<scan.arms;k++){
      const a=scan.a+k*TAU/scan.arms,ux=Math.cos(a),uy=Math.sin(a);
      ctx.moveTo(scan.x+ux*scan.gap,scan.y+uy*scan.gap);ctx.lineTo(scan.x+ux*1000,scan.y+uy*1000);
    }
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#9f1239';ctx.beginPath();ctx.arc(scan.x,scan.y,7,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(159,18,57,0.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(scan.x,scan.y,scan.gap,0,TAU);ctx.stroke();
  }

  // в темноте прячутся данные и бонусы, а враги, портал и пули видны — иначе нечестно
  if(cfg.dark)ctx.drawImage(darkSprite(cfg.dark+D().dark),player.x-W,player.y-H,W*2,H*2);

  // портал
  if(portal){
    const p=portal;
    ctx.save();ctx.translate(p.x,p.y);
    ctx.rotate(p.t*0.03);
    ctx.strokeStyle='#2a6';ctx.lineWidth=4;ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.arc(0,0,p.r+Math.sin(p.t*0.1)*4,0,TAU);ctx.stroke();
    ctx.setLineDash([]);ctx.rotate(-p.t*0.03);
    ctx.fillStyle='#2a64';
    ctx.beginPath();ctx.arc(0,0,p.r*0.5+Math.sin(p.t*0.08)*2,0,TAU);ctx.fill();
    ctx.restore();
  }

  enemies.forEach(drawEnemy);

  // босс
  if(boss){
    const b=boss;
    // сжатие Архиватора — сходящиеся кольца; прицел Дефрагментатора — красная линия
    if(b.pull){
      ctx.strokeStyle=cfg.boss.c2;ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.globalAlpha=0.6;
      for(let i=0;i<3;i++){const r=200-((time*3+i*60)%160);ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.stroke();}
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    if(b.mode==='aim'){
      const a=Math.atan2(b.ty-b.y,b.tx-b.x);
      ctx.strokeStyle='#e33';ctx.lineWidth=b.mt<20?3:1.5;ctx.setLineDash([10,6]);
      ctx.globalAlpha=b.mt<20&&Math.floor(time/3)%2?1:0.6;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*1000,b.y+Math.sin(a)*1000);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    // щит Капчи — пульсирующее синее кольцо
    if(b.shield){
      ctx.strokeStyle='#39c';ctx.lineWidth=3;ctx.globalAlpha=0.55+0.3*Math.sin(time*0.2);
      ctx.beginPath();ctx.arc(b.x,b.y,58,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }
    if(b.kind==='cloak'){
      const c=b.t%360;
      if(c>=260&&c<320){
        ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.setLineDash([5,5]);
        ctx.beginPath();ctx.arc(b.wx,b.wy,b.r+(320-c)*0.6,0,TAU);ctx.stroke();ctx.setLineDash([]);
      }
      ctx.globalAlpha=c<200?1:(c<230?1-(c-200)/30*0.9:(c<320?0.1:1));
    }
    if(b.arms){
      ctx.strokeStyle=cfg.boss.c2;ctx.lineCap='round';
      for(let k=0;k<3;k++){
        const a=b.ang+k*TAU/3,ux=Math.cos(a),uy=Math.sin(a);
        ctx.lineWidth=11;ctx.globalAlpha=0.85;
        ctx.beginPath();ctx.moveTo(b.x+ux*b.r*0.6,b.y+uy*b.r*0.6);ctx.lineTo(b.x+ux*(b.r+KRAKEN_ARM),b.y+uy*(b.r+KRAKEN_ARM));ctx.stroke();
        ctx.fillStyle=cfg.boss.c1;ctx.globalAlpha=1;
        for(let j=1;j<=4;j++){ctx.beginPath();ctx.arc(b.x+ux*(b.r+j*22),b.y+uy*(b.r+j*22),2.5,0,TAU);ctx.fill();}
      }
      ctx.lineCap='butt';ctx.globalAlpha=1;
    }
    if(b.charge>0){
      ctx.strokeStyle='#dc2626';ctx.lineWidth=2+b.charge*4;ctx.globalAlpha=0.3+b.charge*0.6;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+8+b.charge*40,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }
    if(b.light>=0){
      // слева направо: красный, жёлтый, зелёный; b.light: 0 — красный, 1 — жёлтый, 2 — зелёный
      const cols=['#dc2626','#f59e0b','#16a34a'];
      ctx.fillStyle='#1f2937';ctx.fillRect(b.x-26,b.y-b.r-46,52,18);
      for(let i=0;i<3;i++){ctx.fillStyle=i===b.light?cols[i]:'#4b5563';ctx.beginPath();ctx.arc(b.x-16+i*16,b.y-b.r-37,6,0,TAU);ctx.fill();}
    }
    if(b.kind==='balance'){
      const pts=bossPoints(b),spr=bossSprite(cfg.boss);
      ctx.strokeStyle=cfg.boss.c2;ctx.lineWidth=2;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(pts[1][0],pts[1][1]);ctx.lineTo(pts[2][0],pts[2][1]);ctx.stroke();ctx.setLineDash([]);
      drawSprite(spr,b.x,b.y,b.t*0.01,0.6);
      drawSprite(spr,pts[1][0],pts[1][1],-b.t*0.03,0.42);
      drawSprite(spr,pts[2][0],pts[2][1],-b.t*0.03,0.42);
    }else drawSprite(bossSprite(cfg.boss),b.x,b.y,b.t*0.01,1);
    ctx.globalAlpha=1;
    ctx.fillStyle='#0002';ctx.fillRect(b.x-40,b.y-b.r-16,80,6);
    ctx.fillStyle=cfg.boss.c2;ctx.fillRect(b.x-40,b.y-b.r-16,80/b.maxHp*Math.max(0,b.hp),6);
    ctx.fillStyle='#057';ctx.font='bold 11px Courier New, monospace';ctx.textAlign='center';
    ctx.fillText(b.name,b.x,b.y-b.r-21);
  }

  // пули
  for(const b of bullets){
    if(b.rock){drawSprite(SPR_ROCK,b.x,b.y,b.rot,b.r/15);continue;}
    const z=SPR_BULLET.size*b.r/5;
    ctx.drawImage(b.home>0?SPR_HOMING:SPR_BULLET,b.x-z/2,b.y-z/2,z,z);
  }

  // удар с орбиты: красная метка сжимается к центру; когда сойдётся — взрыв
  for(const st of strikes){
    const k=1-st.t/st.T;
    ctx.strokeStyle='#dc2626';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.arc(st.x,st.y,STRIKE_R,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(220,38,38,'+(0.1+0.25*k)+')';ctx.beginPath();ctx.arc(st.x,st.y,STRIKE_R*k,0,TAU);ctx.fill();
    ctx.beginPath();ctx.moveTo(st.x-10,st.y);ctx.lineTo(st.x+10,st.y);ctx.moveTo(st.x,st.y-10);ctx.lineTo(st.x,st.y+10);ctx.stroke();
  }

  // волна подножки расходится от игрока на весь радиус
  if(tripFx){
    const k=tripFx.t/16;
    ctx.globalAlpha=1-k;ctx.strokeStyle='#b7791f';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(tripFx.x,tripFx.y,20+(TRIP_R-20)*k,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }

  drawPlayer();

  for(const p of parts){
    ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life/40);
    ctx.fillRect(p.x,p.y,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
  ctx.font='bold 14px Courier New, monospace';ctx.textAlign='center';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.life/25);
    ctx.fillStyle=t.color;
    ctx.fillText(t.str,t.x,t.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // таймер очистки — внизу по центру
  if(cfg.timer&&!portal&&!boss){
    const s=Math.ceil(purge/60),low=s<=10;
    ctx.textAlign='center';ctx.font='bold 14px Courier New, monospace';
    ctx.fillStyle=low?'#c22':'#057';
    ctx.fillText('ОЧИСТКА '+cfg.name+' ЧЕРЕЗ '+s+' с',W/2,H-22);
    ctx.fillStyle='#0001';ctx.fillRect(W/2-100,H-14,200,4);
    ctx.fillStyle=low?'#e33':'#0a5';ctx.fillRect(W/2-100,H-14,200*purge/(timerOf(cfg)*60),4);
  }

  // заставка уровня
  if(intro>0){
    ctx.globalAlpha=Math.min(1,intro/30);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(0,96,W,114);
    ctx.textAlign='center';
    ctx.fillStyle='#a2a';ctx.font='bold 14px Courier New, monospace';
    ctx.fillText('УРОВЕНЬ '+(lvl+1)+' ИЗ '+LEVELS.length,W/2,120);
    ctx.fillStyle='#057';ctx.font='bold 30px Courier New, monospace';
    ctx.fillText(cfg.name,W/2,153);
    ctx.fillStyle='#689';ctx.font='14px Courier New, monospace';
    ctx.fillText(objective(cfg),W/2,178);
    ctx.font='12px Courier New, monospace';
    ctx.fillText(features(cfg),W/2,198);
    ctx.globalAlpha=1;
  }

  // счётчик кадров — включается в настройках
  if(save.fps){
    const s=fpsShown+' FPS · '+tierName();
    ctx.font='bold 11px Courier New, monospace';ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(4,H-20,ctx.measureText(s).width+8,16);
    ctx.fillStyle='#057';ctx.fillText(s,8,H-8);
  }
  updateHud();
}

const PV_TRAIL=[];

function drawPreview(){
  const pv=$id('pv');
  if(!pv)return;
  const c=pv.getContext('2d'),s=pv.height/56,L=previewLook();
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,pv.width,pv.height);
  c.setTransform(s,0,0,s,0,0);
  const cx=pv.width/s-34,cy=30;
  for(let k=0;k<PV_TRAIL.length;k++){const q=PV_TRAIL[k],d=(PV_TRAIL.length-k)*3.2;q.x=cx-d;q.y=cy+Math.sin(d*0.08+time*0.05)*6;}
  drawTrail(c,PV_TRAIL,L,colOf(L.c,time),PV_TRAIL.length,time);
  drawPlayerBody(c,{x:cx,y:cy,vx:0,vy:0,r:14,face:0},time,true,L);
}

const hudLast={};
function setHud(k,v){v=String(v);if(hudLast[k]!==v){hudLast[k]=v;hudEl[k].textContent=v;}}
function setOff(k,off){if(hudLast[k+'Off']!==off){hudLast[k+'Off']=off;hudEl[k].classList.toggle('off',off);}}
function updateHud(){
  const c=LEVELS[lvl];
  setHud('data',Math.min(got,goalOf(c))+'/'+goalOf(c));
  setHud('score',score);
  setHud('level',(lvl+1)+'/'+LEVELS.length);
  setHud('hearts',heartsStr(lives));
  const cd=Math.min(5,Math.ceil(player.dashCd/14));
  setHud('dash','▓'.repeat(5-cd)+'░'.repeat(cd));
  const tc=Math.min(5,Math.ceil((player.tripCd||0)/(tripCdMax()/5)));
  setHud('trip','▓'.repeat(5-tc)+'░'.repeat(tc));
  setOff('bTrip',(player.tripCd||0)>0);
  setHud('emp',emp);
  setHud('bEmp','EMP ×'+emp);
  setOff('bDash',player.dashCd>0);
  setOff('bEmp',emp<=0||player.empCd>0);
}

function showMenu(s,focusAct){
  if(s!=='skins')tryOn=null;
  menuScreen=s;
  panelEl.innerHTML=panelHTML(s);
  menuEl.hidden=false;
  screenEl.classList.add('menu-open');
  panelEl.scrollTop=0;
  if(kbUser){
    const b=(focusAct&&panelEl.querySelector('[data-act="'+focusAct+'"]'))||((s==='signin'||s==='signup')&&$id('lg-login'))||panelEl.querySelector('.primary')||panelEl.querySelector('button:not([disabled])');
    if(b)b.focus({preventScroll:true});
  }
  // текст ошибки входа приходит и от сервера, поэтому только textContent
  const er=panelEl.querySelector('.err');
  if(er&&NET.err&&(s==='gate'||s==='acct')){er.textContent=NET.err;er.hidden=false;}
  if(s==='termstext'){const box=panelEl.querySelector('.terms');if(box&&TERMS_TPL)box.appendChild(TERMS_TPL.content.cloneNode(true));}
  if(s==='skins')drawPreview();
  if(s==='main'||s==='acct')fillAccount();
  if(s==='top')fillTop();
}
function hideMenu(){
  if(menuEl.contains(document.activeElement))document.activeElement.blur();
  menuEl.hidden=true;
  screenEl.classList.remove('menu-open');
}
function goMenu(){
  bankBits();
  phase='menu';
  walls=[];flows=[];gates=[];lags=[];tps=[];scan=null;movers=[];solids=[];holes=[];invs=[];strikes=[];bgAct=0;boost=0;shake=0;
  buildBg();
  msgEl.textContent='';
  showMenu('main');
}
// подпись предмета: цена, акт, звезда поддержки или галочка у надетого
function itemChip(cat,i,cur){
  const it=cat.list[i],own=owned(cat.id,i);
  if(it.sup&&!own&&!DONATE_ON)return '';
  const tag=own?(save[cat.key]===i?'✓':''):(it.price?'◈ '+it.price:(it.act?'акт '+it.act:'★'));
  const sw=cat.id==='c'?'<span class="sw" style="background:'+it.main+(it.rainbow?';background:conic-gradient(#f33,#fd2,#3d5,#2cf,#55f,#e3e,#f33)':(it.sw?';background:'+it.sw:''))+'"></span>':'';
  return '<button type="button" class="chip'+(own?'':' lock')+'" data-act="item:'+cat.id+':'+i+'" aria-pressed="'+(i===cur)+'">'+sw+it.name+(tag?'<small>'+tag+'</small>':'')+'</button>';
}
// нажатие на предмет: своё — надеть, чужое — примерить (в превью), купить — отдельной кнопкой
function pickItem(cat,i,focusAct){
  const c=catOf(cat);
  if(!c.list[i])return;
  if(owned(cat,i)){save[c.key]=i;tryOn=null;persist();}
  else tryOn={cat,i};
  showMenu('skins',focusAct||'item:'+cat+':'+i);
}
function buyItem(){
  if(!tryOn)return;
  const c=catOf(tryOn.cat),it=c.list[tryOn.i];
  if(!it.price||owned(tryOn.cat,tryOn.i)||coins()<it.price)return;
  save.own.push(tryOn.cat+tryOn.i);
  save[c.key]=tryOn.i;
  const id='item:'+tryOn.cat+':'+tryOn.i;
  tryOn=null;persist();buzz(40);
  showMenu('skins',id);
}
function act(a){
  const k=a.split(':')[0],n=Number(a.split(':')[1]);
  if((k==='play'||k==='new'||k==='again'||k==='lv')&&needLogin()){showMenu('gate');return;}
  if(k==='play')newRun(save.unlocked-1);
  else if(k==='new'||k==='again')newRun(0);
  else if(k==='lv'){if(n<save.unlocked)newRun(n);}
  else if(k==='lvact'){if(actStart(n)<save.unlocked){lvAct=n;showMenu('levels',a);}}
  else if(k==='levels'){lvAct=actOf(save.unlocked-1);showMenu('levels');}
  else if(k==='tab'){shopTab=catOf(a.split(':')[1]).id;tryOn=null;showMenu('skins',a);}
  else if(k==='item')pickItem(a.split(':')[1],Number(a.split(':')[2]));
  else if(k==='buy')buyItem();
  else if(k==='sum'){donSum=n;showMenu('donate',a);}
  else if(k==='pay'){donPay=a.split(':')[1]==='PC'?'PC':'AC';showMenu('donate',a);}
  else if(k==='yoopay')payYoomoney();
  else if(k==='donurl'){try{window.open(DONATE_URL,'_blank','noopener');}catch(_){}}
  else if(k==='supcheck')supPoll(1);
  else if(k==='resume')resume();
  else if(k==='restart')retryLevel(false);
  else if(k==='retry')retryLevel(true);
  else if(k==='next')nextLevel();
  else if(k==='settings'){settingsBack=menuScreen==='pause'?'pause':'main';showMenu('settings');}
  else if(k==='q'){
    const v=a.split(':')[1];
    save.q=v;
    if(v==='auto'){save.autoTier=guessTier();save.autoRes=1;}
    persist();applyQuality();showMenu('settings',a);
  }
  else if(k==='diff'){const v=a.split(':')[1];if(DIFFS.indexOf(v)>=0){save.diff=v;persist();}lives=Math.min(lives,maxLives());showMenu('settings',a);}
  else if(k==='fps'){save.fps=n===1;persist();showMenu('settings',a);if(phase!=='game')render(true);}
  else if(k==='vib'){save.vib=n===1;persist();buzz(40);showMenu('settings',a);}
  else if(k==='login')netLogin(a.split(':')[1]);
  else if(k==='signin'||k==='signup'){if(menuScreen==='gate'||menuScreen==='acct')loginBack=menuScreen;showMenu(k);}
  else if(k==='logout')netLogout();
  else if(k==='termstext'){if(menuScreen!=='termstext')termsBack=menuScreen;showMenu('termstext');}
  else if(k==='termsok')acceptTerms();
  else if(k==='nick'){
    const inp=$id('nick');
    if(inp){save.nick=inp.value.replace(/\s+/g,' ').trim().slice(0,20);inp.value=nickName();persist();}
  }
  else if(k==='menu')goMenu();
  else showMenu(k);
}

    if(code==='ArrowUp'||code==='ArrowDown'){

  if(phase==='menu'&&code==='Escape'&&(menuScreen==='gate'||menuScreen==='terms'))return;
  if(phase==='menu'&&code==='Escape'&&menuScreen==='termstext'){showMenu(termsBack);return;}
  if(phase==='menu'&&code==='Escape'&&(menuScreen==='signin'||menuScreen==='signup')){showMenu(loginBack);return;}
  if(phase==='menu'&&code==='Escape'&&menuScreen!=='main'){showMenu('main');return;}
  // Enter без выбранной кнопки нажимает главную кнопку экрана
  if((code==='Enter'||code==='NumpadEnter')&&!(document.activeElement instanceof HTMLButtonElement)){
    const b=panelEl.querySelector('.primary');

}

const screenEl=$id('screen'),stick=$id('stick'),knob=$id('knob');
let stickId=null,stickX=0,stickY=0,knobX=0,knobY=0,knobDirty=false;
function resetKnob(){
  knobDirty=false;
  knob.style.transform='';
  stick.style.left=stick.style.top=stick.style.bottom='';

function stickStart(e){
  const r=screenEl.getBoundingClientRect(),R=stick.offsetWidth/2;
  stickId=e.pointerId;stickX=e.clientX;stickY=e.clientY;
  try{screenEl.setPointerCapture(e.pointerId);}catch(_){}
  stick.style.left=(e.clientX-r.left-screenEl.clientLeft-R)+'px';
  stick.style.top=(e.clientY-r.top-screenEl.clientTop-R)+'px';
  stick.style.bottom='auto';
  stick.classList.add('on');
  stickMove(e);
}
function stickMove(e){
  const R=stick.offsetWidth/2||60;
  let x=(e.clientX-stickX)/R,y=(e.clientY-stickY)/R;
  const l=Math.hypot(x,y);
  if(l>1){x/=l;y/=l;}
  if(l<0.15){joy.x=0;joy.y=0;}else{joy.x=x;joy.y=y;}
  // Android шлёт движения пальца до 240 раз в секунду — ручку двигаем один раз за кадр
  knobX=x*R*0.6;knobY=y*R*0.6;knobDirty=true;
}

});
screenEl.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
const stickEnd=e=>{if(e.pointerId===stickId){stickId=null;joy.x=0;joy.y=0;resetKnob();}};

// ================= РАЗМЕР ХОЛСТА =================
// холст вписывается в свободное место; на сенсорном экране поле растягивается на весь экран,
// а клетка фона продолжается по краям. Плотность пикселей задаёт уровень графики (resScale).
const stageEl=$id('stage'),appEl=$id('app'),uiEl=$id('ui');
const touchMQ=matchMedia('(pointer: coarse)');
function fit(){
  const touch=touchMQ.matches;
  let rw,rh;
  if(touch){rw=screenEl.clientWidth;rh=screenEl.clientHeight;}
  else{const r=stageEl.getBoundingClientRect();rw=r.width-4;rh=r.height-4;}
  const k=Math.max(0.2,Math.min(rw/W,rh/H,touch?3:1.4));
  const cw=Math.floor(W*k),ch=Math.floor(H*k);
  cvs.style.width=cw+'px';cvs.style.height=ch+'px';
  if(touch){
    const l=Math.floor((rw-cw)/2),t=Math.floor((rh-ch)/2),g=40*k;
    cvs.style.left=l+'px';cvs.style.top=t+'px';
    screenEl.style.backgroundSize=g+'px '+g+'px';
    screenEl.style.backgroundPosition=l+'px '+t+'px';
    screenEl.style.setProperty('--cvs-top',t+'px');
  }else{
    cvs.style.left=cvs.style.top='';
    screenEl.style.backgroundSize=screenEl.style.backgroundPosition='';
    screenEl.style.removeProperty('--cvs-top');
  }
  const bw=Math.round(cw*resScale),bh=Math.round(ch*resScale);
  if(cvs.width!==bw||cvs.height!==bh){
    cvs.width=bw;cvs.height=bh;
    buildBg();
    render(true);
  }
}

  else{appEl.insertBefore(uiEl,stageEl);appEl.append(msgEl);}

}

// ================= ЦИКЛ =================
// логика идёт фиксированными шагами по 60 в секунду, а кадр рисуется только после шага:
// на экранах 90–120 Гц лишние перерисовки съедали шлейфы и давали рывки
let last=performance.now(),lag=0,sinceRender=0,fpsCount=0,fpsT=0,fpsShown=0;
function frame(now){
  const dt=Math.min(250,now-last);last=now;lag+=dt;
  // на слабом устройстве игра лучше чуть замедлится, чем будет перескакивать: не больше 4 шагов за кадр
  if(lag>STEP*4)lag=STEP*4;
  const wasGame=phase==='game';
  let ticks=0;
  while(lag>=STEP){
    if(phase==='game')step();
    else if(phase==='menu'){time++;moveDust();}
    lag-=STEP;ticks++;
  }
  sinceRender+=ticks;
  if(knobDirty){knobDirty=false;knob.style.transform='translate('+knobX+'px,'+knobY+'px)';}
  // на низкой графике кадр рисуется через шаг логики — ровные 30 кадров вместо рваных 40
  if(sinceRender>=(Q.fps30?2:1)&&(wasGame||phase==='game'||phase==='menu')){
    sinceRender=0;
    render(false);
    if(phase==='menu'&&menuScreen==='skins')drawPreview();
    fpsCount++;
    if(now-fpsT>=1000){fpsShown=Math.round(fpsCount*1000/(now-fpsT));fpsCount=0;fpsT=now;}
    // «Авто»: каждые 2 секунды игры сверяем среднюю длину кадра с целью (60 или 30 кадров)
    if(phase==='game'&&save.q==='auto'){
      if(!perfT)perfT=now;
      perfFrames++;
      const el=now-perfT;
      if(el>=2000){
        const avg=el/perfFrames;
        perfT=0;perfFrames=0;
        if(avg>(Q.fps30?34:17)*1.3)downgrade();
      }
    }
  }
  // пауза и меню не должны попадать в замер
  if(phase!=='game'){perfT=0;perfFrames=0;}
  requestAnimationFrame(frame);
}

// Аккаунт — это вход в claude.ai, своих паролей у игры нет. Прогресс лежит в личном разделе базы
// артефакта data/users/<id>/save (его не видит никто, даже владелец), рекорды — в общей таблице scores.
// Без входа всё работает как раньше: прогресс хранится только в этом браузере.
const ACCT_ROW='<div class="acct"><img class="acct-ava" alt="" hidden><div><b class="acct-name">Гость</b><small class="acct-status"></small></div></div>';
const ACCT_TEXT={
  guest:'прогресс только на этом устройстве',

  synced:'прогресс сохранён в аккаунте',
  saving:'сохраняю…',
  readonly:'только просмотр: попроси у владельца доступ «Участник»',
  error:'нет связи — сохраню при следующем изменении',

};
function setAcctState(s){

async function fillAccount(){

  }

async function fillTop(){
  const list=panelEl.querySelector('.top'),st=panelEl.querySelector('.top-status');
  if(!list)return;
  // на сайте таблица читается из своей базы и видна даже без входа
  if(NET_ON){
    st.textContent='Загружаю…';
    let rows;
    try{rows=await netTop();}catch(_){if(panelEl.contains(list))st.textContent='Не удалось загрузить таблицу: нет связи с сервером.';return;}
    if(!panelEl.contains(list))return;
    renderTop(list,st,rows,'Лучшие '+rows.length,r=>({name:r.name,avatarUrl:''}));
    return;
  }
  if(!acct.db){
    st.textContent=IN_CLAUDE?'Таблица рекордов работает, когда игра открыта со входом в claude.ai.'
      :'В этой копии игры общей таблицы нет. Твой рекорд: '+save.best+'.';
    return;
  }
  if(!acct.top){st.textContent='Загружаю…';return;}
  const rows=acct.top.filter(r=>r.best>0);
  const ps=rows.length?await acct.user.profiles(rows.map(r=>r.id)):{};
  if(!panelEl.contains(list))return;
  renderTop(list,st,rows,'Лучшие '+rows.length+' · обновляется само',r=>ps[r.id]||{name:'',avatarUrl:''});

// строки таблицы рекордов; имена — чужой ввод, поэтому только textContent
function renderTop(list,st,rows,head,who){
  if(!rows.length){st.textContent='Пока пусто — сыграй, и твой рекорд появится здесь.';list.textContent='';return;}
  st.textContent=head;
  list.textContent='';
  rows.forEach((r,i)=>{
    const p=who(r);
    const li=document.createElement('li');
    if(r.id===acct.id)li.className='me';
    const rk=document.createElement('span');rk.className='rk';rk.textContent=(i+1)+'.';
    const im=document.createElement('img');im.alt='';
    if(p.avatarUrl)im.src=p.avatarUrl;else im.hidden=true;
    const nm=document.createElement('span');nm.className='nm';nm.textContent=(p.name||'Игрок')+(r.sup?' ★':'')+(r.id===acct.id?' (ты)':'');
    const sc=document.createElement('span');sc.className='sc';sc.textContent=String(r.best);
    const sm=document.createElement('small');sm.textContent='ур. '+r.unlocked+(r.wins?' · побегов: '+r.wins:'');
    sc.appendChild(sm);
    li.append(rk,im,nm,sc);
    list.appendChild(li);
  });
}
// прогресс из аккаунта сливается с местным по максимуму, чтобы ничего не потерять между устройствами
function mergeCloud(d){
  if(!d)return;
  save.unlocked=Math.max(save.unlocked,pastFinal(clampInt(d.unlocked,1,LEVELS.length,1),clampInt(d.wins,0,1e6,0)));
  save.best=Math.max(save.best,Number(d.best)||0);
  save.wins=Math.max(save.wins||0,clampInt(d.wins,0,1e6,0));
  save.unlocked=pastFinal(save.unlocked,save.wins);
  // биты: заработанное — по максимуму, купленное — объединяем; облик берём из аккаунта,
  // чтобы он был одинаковым на всех устройствах
  save.earned=Math.max(save.earned,clampInt(d.earned,0,1e8,0));
  for(const id of parseOwn(d.own))if(save.own.indexOf(id)<0)save.own.push(id);
  save.color=clampInt(d.color,0,SKIN_COLORS.length-1,save.color);
  save.shape=clampInt(d.shape,0,SKIN_SHAPES.length-1,save.shape);
  save.trail=clampInt(d.trail,0,TRAILS.length-1,save.trail);
  save.hat=clampInt(d.hat,0,HATS.length-1,save.hat);
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(_){}
}
// одна запись за раз и только если прогресс поменялся
async function syncCloud(){
  if(acct.kind==='net')return netSync();
  if(!acct.db||acct.state==='readonly')return;
  if(acct.busy){acct.again=true;return;}
  const body=Object.assign({unlocked:save.unlocked,best:save.best,wins:save.wins||0},lookBody());
  const key=JSON.stringify(body),sk=save.best+'|'+save.unlocked+'|'+(save.wins||0);
  const needSave=key!==acct.cloudKey,needScore=save.best>0&&sk!==acct.scoreKey;
  if(!needSave&&!needScore){if(acct.state!=='synced')setAcctState('synced');return;}
  acct.busy=true;setAcctState('saving');
  try{
    if(needSave){await acct.db.doc('data/users/'+acct.id+'/save').set(body);acct.cloudKey=key;}
    if(needScore){await acct.db.doc('scores/'+acct.id).set({best:save.best,unlocked:save.unlocked,wins:save.wins||0,t:Date.now()});acct.scoreKey=sk;}
    setAcctState('synced');
  }catch(e){
    // invalid_argument на своей записи — у этого зрителя нет права писать (доступ «только просмотр»)
    setAcctState(e&&e.code==='invalid_argument'?'readonly':'error');
  }finally{
    acct.busy=false;
    if(acct.again){acct.again=false;syncCloud();}
  }
}
// облик, биты и принятая редакция соглашения — для записи в аккаунт
function lookBody(){return{color:save.color,shape:save.shape,trail:save.trail,hat:save.hat,earned:save.earned,own:save.own.join(','),terms:save.terms};}
async function initAccount(){
  if(NET_ON){await netInit();return;}
  if(!window.claude||typeof window.claude.use!=='function')return;
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);}catch(_){return;}
  if(!db||!user)return;
  const id=await user.id();
  if(!id)return;
  acct.kind='claude';acct.db=db;acct.user=user;acct.id=id;
  setAcctState('loading');
  try{
    const snap=await db.doc('data/users/'+id+'/save').get();
    if(snap.exists)mergeCloud(snap.data());
  }catch(_){}
  // таблица рекордов: одна подписка на всё время игры; чужие записи — недоверенные данные, приводим к числам
  db.collection('scores').orderBy('best','desc').limit(20).onSnapshot(s=>{
    acct.top=s.docs.map(d=>{
      const v=d.data()||{};
      return{id:d.id,best:Math.max(0,Math.floor(Number(v.best)||0)),unlocked:clampInt(v.unlocked,1,LEVELS.length,1),wins:clampInt(v.wins,0,1e6,0)};
    });
    if(!menuEl.hidden&&menuScreen==='top')fillTop();
  },()=>{if(!acct.top)acct.top=[];});
  await syncCloud();
  // перерисовать главное меню: из аккаунта могли прийти новые уровни и облик
  if(phase==='menu'&&!menuEl.hidden&&menuScreen==='main')showMenu('main');
}

const RETURN_URL=location.origin+location.pathname.replace(/index\.html$/,'');
const PROVIDERS=[
  {id:'vk',label:'Войти через VK ID',on:()=>!!ONLINE.vkAppId,name:'VK ID'},
  {id:'yandex',label:'Войти через Яндекс ID',on:()=>!!ONLINE.yandexClientId,name:'Яндекс ID'},
  {id:'google',label:'Войти через Google',on:()=>!!ONLINE.google,name:'Google'},
  {id:'apple',label:'Войти через Apple',on:()=>!!ONLINE.apple,name:'Apple'}
];
function netProviders(){return PROVIDERS.filter(p=>p.on());}
function netProviderName(){
  const u=NET.user||{},m=u.user_metadata||{},a=u.app_metadata||{};
  const id=m.provider==='vk'||m.provider==='yandex'||m.provider==='site'?m.provider:a.provider;
  if(id==='site')return 'логин на сайте';
  const p=PROVIDERS.find(x=>x.id===id);
  return p?p.name:'аккаунт';
}
function netHeaders(token){
  return{apikey:ONLINE.supabaseKey,Authorization:'Bearer '+(token||ONLINE.supabaseKey),'Content-Type':'application/json'};
}
// сервер, который не отвечает, не должен вешать вход навсегда
async function netFetch(path,opt){
  opt=Object.assign({},opt);
  let tm=0;
  if(typeof AbortController==='function'){const c=new AbortController();opt.signal=c.signal;tm=setTimeout(()=>c.abort(),15000);}
  let r;
  try{r=await fetch(ONLINE.supabaseUrl.replace(/\/+$/,'')+path,opt);}
  catch(e){const n=new Error('нет связи с сервером');n.status=0;throw n;}
  finally{clearTimeout(tm);}
  if(!r.ok){
    let t='';try{t=await r.text();}catch(_){}
    const e=new Error(t.slice(0,200)||('HTTP '+r.status));e.status=r.status;throw e;
  }
  const ct=r.headers.get('content-type')||'';
  return ct.indexOf('json')>=0?r.json():null;
}
function saveSess(s){
  NET.sess=s;
  try{if(s)localStorage.setItem(SESS_KEY,JSON.stringify(s));else localStorage.removeItem(SESS_KEY);}catch(_){}
}
function sessFrom(o){
  if(!o||!o.access_token||!o.refresh_token)throw new Error('сервер не выдал сессию');
  return{access_token:String(o.access_token),refresh_token:String(o.refresh_token),expires_at:Date.now()+(Number(o.expires_in)||3600)*1000};
}
// действующий токен; просроченный обновляется, отозванный — разлогинивает
let tokenWait=null;
function netToken(){
  const s=NET.sess;
  if(!s)return Promise.resolve(null);
  if(Date.now()<s.expires_at-60000)return Promise.resolve(s.access_token);
  if(!tokenWait)tokenWait=netRefresh(s).then(t=>{tokenWait=null;return t;});
  return tokenWait;
}
async function netRefresh(s){
  try{
    const o=await netFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:netHeaders(),body:JSON.stringify({refresh_token:s.refresh_token})});
    saveSess(sessFrom(o));
    return NET.sess.access_token;
  }catch(e){
    if(e.status===400||e.status===401||e.status===403){saveSess(null);NET.user=null;}
    return null;
  }
}
function b64url(bytes){
  let s='';const a=new Uint8Array(bytes);
  for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function randStr(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a).slice(0,n);}
async function netLogin(id){
  const p=PROVIDERS.find(x=>x.id===id&&x.on());
  if(!p)return;
  if(id==='google'||id==='apple'){
    location.href=ONLINE.supabaseUrl.replace(/\/+$/,'')+'/auth/v1/authorize?provider='+id+'&redirect_to='+encodeURIComponent(RETURN_URL);
    return;
  }
  if(!window.crypto||!crypto.subtle){NET.err='Вход через '+p.name+' работает только на сайте игры (адрес https://…).';showMenu(menuScreen==='gate'?'gate':'acct');return;}
  // PKCE: случайный verifier остаётся в этой вкладке, сервису уходит только его хэш
  const state=randStr(32),verifier=randStr(64);
  const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  try{sessionStorage.setItem(FLOW_KEY,JSON.stringify({provider:id,state,verifier}));}catch(_){}
  const q=new URLSearchParams({response_type:'code',client_id:id==='vk'?ONLINE.vkAppId:ONLINE.yandexClientId,redirect_uri:RETURN_URL,state,code_challenge:challenge,code_challenge_method:'S256'});
  if(id==='vk')q.set('scope','vkid.personal_info');
  location.href=(id==='vk'?'https://id.vk.com/authorize?':'https://oauth.yandex.ru/authorize?')+q.toString();
}
// возврат со страницы входа: забираем результат из адреса и сразу убираем его оттуда
async function netHandleReturn(){
  const hash=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);
  if(hash.has('access_token')){
    history.replaceState(null,'',RETURN_URL);
    saveSess(sessFrom({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_in:hash.get('expires_in')}));
    return;
  }
  if(hash.has('error')||hash.has('error_description')){
    history.replaceState(null,'',RETURN_URL);
    NET.err='Вход не удался: '+(hash.get('error_description')||hash.get('error')).slice(0,120);
    return;
  }
  if(!q.has('code')&&!q.has('error'))return;
  let flow=null;
  try{flow=JSON.parse(sessionStorage.getItem(FLOW_KEY)||'null');sessionStorage.removeItem(FLOW_KEY);}catch(_){}
  history.replaceState(null,'',RETURN_URL);
  if(q.has('error')){NET.err='Вход не удался: '+(q.get('error_description')||q.get('error')).slice(0,120);return;}
  if(!flow||flow.state!==q.get('state')){NET.err='Вход прерван — попробуй ещё раз.';return;}
  const o=await netFetch('/functions/v1/ru-login',{method:'POST',headers:netHeaders(),body:JSON.stringify({
    provider:flow.provider,code:q.get('code'),code_verifier:flow.verifier,device_id:q.get('device_id')||'',state:flow.state,redirect_uri:RETURN_URL
  })});
  saveSess(sessFrom(o));
}
// имя в рекордах по умолчанию: у аккаунта на сайте — его логин, у остальных — «Игрок-xxxx»,
// чтобы настоящее имя из VK, Яндекса или Google не попало в общую таблицу без спроса
function nickName(){
  const n=(save.nick||'').replace(/\s+/g,' ').trim().slice(0,20);
  if(n)return n;
  const m=NET.user&&NET.user.user_metadata||{};
  if(m.provider==='site'&&typeof m.name==='string'&&m.name)return m.name.slice(0,20);
  return 'Игрок-'+(NET.user?String(NET.user.id).slice(0,4):'0000');
}
// логин: латинские и русские буквы, цифры, «_», «-» и пробелы; большие и маленькие буквы не различаются
const LOGIN_RE=/^[a-z0-9а-яё_ -]{3,20}$/;
function loginName(v){return String(v).normalize('NFC').replace(/\s+/g,' ').trim();}
// служебный адрес: Supabase входит по почте, а у игрока её нет; писем на него не шлётся.
// Латинский логин и есть адрес (так заведены первые аккаунты); в адресе не бывает русских букв
// и пробелов, поэтому для остальных логинов адрес — начало SHA-256 от логина. Сервер (ru-login) считает так же
async function siteEmail(login){
  if(/^[a-z0-9_-]+$/.test(login))return login+'@player.data-out.app';
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('data-out:'+login)));
  return 'u'+[...h.slice(0,20)].map(x=>x.toString(16).padStart(2,'0')).join('')+'@player.data-out.app';
}
// сервер отвечает JSON с ошибкой — достаём из него текст
function errMsg(e){
  let t=String(e&&e.message||e);
  try{const o=JSON.parse(t);t=String(o.error_description||o.msg||o.message||o.error||t);}catch(_){}
  return t.slice(0,120);
}
function siteErr(mode,e){
  if(!e||!e.status)return 'Нет связи с сервером. Проверь интернет и попробуй ещё раз.';
  if(mode==='signup'&&e.status===409)return 'Этот логин уже занят — придумай другой или войди.';
  if(mode==='signin'&&(e.status===400||e.status===401))return 'Неверный логин или пароль.';
  if(e.status===429)return 'Слишком много попыток — подожди минуту.';
  return 'Не получилось: '+errMsg(e);
}
// регистрация и вход по логину и паролю; пароль уходит только на сервер игры
async function netSiteAuth(mode,form){
  const lg=form.querySelector('#lg-login'),pw=form.querySelector('#lg-pass'),pw2=form.querySelector('#lg-pass2');
  const er=form.querySelector('.err'),btn=form.querySelector('button[type="submit"]');
  if(btn.disabled)return;
  const fail=(t,el)=>{er.textContent=t;er.hidden=false;if(el)el.focus();};
  const name=loginName(lg.value),login=name.toLowerCase(),pass=pw.value;
  if(!LOGIN_RE.test(login))return fail('Логин — от 3 до 20 знаков: буквы, цифры, пробел, «_» или «-».',lg);
  if(pass.length<8)return fail('Пароль — от 8 символов.',pw);
  if(pw2&&pw2.value!==pass)return fail('Пароли не совпадают.',pw2);
  const label=btn.textContent;
  btn.disabled=true;btn.textContent='Подключаюсь…';er.hidden=true;
  try{
    const o=mode==='signup'
      ?await netFetch('/functions/v1/ru-login',{method:'POST',headers:netHeaders(),body:JSON.stringify({provider:'site',login:name,password:pass})})
      :await netFetch('/auth/v1/token?grant_type=password',{method:'POST',headers:netHeaders(),body:JSON.stringify({email:await siteEmail(login),password:pass})});
    saveSess(sessFrom(o));
  }catch(e){
    if(!panelEl.contains(form))return;
    btn.disabled=false;btn.textContent=label;
    return fail(siteErr(mode,e));
  }
  NET.err='';
  if(phase==='menu')showMenu('main');
  await netLoadUser();
}
async function netSync(){
  if(!NET.user)return;
  if(acct.busy){acct.again=true;return;}
  const body=Object.assign({user_id:NET.user.id,name:nickName(),unlocked:save.unlocked,best:save.best,wins:save.wins||0},lookBody());
  const key=JSON.stringify(body);
  if(key===acct.cloudKey){if(acct.state!=='synced')setAcctState('synced');return;}
  acct.busy=true;setAcctState('saving');
  try{
    const tok=await netToken();
    if(!tok)throw new Error('нет входа');
    await netFetch('/rest/v1/progress?on_conflict=user_id',{method:'POST',
      headers:Object.assign(netHeaders(tok),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});
    acct.cloudKey=key;setAcctState('synced');
  }catch(e){
    setAcctState(NET.user?'error':'netout');
  }finally{
    acct.busy=false;
    if(acct.again){acct.again=false;netSync();}
  }
}
// лучшие 20; строки чужие, поэтому приводим к числам и обрезаем имена
async function netTop(){
  const rows=await netFetch('/rest/v1/progress?select=user_id,name,best,unlocked,wins&best=gt.0&order=best.desc&limit=20',{headers:netHeaders()});
  const list=(Array.isArray(rows)?rows:[]).map(v=>({
    id:String(v.user_id),name:typeof v.name==='string'?v.name.slice(0,20):'',
    best:Math.max(0,Math.floor(Number(v.best)||0)),unlocked:clampInt(v.unlocked,1,LEVELS.length,1),wins:clampInt(v.wins,0,1e6,0),sup:false
  }));
  // звёзды поддержки — отдельной таблицей; не загрузилась — таблица рекордов всё равно показывается
  const ids=list.map(r=>r.id).filter(id=>/^[0-9a-f-]{36}$/i.test(id));
  if(DONATE_ON&&ids.length)try{
    const sup=await netFetch('/rest/v1/supporters?select=user_id&user_id=in.('+ids.join(',')+')',{headers:netHeaders()});
    const set={};(Array.isArray(sup)?sup:[]).forEach(x=>{set[String(x.user_id)]=1;});
    list.forEach(r=>{r.sup=!!set[r.id];});
  }catch(_){}
  return list;
}
// поддержал ли игрок: строку в supporters пишет только функция yoomoney-hook
async function netSupLoad(){
  if(!DONATE_ON||!NET.user)return;
  try{
    const tok=await netToken();
    const rows=await netFetch('/rest/v1/supporters?select=user_id&user_id=eq.'+encodeURIComponent(NET.user.id),{headers:netHeaders(tok)});
    NET.sup=Array.isArray(rows)&&rows.length>0;
  }catch(_){}
}
// после оплаты ЮMoney сообщает о ней не сразу — проверяем несколько раз с паузой
async function supPoll(n){
  if(!NET.user)return;
  await netSupLoad();
  if(phase==='menu'&&!menuEl.hidden&&(menuScreen==='donate'||menuScreen==='skins'))showMenu(menuScreen);
  if(NET.sup){NET.thanks=false;msg('Спасибо за поддержку! Набор «Поддержка» открыт.',6000);return;}
  if(n<6)setTimeout(()=>supPoll(n+1),5000);
  else if(menuScreen==='donate')msg('Поддержка пока не пришла. Если оплата прошла, загляни сюда через пару минут.',6000);
}
// оплата — обычной формой ЮMoney; в метке — id игрока, по нему функция узнаёт, кому открыть набор
function payYoomoney(){
  if(!DONATE_ON||!NET.user)return;
  const f=document.createElement('form');
  f.method='POST';f.action='https://yoomoney.ru/quickpay/confirm';f.acceptCharset='utf-8';f.hidden=true;
  const add=(k,v)=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v);f.appendChild(i);};
  add('receiver',ONLINE.yoomoney);add('quickpay-form','button');add('targets','Поддержка игры DATA.OUT');
  add('paymentType',donPay);add('sum',donSum);add('label',NET.user.id);add('successURL',RETURN_URL+'?donated=1');
  document.body.appendChild(f);
  f.submit();
}
async function netInit(){
  acct.kind='net';
  try{const s=JSON.parse(localStorage.getItem(SESS_KEY)||'null');if(s&&s.refresh_token)NET.sess=s;}catch(_){}
  // вернулись со страницы оплаты ЮMoney
  if(/[?&]donated=/.test(location.search)){NET.thanks=true;history.replaceState(null,'',RETURN_URL);}
  // вернулись со страницы VK или Яндекса — пока функция проверяет код, показываем «подключаю»
  if(/[?&#](code|access_token|error)=/.test(location.search+location.hash))setAcctState('loading');
  try{await netHandleReturn();}catch(e){NET.err='Не получилось войти: '+errMsg(e);}
  // экран входа рисуется без сервера, поэтому появляется сразу, даже когда связи нет
  if(!NET.sess){setAcctState('netout');maybeGate();return;}
  await netLoadUser();
}
async function netLoadUser(){
  setAcctState('loading');
  const tok=await netToken();
  // нет связи — играем с тем, что есть в браузере; сессию отозвали — снова экран входа
  if(!tok){if(NET.sess)setAcctState('error');else{setAcctState('netout');maybeGate();}return;}
  try{
    NET.user=await netFetch('/auth/v1/user',{headers:netHeaders(tok)});
    acct.id=NET.user.id;
    const rows=await netFetch('/rest/v1/progress?user_id=eq.'+encodeURIComponent(NET.user.id)+'&select=*',{headers:netHeaders(tok)});
    if(Array.isArray(rows)&&rows[0]){
      mergeCloud(rows[0]);
      if(!save.nick&&rows[0].name)save.nick=String(rows[0].name).slice(0,20);
    }
    await netSync();
    await netSupLoad();
    if(NET.thanks&&termsOk()){if(phase==='menu')showMenu('donate');supPoll(1);return;}
  }catch(e){
    if(e.status===401||e.status===403){saveSess(null);NET.user=null;setAcctState('netout');maybeGate();return;}
    setAcctState('error');
  }
  if(phase==='menu'&&!menuEl.hidden&&(menuScreen==='main'||menuScreen==='acct'))showMenu(menuScreen);
}
async function netLogout(){
  clearTimeout(acct.tm);
  if(NET.user)await netSync();
  const kept=acct.state==='synced';
  const tok=NET.sess&&NET.sess.access_token;
  saveSess(null);NET.user=null;acct.id=null;acct.cloudKey='';NET.err='';NET.sup=false;
  // прогресс, имя в рекордах и облик принадлежат аккаунту и уже лежат в нём; настройки устройства остаются.
  // Если сохранить не удалось (нет связи), прогресс не стираем — он досохранится при следующем входе
  save.nick='';
  if(kept)Object.assign(save,{unlocked:1,best:0,wins:0,earned:0,own:[],color:0,shape:0,trail:0,hat:0});
  persist();
  setAcctState('netout');
  showMenu('gate');
  // выход на сервере — по возможности; локально сессия уже стёрта
  if(tok)try{await netFetch('/auth/v1/logout',{method:'POST',headers:netHeaders(tok)});}catch(_){}
}
// без ?. и ?? — так скрипт запускается и в старых браузерах
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(snapshot);
function start(d){
  if(!restore(d)){clearField();lvl=0;phase='menu';menuScreen='main';}
  ready=true;
  place();
  buildBg();
  if(phase==='menu')showMenu(termsOk()?menuScreen||'main':'terms');
  else showMenu({pause:'pause',dead:'dead',clear:'clear',win:'win'}[phase]||'pause');
  render(true);
  last=performance.now();
  requestAnimationFrame(frame);
  initAccount();
}
if(hot&&hot.ready)hot.ready(start);
else start(hot&&hot.data?hot.data:{});
